<!doctype html>
<html lang="vi">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Merriweather+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chấm công &amp; Tính lương 2026 – Peqqa</title>
<link rel="icon" type="image/png" href="peqqa_logo.png">
<style>
:root{
  --bg:#faf1f6; --panel:#fff; --ink:#1e293b; --ink2:#334155; --muted:#64748b; --line:#edd5e2; --line2:#e0d0da;
  --nav:#181422; --nav2:rgba(255,255,255,.08); --navink:#e2e8f0;
  --navy:#181422; --rust:#be185d; --orange:#e13977;
  --accent:#3a5be0; --accent-d:#2b49c7; --accent-l:#eff6ff;
  --input:#fffbe5; --input-b:#efe2a6;
  --ok:#0b7a43; --ok-l:#e5f5ec; --warn:#a85200; --warn-l:#fff3e2; --bad:#b4291f; --bad-l:#fdecea;
  --sun:#fdf2f7; --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
/* NAV */
.nav{background:linear-gradient(172deg,#181422 0%,#24152b 50%,#2e1732 100%);color:var(--navink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:16px 16px 14px;border-bottom:1px solid rgba(255,255,255,.1);position:relative}
.brand .dots{height:6px;margin:0 0 12px;background:radial-gradient(circle,rgba(255,255,255,.35) 1.2px,transparent 1.6px) 0 0/9px 6px repeat-x;width:120px}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none}
.logo svg{flex:none;width:34px;height:34px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
.logo .wm{font-weight:800;color:#fff;font-size:15px;line-height:1.1;letter-spacing:.1px}.logo .wm i{font-style:normal;color:var(--orange)}
.logo .sl{display:block;font-weight:500;font-size:10.5px;color:#aab6cf;letter-spacing:.6px;margin-top:2px}
.apptitle{margin-top:14px;line-height:1.05}
.apptitle .tag0{display:inline-block;background:var(--orange);color:#1b2a4e;font-size:10px;font-weight:800;letter-spacing:.4px;padding:3px 9px;border-radius:20px;margin-bottom:7px}
.apptitle b{display:block;color:#fff;font-size:21px;font-weight:800;letter-spacing:.3px}
.apptitle em{display:block;font-style:normal;color:var(--orange);font-size:14px;font-weight:800;letter-spacing:.4px;margin-top:3px}
.ctybtn{display:flex;align-items:center;gap:7px;width:100%;margin-top:12px;padding:7px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;text-align:left;font-size:13px}
.ctybtn:hover{background:rgba(255,255,255,.15)}.ctybtn span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}.ctybtn b{color:var(--orange);font-size:11px}
#ctyTbl td{vertical-align:middle}#ctyTbl tr.cur td{background:var(--accent-l)}
.hotline{display:flex;align-items:center;gap:10px;margin:0 0 10px;padding:9px 11px;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#fff;text-decoration:none}
.hotline:hover{background:rgba(255,255,255,.16)}
.hotline .hi{flex:none;width:30px;height:30px;border-radius:50%;background:var(--orange);display:grid;place-items:center}
.hotline .hl{font-size:10.5px;color:#e7d6cf;letter-spacing:.3px;text-transform:uppercase;font-weight:600}
.hotline .hn{font-size:16px;font-weight:800;letter-spacing:.3px;color:#fff}
.navweb{display:block;color:#f1c7b3;text-decoration:none;font-size:12px;margin-bottom:6px}.navweb:hover{color:#fff}
.nav nav{padding:10px 8px;flex:1;overflow:auto}
.nav nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--navink);padding:7px 12px;border-radius:6px;cursor:pointer;text-align:left;font-size:14px}
.nav nav button:hover{background:var(--nav2);color:#fff}
.nav nav button.on{background:linear-gradient(135deg,#e13977,#f43f5e);color:#fff;box-shadow:0 6px 18px rgba(225,57,119,.35)}
.nav nav button .ic{width:18px;text-align:center;opacity:.9}
.nav nav .sep{height:1px;background:rgba(255,255,255,.1);margin:8px 6px}
.navfoot{padding:12px 16px;font-size:12px;color:#9eabc6;border-top:1px solid rgba(255,255,255,.1)}
.navfoot b{color:#fff;font-weight:600}
/* MAIN */
main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:16px;padding:14px 24px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;box-shadow:inset 0 3px 0 0 transparent;background-image:linear-gradient(90deg,#1b2a4e,#4a3245 55%,#d4531a);background-size:100% 3px;background-repeat:no-repeat}
.topbar h1{font-size:19px;margin:0;font-weight:650;flex:1}
.period{display:flex;align-items:center;gap:8px;background:var(--accent-l);border:1px solid #f5c7ae;padding:5px 10px;border-radius:8px}
.period label{font-size:13px;color:var(--accent-d);font-weight:600}
.period select{border:1px solid #f5c7ae;background:#fff;border-radius:6px;padding:4px 6px}
#saveState{font-size:12px;color:var(--muted);min-width:110px;text-align:right}
#view{padding:20px 24px 40px}
/* COMMON */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 10px;font-weight:650}
.card h3{font-size:14px;margin:14px 0 8px;font-weight:650;color:var(--ink2)}
.muted{color:var(--muted)} .small{font-size:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1}
.btn{border:1px solid var(--line2);background:#fff;padding:7px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent-d)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-d);color:#fff}
.btn.danger{color:var(--bad);border-color:#efc2bd}
.btn.danger:hover{background:var(--bad-l)}
.btn.sm{padding:3px 8px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
input.f,select.f,textarea.f{border:1px solid var(--line2);border-radius:6px;padding:6px 9px;background:#fff;min-width:0}
input.f:focus,select.f:focus,textarea.f:focus{outline:2px solid #f6b89c;border-color:var(--accent)}
input.in,td.in input{background:var(--input);border:1px solid var(--input-b)}
.search{min-width:240px}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff;max-height:calc(100vh - 210px)}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.t th{position:sticky;top:0;background:#f6f7f9;border-bottom:1px solid var(--line2);padding:8px 8px;text-align:left;font-weight:600;color:var(--ink2);white-space:nowrap;z-index:2}
table.t td{border-bottom:1px solid var(--line);padding:6px 8px;white-space:nowrap}
table.t tr:hover td{background:#fafbfc}
table.t tfoot td{position:sticky;bottom:0;background:#eef1f7;font-weight:650;border-top:1px solid var(--line2)}
table.t td.strong{font-weight:650}
table.t.bl{font-size:12.5px}
table.t.bl th{white-space:normal;vertical-align:bottom;min-width:64px;padding:7px 6px;line-height:1.25}
table.t.bl td{padding:6px 6px}
table.t.bl th:nth-child(1),table.t.bl td:nth-child(1){position:sticky;left:0;background:#fff;z-index:1;min-width:66px}
table.t.bl th:nth-child(2),table.t.bl td:nth-child(2){position:sticky;left:66px;background:#fff;z-index:1;min-width:150px;border-right:1px solid var(--line2)}
table.t.bl thead th:nth-child(-n+2){z-index:3;background:#f6f7f9}
table.t.bl tfoot td:nth-child(-n+2){background:#eef1f7;z-index:3}
table.t.bl td.tl,table.t.bl th.tl{background:#fff3ec;position:sticky;right:0;z-index:1;border-left:1px solid var(--line2);min-width:100px}
table.t.bl thead th.tl{z-index:3}
table.t.bl tfoot td.tl{z-index:3;background:#fde3d4}

.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11.5px;background:#eef0f4;color:var(--ink2)}
.tag.ok{background:var(--ok-l);color:var(--ok)} .tag.warn{background:var(--warn-l);color:var(--warn)} .tag.bad{background:var(--bad-l);color:var(--bad)}
.warnico{color:var(--warn);cursor:help;font-weight:700}
.empty{padding:40px;text-align:center;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.kpi b{display:block;font-size:20px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi.hl{border-color:#f6b89c;background:var(--accent-l)}
.steps{margin:0;padding-left:20px} .steps li{margin:4px 0}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line2);margin-bottom:14px}
.subtabs button{border:0;background:none;padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;color:var(--ink2);font-weight:550}
.subtabs button.on{border-bottom-color:var(--accent);color:var(--accent-d)}
/* CHẤM CÔNG GRID */
.palette{display:flex;gap:4px;align-items:center}
.palette button{min-width:38px;padding:5px 8px;border:1px solid var(--line2);background:#fff;border-radius:6px;cursor:pointer;font-weight:650}
.palette button.on{outline:2px solid var(--accent);outline-offset:1px}
table.cc{border-collapse:separate;border-spacing:0;font-size:12.5px;user-select:none}
table.cc th,table.cc td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;height:28px;text-align:center}
table.cc thead th{position:sticky;top:0;background:#f6f7f9;z-index:3;font-weight:600;padding:2px 0;line-height:1.2}
table.cc thead tr:nth-child(2) th{top:22px;font-weight:500;color:var(--muted);font-size:11px}
table.cc .c1,table.cc .c2{position:sticky;background:#fff;z-index:2;text-align:left;padding:0 8px;white-space:nowrap}
table.cc .c1{left:0;width:70px;min-width:70px} table.cc .c2{left:70px;min-width:170px;border-right:2px solid var(--line2)}
table.cc thead .c1,table.cc thead .c2{z-index:4;background:#f6f7f9}
table.cc td.d{width:31px;min-width:31px;cursor:pointer;font-weight:650}
table.cc .off{background:var(--sun)}
table.cc td.d:focus{outline:2px solid var(--accent);outline-offset:-2px}
table.cc td.d.X{color:var(--ok)} table.cc td.d.N{color:var(--warn);background:#fff6e8}
table.cc td.d.P{color:#1d4ed8;background:#eaf0ff} table.cc td.d.L{color:#6d28d9;background:#f2ecff} table.cc td.d.KL{color:var(--bad);background:var(--bad-l)}
table.cc td.tot{min-width:52px;padding:0 6px;text-align:right;font-variant-numeric:tabular-nums;background:#f7f8fb}
table.cc td.tot.over{color:var(--bad);font-weight:700}
table.cc td.inp{padding:2px}
table.cc td.inp input{width:74px;height:24px;text-align:right;border-radius:4px;padding:0 5px;font-size:12.5px}
table.cc td.inp input.w{width:100px}
table.cc th.tot{min-width:52px;padding:0 6px}
table.cc td.inp input.gc{width:190px;text-align:left}
table.cc td.inp input[readonly]{background:#f1f3f6;color:var(--muted);cursor:not-allowed}
table.cc .le{background:#f2ecff} table.cc thead th.le{color:#6d28d9}
table.tc .c1{width:88px;min-width:88px} table.tc .c2{left:88px} table.tc th.tot{min-width:64px;font-size:11.5px}
table.tc td.h{width:36px;min-width:36px;padding:1px}
table.tc td.h input{width:34px;height:24px;border:0;background:transparent;text-align:center;font:inherit;font-weight:650;color:var(--accent-d);border-radius:3px}
table.tc td.h input:focus{outline:2px solid var(--accent);background:#fff}
table.tc td.h.vuot input{color:var(--bad);background:var(--bad-l)}
table.tc tfoot td{background:#f6f7f9;font-weight:650;font-size:11.5px}
.tcleg{display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:12.5px;margin:8px 0}
.tcleg i{display:inline-block;width:14px;height:14px;border:1px solid var(--line2);border-radius:3px;vertical-align:-2px;margin-right:4px}
.kpibo{margin-bottom:14px}.kpibo h2{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
table.kp td.inp input{width:74px;padding:3px 6px}table.kp th.tc{white-space:normal;min-width:96px;max-width:150px;font-weight:600;vertical-align:bottom}
.ksum{font-weight:700}.ksum.ok{color:var(--ok)}.ksum.bad{color:var(--bad)}
.kpiset{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:end}.kpiset label{display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.ccbox{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);background:var(--accent-l);border:1px solid #f5c7ae;border-radius:7px;padding:2px 4px 2px 9px}
.ccbox input{width:56px;padding:3px 6px;text-align:right}.ccbox a{text-decoration:none;font-weight:700;color:var(--accent-d);padding:0 4px}
.gcbox{margin-top:10px}.gcbox textarea{width:100%;min-height:54px;resize:vertical}
#print .gcp{font-size:11px;margin-top:8px;white-space:pre-line}
#print table.cc{font-size:9px}#print table.cc th,#print table.cc td{position:static!important;border:1px solid #bbb;height:auto;padding:2px 2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend b{font-weight:700;margin-right:3px}
.daylist .row{display:flex;align-items:center;gap:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
.daylist .row .who{min-width:260px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line2);background:#fff;padding:4px 10px;cursor:pointer;font-weight:650;min-width:40px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff}
/* FORMS */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink2);font-weight:550}
.form label.full{grid-column:1/-1}
.form .hint{font-weight:400;color:var(--muted);font-size:11.5px}
.cfg-grid{display:grid;grid-template-columns:minmax(220px,1.3fr) 170px 1.5fr;gap:6px 14px;align-items:center}
.cfg-grid .lab{font-weight:550;color:var(--ink2)}
.cfg-grid .note{font-size:12px;color:var(--muted)}
.cfg-grid input.f,.cfg-grid select.f{width:100%}
.pct{position:relative}.kpiset .pct,#kpiBody td .pct{display:inline-block;width:auto}.pct input{padding-right:24px}.pct::after{content:"%";position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12px}
/* MODAL / TOAST */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:60px 16px;z-index:100}
.modal.hidden{display:none}
.modal .box{background:#fff;border-radius:10px;width:min(640px,100%);max-height:calc(100vh - 120px);overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal .hd{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:650;font-size:15px}
.modal .bd{padding:16px 18px}
.modal .ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
#toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:200}
#toast div{background:#1f2937;color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:420px}
#toast div.err{background:var(--bad)} #toast div.ok{background:var(--ok)}
.alert{padding:10px 12px;border-radius:6px;background:var(--warn-l);color:#6b3a00;border:1px solid #f2d3a7;margin-bottom:12px;font-size:13px}
.alert.info{background:var(--accent-l);color:#8a3510;border-color:#f5c7ae}
.alert ul{margin:4px 0 0;padding-left:18px}
/* PHIẾU LƯƠNG */
.slips{display:flex;flex-direction:column;gap:18px;align-items:center}
.slip{background:#fff;border:1px solid var(--line2);width:720px;max-width:100%;padding:22px 28px;font-size:13px}
.slip .co{display:flex;justify-content:space-between;gap:10px;font-size:12px}
.slip .co b{font-size:13px}
.slip h2{text-align:center;margin:12px 0 2px;font-size:18px;letter-spacing:.5px}
.slip .per{text-align:center;color:var(--ink2);margin-bottom:12px}
.slip .who{display:grid;grid-template-columns:1fr 1fr;gap:2px 20px;margin-bottom:10px}
.slip table{width:100%;border-collapse:collapse}
.slip td{border:1px solid #c9ced8;padding:5px 8px}
.slip td.n{text-align:right;font-variant-numeric:tabular-nums;width:170px}
.slip tr.sec td{background:#f1f3f6;font-weight:650}
.slip tr.big td{font-weight:700;font-size:14px;background:#fff1ea}
.slip .chu{margin-top:6px;font-style:italic}
.slip .sign{display:grid;grid-template-columns:1fr 1fr;text-align:center;margin-top:16px;height:84px}
.slip .sign i{display:block;font-size:11.5px;color:var(--muted)}
.slip .by{text-align:center;font-size:10.5px;color:var(--muted);margin-top:6px}
/* CÔNG THỨC */
.fxwrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.fx{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px}
.fx.err{border-color:#efc2bd;background:#fffafa}
.fx .fxh{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.fx .fxh b{font-size:13.5px}
code{font-family:Consolas,"SFMono-Regular",Menlo,monospace;font-size:12px;background:#f1f3f6;padding:1px 5px;border-radius:4px;color:#8a3510;white-space:normal;word-break:break-word}
textarea.code{width:100%;resize:vertical;line-height:1.45;font-family:Consolas,"SFMono-Regular",Menlo,monospace;font-size:12.5px;background:var(--input);border:1px solid var(--input-b)}
.fxs{font-size:12.5px;margin:5px 0 3px;display:flex;gap:14px;flex-wrap:wrap}
.fxs .ok{color:var(--ok);font-weight:650}.fxs .bad{color:var(--bad);font-weight:600}.fxs .muted{color:var(--muted)}
.varpanel{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.varpanel h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:12px 0 4px}
.varpanel .v{display:flex;justify-content:space-between;gap:8px;padding:3px 5px;border-radius:4px;cursor:pointer;font-size:12px}
.varpanel .v:hover{background:var(--accent-l)}
.varpanel .v code{background:none;padding:0}
.varpanel .v span{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.ex{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:12.5px}
.ex:first-of-type{border-top:0}.ex div{flex:1}
@media(max-width:1100px){.fxwrap{grid-template-columns:1fr}.varpanel{position:static;max-height:none}}
/* CHẤM CÔNG – mới */
label.ck{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:inherit}
.form label.ck{flex-direction:row;justify-content:flex-start;align-items:center;gap:8px;font-weight:500}
.form label>input.f:not([type=checkbox]),.form label>select.f,.form label>textarea.f{width:100%;max-width:100%}
.form{min-width:0}
.bulk{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:13px}
.bulk select.f,.bulk input.f{padding:4px 6px}.bulk input[type=number]{width:64px}

const ccKey=(ma,y,m)=>ma+'|'+pk(y,m);
function isOff(cfg,y,m,d){const w=wday(y,m,d);return w===0||(cfg.nghiT7&&w===6);}

function congChuanTD(cfg,y,m){let c=0;for(let d=1;d<=dim(y,m);d++)if(!isOff(cfg,y,m,d))c++;return c;}
/* Công chuẩn: sửa riêng từng tháng > cố định (VD 26) > tự tính theo lịch (giống Excel) */
function congChuan(cfg,y,m){const o=+((cfg.ccThang||{})[pk(y,m)]);if(o>0)return o;if(cfg.ccKieu==='codinh'&&+cfg.ccCoDinh>0)return +cfg.ccCoDinh;return congChuanTD(cfg,y,m);}
const ccSua=(cfg,y,m)=>+((cfg.ccThang||{})[pk(y,m)])>0;
function ccBoxHTML(y,m){const c=DB.cfg,cc=congChuan(c,y,m),s=ccSua(c,y,m);

function ccBoxBind(y,m,re){$$('[data-ccm]').forEach(i=>i.onchange=()=>{const v=parseNum(i.value);if(!(v>0&&v<=31)){toast('Công chuẩn phải từ 1 đến 31','err');re();return;}
    const c=DB.cfg;c.ccThang=c.ccThang||{};const goc=c.ccKieu==='codinh'?+c.ccCoDinh:congChuanTD(c,y,m);if(v===goc)delete c.ccThang[pk(y,m)];else c.ccThang[pk(y,m)]=v;save();toast(`Công chuẩn tháng ${m}/${y} = ${fmt(v)}`,'ok');re();});
  $$('[data-ccrs]').forEach(a=>a.onclick=e=>{e.preventDefault();delete DB.cfg.ccThang[pk(y,m)];save();re();});}
function getDays(db,ma,y,m){return db.cc[ccKey(ma,y,m)]||[];}
function setDay(db,ma,y,m,d,code){
  const k=ccKey(ma,y,m);let a=db.cc[k];
  if(!a){if(!code)return;a=db.cc[k]=new Array(dim(y,m)).fill('');}
  while(a.length<dim(y,m))a.push('');
  a[d-1]=code||'';if(a.every(x=>!x))delete db.cc[k];
  if(db.tcNgay&&db.tcNgay[k])syncTC(db,ma,y,m);
}

function loaiNgay(db,ma,y,m,d){if(isLe(db,y,m,d)||(ma&&getDays(db,ma,y,m)[d-1]==='L'))return 'le';return isOff(db.cfg,y,m,d)?'nghi':'thuong';}

function setTcNgay(db,ma,y,m,d,h){
  db.tcNgay=db.tcNgay||{};const k=ccKey(ma,y,m);let a=db.tcNgay[k];h=+h||0;
  if(!a){if(!h)return;a=db.tcNgay[k]=new Array(dim(y,m)).fill(0);}
  while(a.length<dim(y,m))a.push(0);a[d-1]=h;syncTC(db,ma,y,m);
}
function tongTcNgay(db,ma,y,m){const t={thuong:0,nghi:0,le:0};getTcNgay(db,ma,y,m).forEach((h,i)=>{if(+h)t[loaiNgay(db,ma,y,m,i+1)]+=+h;});
  Object.keys(t).forEach(x=>t[x]=Math.round(t[x]*100)/100);return t;}
/* Có bảng tăng ca theo ngày → giờ TC tháng (thường / ngày nghỉ / lễ) lấy tổng từ bảng ngày */
function syncTC(db,ma,y,m){const k=ccKey(ma,y,m),a=(db.tcNgay||{})[k];if(!a)return;

function getNhap(db,ma,y,m){return db.nhap[ccKey(ma,y,m)]||{};}

function cleanNhap(db,k){const o=db.nhap[k];if(!o)return;if(o.pc&&!Object.keys(o.pc).length)delete o.pc;if(o.sl&&!Object.keys(o.sl).length)delete o.sl;
  if(!o.tc&&!o.tcNghi&&!o.tcLe&&!o.tamUng&&!o.pc&&!o.sl&&!o.bh&&o.lbh==null&&!o.gcCC&&!o.gcBL&&!o.gcTC)delete db.nhap[k];}
/* Ngày công = Σ công của từng ký hiệu (mặc định: X + 0,5×N + P + L, đúng như Excel) */
function demCong(db,ma,y,m){
  const l=db.kyHieu||KH_DEF,km={},c={so:{},ngayCong:0,diLam:0};
  l.forEach(k=>{km[k.ma]=k;c.so[k.ma]=0;});

  ['X','N','P','L','KL'].forEach(k=>c[k]=c.so[k]||0);c.phep=c.P;return c;
}

function thueLuyTien(cfg,tn){
  if(tn<=0)return 0;let idx=-1;
  cfg.bieuThue.forEach((b,i)=>{if(b.tu<=tn)idx=i;});

}

function roundX(x,d,mode){
  x=Number(x);if(!isFinite(x))return 0;d=Math.trunc(Number(d)||0);
  const p=Number(x.toPrecision(15)),f=Math.pow(10,Math.abs(d));
  const a=Number((d>=0?Math.abs(p)*f:Math.abs(p)/f).toPrecision(15));
  const r=mode==='up'?Math.ceil(a):mode==='down'?Math.floor(a):Math.round(a);
  return (Math.sign(p)*(d>=0?r/f:r*f))||0;
}
const FN={IF:[2,3,'IF(điều kiện, nếu đúng, nếu sai)'],MIN:[1,99,'MIN(a, b, …) — số nhỏ nhất'],MAX:[1,99,'MAX(a, b, …) — số lớn nhất'],
  ROUND:[1,2,'ROUND(x, n) — làm tròn; n = −3 là làm tròn hàng nghìn'],ROUNDUP:[1,2,'ROUNDUP(x, n) — làm tròn lên'],ROUNDDOWN:[1,2,'ROUNDDOWN(x, n) — làm tròn xuống'],
  INT:[1,1,'INT(x) — phần nguyên'],ABS:[1,1,'ABS(x) — trị tuyệt đối'],AND:[1,99,'AND(đk1, đk2, …)'],OR:[1,99,'OR(đk1, đk2, …)'],NOT:[1,1,'NOT(đk)'],
  THUE_LUY_TIEN:[1,1,'THUE_LUY_TIEN(x) — thuế theo biểu lũy tiến ở Cấu hình']};
function mkFn(n,a){
  const d=e=>a[1]?a[1](e):0;
  switch(n){
    case 'IF':return e=>a[0](e)?a[1](e):(a[2]?a[2](e):0);
    case 'MIN':return e=>Math.min(...a.map(x=>x(e)));
    case 'MAX':return e=>Math.max(...a.map(x=>x(e)));
    case 'ROUND':return e=>roundX(a[0](e),d(e));
    case 'ROUNDUP':return e=>roundX(a[0](e),d(e),'up');
    case 'ROUNDDOWN':return e=>roundX(a[0](e),d(e),'down');
    case 'INT':return e=>Math.floor(a[0](e));
    case 'ABS':return e=>Math.abs(a[0](e));
    case 'AND':return e=>a.every(x=>x(e))?1:0;
    case 'OR':return e=>a.some(x=>x(e))?1:0;
    case 'NOT':return e=>a[0](e)?0:1;
    case 'THUE_LUY_TIEN':return e=>thueLuyTien(e.__cfg,a[0](e));
  }
}
function buildF(s,ids){
  const T=[];let i=0;
  const near=p=>' (gần “'+s.slice(Math.max(0,p-8),p+8).trim()+'”)';
  while(i<s.length){const ch=s[i];
    if(/\s/.test(ch)){i++;continue;}
    if(/[0-9.]/.test(ch)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;const t=s.slice(i,j);
      if(/^[1-9]\d{0,2}(\.\d{3}){2,}$/.test(t)||/^[1-9]\d{0,2}\.000$/.test(t)||/^[1-9]\d{1,2}\.\d{3}$/.test(t))throw new Error('Viết số không dùng dấu chấm phân cách nghìn: '+t.replace(/\./g,'')+' (số thập phân viết 1.5)');
      if(!/^(\d+(\.\d*)?|\.\d+)$/.test(t))throw new Error('Số không hợp lệ “'+t+'”');
      T.push({t:'n',v:parseFloat(t),p:i});i=j;continue;}
    if(/[A-Za-z_]/.test(ch)){let j=i;while(j<s.length&&/[A-Za-z0-9_]/.test(s[j]))j++;T.push({t:'id',v:s.slice(i,j).toUpperCase(),p:i});i=j;continue;}
    const two=s.slice(i,i+2);
    if(two==='<='||two==='>='||two==='<>'){T.push({t:'o',v:two,p:i});i+=2;continue;}
    if('+-*/^()=<>,;%'.includes(ch)){T.push({t:'o',v:ch===';'?',':ch,p:i});i++;continue;}
    throw new Error('Ký tự không dùng được “'+ch+'”'+(/[À-ỹĐđ]/.test(ch)?' — tên biến viết không dấu, ví dụ LUONG_CB':'')+near(i));
  }
  if(!T.length)throw new Error('Công thức đang trống');
  let k=0;
  const isO=v=>T[k]&&T[k].t==='o'&&T[k].v===v;
  const expect=v=>{if(!isO(v))throw new Error('Thiếu dấu “'+v+'”'+(T[k]?near(T[k].p):' ở cuối công thức'));k++;};
  const CMP={'=':(a,b)=>a===b,'<>':(a,b)=>a!==b,'<':(a,b)=>a<b,'>':(a,b)=>a>b,'<=':(a,b)=>a<=b,'>=':(a,b)=>a>=b};
  function cmp(){let a=add();while(T[k]&&T[k].t==='o'&&CMP[T[k].v]){const f=CMP[T[k++].v],l=a,r=add();a=e=>f(l(e),r(e))?1:0;}return a;}
  function add(){let a=mul();while(isO('+')||isO('-')){const op=T[k++].v,l=a,r=mul();a=op==='+'?e=>l(e)+r(e):e=>l(e)-r(e);}return a;}
  function mul(){let a=pow();while(isO('*')||isO('/')){const op=T[k++].v,l=a,r=pow();a=op==='*'?e=>l(e)*r(e):e=>{const d=r(e);if(d===0)throw new Error('Chia cho 0');return l(e)/d;};}return a;}
  function pow(){let a=una();while(isO('^')){k++;const l=a,r=una();a=e=>Math.pow(l(e),r(e));}return a;}
  function una(){if(isO('-')){k++;const x=una();return e=>-x(e);}if(isO('+')){k++;return una();}return post();}
  function post(){let a=prim();while(isO('%')){k++;const x=a;a=e=>x(e)/100;}return a;}
  function prim(){const t=T[k];if(!t)throw new Error('Công thức chưa hoàn chỉnh (thiếu giá trị ở cuối)');
    if(t.t==='n'){k++;const v=t.v;return ()=>v;}
    if(isO('(')){k++;const x=cmp();expect(')');return x;}
    if(t.t==='id'){k++;const name=t.v;
      if(isO('(')){k++;const f=FN[name];if(!f)throw new Error('Không có hàm “'+name+'”'+near(t.p));
        const args=[];if(!isO(')')){args.push(cmp());while(isO(',')){k++;args.push(cmp());}}expect(')');
        if(args.length<f[0]||args.length>f[1])throw new Error('Hàm '+name+' cần '+(f[0]===f[1]?f[0]:f[0]+(f[1]>9?' trở lên':'–'+f[1]))+' đối số, đang có '+args.length);
        return mkFn(name,args);}
      if(name==='TRUE')return ()=>1;if(name==='FALSE')return ()=>0;
      ids.add(name);
      return e=>{const v=e[name];if(v===undefined)throw new Error('Chưa có giá trị biến '+name);return v;};}
    throw new Error('Không mong đợi “'+t.v+'”'+near(t.p));}
  const f=cmp();
  if(k<T.length)throw new Error('Thừa “'+T[k].v+'”'+near(T[k].p)+(T[k].t!=='o'?' — thiếu toán tử hoặc dấu phẩy?':''));
  return f;
}
const F_CACHE=new Map();
function compileF(src){
  src=String(src==null?'':src);
  if(F_CACHE.has(src))return F_CACHE.get(src);
  const out={ids:new Set(),fn:null,err:null};
  try{out.fn=buildF(src,out.ids);}catch(e){out.err=e.message;}
  if(F_CACHE.size>2000)F_CACHE.clear();
  F_CACHE.set(src,out);return out;
}
function evalF(src,env){const c=compileF(src);if(c.err)throw new Error(c.err);const v=c.fn(env);
  if(typeof v!=='number'||!isFinite(v))throw new Error('Kết quả không phải là số');return v;}

const BASE_SET=new Set([...Object.keys(VAR_GROUPS[0][1]),...Object.keys(VAR_GROUPS[1][1]),...Object.keys(VAR_GROUPS[2][1])]);
const TOT_SET=Object.keys(VAR_GROUPS[3][1]);
/* Biến được dùng ở mỗi chỗ: ctx = {step:'KEY'} cho công thức lương, {loai:'thu'|'tru'} cho công thức của khoản */
function allowedFor(khoan,ctx){
  const s=new Set(BASE_SET);khoan.forEach(k=>s.add('DM_'+k.ma));((typeof DB!=='undefined'&&DB&&DB.kyHieu)||KH_DEF).forEach(k=>s.add('SO_'+k.ma));
  if(ctx.loai==='thu'){s.add('MUC');s.add('SL');return s;}
  khoan.forEach(k=>{if(k.loai==='thu')s.add('PC_'+k.ma);});TOT_SET.forEach(x=>s.add(x));
  const stop=ctx.loai==='tru'?'KHAU_TRU':ctx.step;
  for(const st of PIPE){if(st===stop)break;
    if(st==='KHAU_TRU'){s.add('KHAU_TRU_KHAC');khoan.forEach(k=>{if(k.loai==='tru')s.add('KT_'+k.ma);});}else s.add(st);}
  if(ctx.loai==='tru'){s.add('MUC');s.add('SL');}
  return s;
}
function checkF(src,khoan,ctx){
  const c=compileF(src);if(c.err)return c.err;
  const ok=allowedFor(khoan,ctx),all=allowedFor(khoan,{step:'__HET'});all.add('MUC');all.add('SL');
  for(const id of c.ids)if(!ok.has(id)){
    if(id==='MUC'||id==='SL')return id+' chỉ dùng trong công thức của một khoản phụ cấp / khấu trừ';
    if(all.has(id))return 'Biến '+id+' chưa có ở bước này — chỉ dùng được kết quả của các bước phía trên'+(ctx.loai==='thu'?' (công thức phụ cấp chỉ dùng dữ liệu chấm công, nhân viên, cấu hình, MUC, DM_…)':'');
    return 'Không có biến “'+id+'”';}
  return '';
}

function validateAll(db){const errs=[];

    GIO_TC:+n.tc||0,GIO_TC_NGHI:+n.tcNghi||0,GIO_TC_LE:+n.tcLe||0,TAM_UNG:+n.tamUng||0,THANG:m,NAM:y,
    LUONG_CB:+nv.luongCB||0,LUONG_DONG_BH:n.lbh!=null&&n.lbh!==''?+n.lbh:(+nv.luongBH||0),SO_NPT:+nv.npt||0,
    GIO_NGAY:+cfg.gioNgay||8,HS_TC:cfg.heSoTC,HS_TC_NGHI:cfg.heSoTCNghi,HS_TC_LE:cfg.heSoTCLe,TL_BHXH:cfg.bhxh,TL_BHYT:cfg.bhyt,TL_BHTN:cfg.bhtn,
    TRAN_BHXH:tranBH,TRAN_BHTN:tranTN,LUONG_CO_SO:cfg.luongCoSo,LTT_VUNG:cfg.lttVung,GT_BAN_THAN:cfg.gtBanThan,GT_NPT:cfg.gtNPT,
    MIEN_TC_TOAN_BO:cfg.mienThueTC==='toanbo'?1:0,DONG_BH:dongBH?1:0};

    if(!k.dung)return 0;

      case 'doanhso':return dsThuong(k,(n.sl||{})[k.ma],nv.pc?nv.pc[k.ma]:null).tien;
      case 'codinh':case 'thang':return dm;

    }return 0;};
  ks.forEach(k=>{v['DM_'+k.ma]=!k.dung?0:k.cach==='thang'?(+npc[k.ma]||0):dinhMuc(k,nv);});

  // Các bước tính theo công thức (mặc định = Excel; có thể tùy chỉnh)

      if(src!==def){try{return evalF(def,v);}catch(e2){}}return 0;}};
  for(const st of PIPE){
    if(st==='TIEN_TC_CHENH_LECH'){const g=v.DON_GIA_GIO;v[st]=R(g*v.GIO_TC*(v.HS_TC-1))+R(g*v.GIO_TC_NGHI*(v.HS_TC_NGHI-1))+R(g*v.GIO_TC_LE*(v.HS_TC_LE-1));continue;}
    if(st==='KHAU_TRU'){let s=0;ks.forEach(k=>{if(k.loai!=='tru')return;const dm=v['DM_'+k.ma],a=amount(k,dm,v);v['KT_'+k.ma]=a;
        if(k.dung){s+=a;if(dm||a)tru.push({ma:k.ma,ten:k.ten,cach:k.cach,dm,amt:a,soNgay:k.cach==='theongay'?soNgayK(db,k,nv.ma,y,m):null});}});v.KHAU_TRU_KHAC=s;continue;}
    if(dt!=='CT'&&['GIAM_TRU','TC_MIEN_THUE','TN_MIEN_THUE','TNTT','THUE'].includes(st)){

  /* Người không nhận lương (VD chủ sở hữu): BH vẫn tính để nộp nhưng không trừ vào lương */

    bhxh:v.BHXH,bhyt:v.BHYT,bhtn:v.BHTN,giamTru:v.GIAM_TRU,mienTC:v.TC_MIEN_THUE,mienTN:v.TN_MIEN_THUE,tntt:v.TNTT,thue:v.THUE,

}

const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC_T[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipStore(files){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  const d=new Date(),dt=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate(),tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
  for(const f of files){
    const nb=enc.encode(f.name),data=typeof f.data==='string'?enc.encode(f.data):f.data,crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);
    lh.setUint16(10,tm,true);lh.setUint16(12,dt,true);lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);
    lh.setUint32(22,data.length,true);lh.setUint16(26,nb.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),nb,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);
    ch.setUint16(12,tm,true);ch.setUint16(14,dt,true);ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);
    ch.setUint16(28,nb.length,true);ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer),nb);off+=30+nb.length+data.length;
  }
  const cs=central.reduce((s,a)=>s+a.length,0),e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...parts,...central,new Uint8Array(e.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
const colName=i=>{let s='';i++;while(i){const r=(i-1)%26;s=String.fromCharCode(65+r)+s;i=Math.floor((i-1)/26);}return s;};

function applyImport(res,mode){
  try{
  if(!res.hasNV)mode='merge';
  if(res.kyHieu)res.kyHieu.forEach(k=>{const i=DB.kyHieu.findIndex(x=>x.ma===k.ma);if(i>=0)DB.kyHieu[i]=Object.assign(DB.kyHieu[i],k);else DB.kyHieu.push(k);});
  if(mode==='replace'){DB.nv=res.nv;DB.cc=res.cc;DB.nhap=res.nhap;DB.tcNgay=res.tcNgay||{};if(res.ghiChu)DB.ghiChu=res.ghiChu;if(res.ngayLe)DB.ngayLe=res.ngayLe;}
  else{
    res.nv.forEach(n=>{const i=DB.nv.findIndex(x=>x.ma===n.ma);if(i>=0)DB.nv[i]=Object.assign(DB.nv[i],n);else DB.nv.push(n);});
    Object.assign(DB.cc,res.cc);Object.assign(DB.nhap,res.nhap);Object.assign(DB.tcNgay,res.tcNgay||{});
    if(res.ghiChu)Object.entries(res.ghiChu).forEach(([p,o])=>DB.ghiChu[p]=Object.assign(DB.ghiChu[p]||{},o));if(res.ngayLe)Object.assign(DB.ngayLe,res.ngayLe);
  }
  if(res.kpiBo)DB.kpiBo=res.kpiBo;
  if(res.kpiThang){if(mode==='replace')DB.kpiThang=res.kpiThang;else Object.entries(res.kpiThang).forEach(([p,o])=>{const c=DB.kpiThang[p]||(DB.kpiThang[p]={});if(o.ds!=null)c.ds=o.ds;if(o.quy!=null)c.quy=o.quy;if(o.d)c.d=Object.assign(c.d||{},o.d);});}
  syncAllTC(DB);
  Object.assign(DB.cfg,res.cfg);
  if(res.khoan){if(mode==='replace')DB.khoan=res.khoan;else res.khoan.forEach(k=>{const i=DB.khoan.findIndex(x=>x.ma===k.ma);if(i>=0)DB.khoan[i]=k;else DB.khoan.push(k);});}
  if(res.congThuc)DB.congThuc=res.congThuc;
  const codes=new Set();res.nv.forEach(n=>Object.keys(n.pc||{}).forEach(c=>codes.add(c)));Object.values(res.nhap).forEach(o=>o.pc&&Object.keys(o.pc).forEach(c=>codes.add(c)));
  codes.forEach(c=>{let k=DB.khoan.find(x=>x.ma===c);
    if(!k){k=defaultKhoan().find(x=>x.ma===c)||Object.assign({ma:c,ten:'Khoản '+c,loai:'thu',cach:'codinh'},KHOAN_DEF,{ghiChu:'Tạo khi nhập Excel'});DB.khoan.push(k);}
    if(!res.khoan)k.dung=true;});
  UI.ctDraft=null;
  if(res.period){DB.ui.nam=res.period.nam;DB.ui.thang=res.period.thang;}
  }finally{save();flush();}
}

function khLegend(){return `<div class="khlegend"><b>Ghi chú ký hiệu:</b>${DB.kyHieu.map(k=>`<span title="${esc(k.ghiChu||'')}"><b class="khb" style="${khStyle(k.ma)}">${esc(k.ma)}</b> ${esc(k.ten)} <i>(${fmt(k.cong)} công)</i></span>`).join('')}<a href="#" onclick="UI.ccTab='kh';vChamCong();return false">Sửa / thêm ký hiệu</a></div>`;}
function ccLuoi(){

  for(let d=1;d<=n;d++){const off=isOff(DB.cfg,y,m,d)?' off':'';head1+=`<th class="dh${off}" data-dh="${d}" title="Bấm để chấm cả ngày ${d} cho các NV đang chọn bằng ký hiệu đang chọn">${d}</th>`;head2+=`<th class="${off}">${WD[wday(y,m,d)]}</th>`;}
  head1+='<th class="tot" rowspan="2">Ngày công</th><th class="tot" rowspan="2">Phép</th><th rowspan="2">Giờ TC<br>thường</th><th rowspan="2">Giờ TC<br>ngày nghỉ</th><th rowspan="2">Giờ TC<br>lễ</th><th rowspan="2">Tạm ứng</th><th rowspan="2">Ghi chú</th></tr>';head2+='</tr>';
  const body=list.map(nv=>{const a=getDays(DB,nv.ma,y,m),c=demCong(DB,nv.ma,y,m),nh=getNhap(DB,nv.ma,y,m);
    let tds='';for(let d=1;d<=n;d++){const v=a[d-1]||'';tds+=`<td class="d${isOff(DB.cfg,y,m,d)?' off':''}" tabindex="0" data-d="${d}" style="${khStyle(v)}">${esc(v)}</td>`;}
    return `<tr data-ma="${esc(nv.ma)}"><td class="c1"><label class="ck"><input type="checkbox" data-sel${sel.has(nv.ma)?' checked':''}><b>${esc(nv.ma)}</b></label></td><td class="c2">${esc(nv.ten)}</td>${tds}
      <td class="tot nc${c.ngayCong>cc?' over':''}">${fmt(c.ngayCong)}</td><td class="tot ph">${fmt0(c.phep)}</td>

  const kOpt=v=>CODES.map(c=>`<option value="${esc(c)}"${c===v?' selected':''}>${esc(c)} – ${esc(CODE_NAME[c])}</option>`).join('');
  $('#ccBody').innerHTML=`<div class="toolbar">
    <div class="palette" id="pal"><span class="small muted">Ký hiệu:</span>${[...CODES,''].map(c=>`<button data-b="${esc(c)}" class="${UI.brush===c?'on':''}" title="${c?esc(CODE_NAME[c]):'Xóa ô'}" style="${c?'color:'+(khOf(c).mau||'inherit'):''}">${esc(c)||'⌫'}</button>`).join('')}</div>
    <input class="f search" id="ccQ" placeholder="Lọc nhân viên…" value="${esc(UI.ccQ)}">
    <span class="grow"></span>${ccBoxHTML(y,m)}
    <button class="btn" id="btnCCXls">Xuất Excel</button><button class="btn" id="btnCCPrint">In bảng chấm công</button><button class="btn danger" id="btnClrM">Xóa chấm công tháng</button></div>
  <div class="bulk"><b>Chấm hàng loạt</b> ký hiệu <select class="f" id="bkKH">${kOpt(UI.bkKH||'X')}</select>
    từ ngày <input class="f" type="number" id="bkTu" min="1" max="${n}" value="1"> đến ngày <input class="f" type="number" id="bkDen" min="1" max="${n}" value="${n}">
    <label class="ck"><input type="checkbox" id="bkOff" checked> Bỏ qua ngày nghỉ hằng tuần</label>
    <label class="ck"><input type="checkbox" id="bkEmpty" checked> Chỉ điền ô còn trống</label>
    <button class="btn pri" id="bkGo">Áp dụng</button><span id="bkN" class="small muted"></span></div>
    ${list.length?`<div class="tbl-wrap"><table class="cc" id="ccTbl"><thead>${head1}${head2}</thead><tbody>${body}</tbody></table></div>`:'<div class="card empty">Chưa có nhân viên. Thêm nhân viên trước khi chấm công.</div>'}
    <div class="gcbox"><label class="small strong">Ghi chú bảng chấm công tháng ${m}/${y} <span class="hint">(lưu lại các lưu ý để sau này đối chiếu, giải trình — in kèm bảng chấm công)</span></label><textarea class="f" id="gcKyCC" placeholder="VD: Ngày 15 mất điện cả xưởng, nghỉ hưởng lương theo quyết định số …">${esc(getGC(DB,y,m,'cc'))}</textarea></div>
    ${khLegend()}
    <div class="legend"><span>Cách nhập: chọn ký hiệu rồi bấm / kéo chuột trên các ô; hoặc chọn ô rồi gõ mã ký hiệu (X, N, P, KL…), Delete để xóa, phím mũi tên để di chuyển. Tích ô cạnh Mã NV để chấm hàng loạt cho người được chọn; bấm số ngày ở tiêu đề để chấm cả ngày đó.</span></div>`;
  ccBoxBind(y,m,ccLuoi);
  $$('#pal [data-b]').forEach(b=>b.onclick=()=>{UI.brush=b.dataset.b;$$('#pal [data-b]').forEach(x=>x.classList.toggle('on',x===b));});
  $('#ccQ').oninput=e=>{UI.ccQ=e.target.value;const p=e.target.selectionStart;ccLuoi();const q=$('#ccQ');q.focus();q.setSelectionRange(p,p);};
  $('#btnCCXls').onclick=()=>download(`BangChamCong_T${m}_${y}.xlsx`,writeXlsx([sheetLuoi(DB,y,m)]));
  $('#btnCCPrint').onclick=()=>inBangCong(list,y,m);
  $('#btnClrM').onclick=()=>modal('Xóa chấm công',`Xóa toàn bộ ký hiệu chấm công tháng ${m}/${y} của <b>${list.length}</b> nhân viên đang hiển thị? (Giờ tăng ca và tạm ứng được giữ nguyên.)`,[{t:'Hủy'},{t:'Xóa',cls:'danger',fn:()=>{list.forEach(nv=>delete DB.cc[ccKey(nv.ma,y,m)]);save();ccLuoi();}}]);
  const targets=()=>sel.size?list.filter(nv=>sel.has(nv.ma)):list;
  const updN=()=>{$('#bkN').textContent='→ '+targets().length+' NV '+(sel.size?'đã tích':'(tất cả đang hiển thị; tích ô cạnh Mã NV để chọn riêng)');const a=$('#ccAll');if(a){a.checked=list.length&&sel.size===list.length;a.indeterminate=sel.size>0&&sel.size<list.length;}};updN();
  $('#bkKH').onchange=e=>{UI.bkKH=e.target.value;};
  $('#bkGo').onclick=()=>{const code=$('#bkKH').value,tu=Math.max(1,Math.min(n,+$('#bkTu').value||1)),den=Math.max(tu,Math.min(n,+$('#bkDen').value||n)),skipOff=$('#bkOff').checked,onlyEmpty=$('#bkEmpty').checked;let k=0;
    targets().forEach(nv=>{const a=getDays(DB,nv.ma,y,m);for(let d=tu;d<=den;d++){if(skipOff&&isOff(DB.cfg,y,m,d))continue;if(onlyEmpty&&a[d-1])continue;setDay(DB,nv.ma,y,m,d,code);k++;}});
    save();toast('Đã chấm '+k+' ô bằng ký hiệu '+code,'ok');ccLuoi();};
  const tbl=$('#ccTbl');if(!tbl)return;
  $('#ccAll').onchange=e=>{if(e.target.checked)list.forEach(nv=>sel.add(nv.ma));else sel.clear();$$('#ccTbl [data-sel]').forEach(c=>c.checked=e.target.checked);updN();};
  $$('#ccTbl [data-sel]').forEach(c=>c.onchange=()=>{const ma=c.closest('tr').dataset.ma;if(c.checked)sel.add(ma);else sel.delete(ma);updN();});
  $$('#ccTbl th[data-dh]').forEach(th=>th.onclick=()=>{const d=+th.dataset.dh,t=targets();t.forEach(nv=>setDay(DB,nv.ma,y,m,d,UI.brush));save();toast(`Ngày ${d}: đã chấm “${UI.brush||'xóa'}” cho ${t.length} NV`);ccLuoi();});
  let painting=false,lastTd=null,kb='',kbTd=null,kbTimer=null;
  const apply=(td,code)=>{const ma=td.parentNode.dataset.ma,d=+td.dataset.d;setDay(DB,ma,y,m,d,code);td.setAttribute('style',khStyle(code));td.textContent=code;updRow(td.parentNode);};
  const updRow=tr=>{const c=demCong(DB,tr.dataset.ma,y,m);const nc=tr.querySelector('.nc');nc.textContent=fmt(c.ngayCong);nc.classList.toggle('over',c.ngayCong>cc);tr.querySelector('.ph').textContent=fmt0(c.phep);save();};
  const commit=(td,code)=>{apply(td,code);const nx=td.nextElementSibling;if(nx&&nx.classList.contains('d'))nx.focus();};
  /* Gõ mã ký hiệu nhiều ký tự: chờ ngắn khi còn mã dài hơn cùng tiền tố (VD: N và NB) */
  const flushKb=()=>{clearTimeout(kbTimer);const c=kb,t=kbTd;kb='';kbTd=null;if(!t||!c)return;
    let code=CODES.includes(c)?c:null;if(!code){const cand=CODES.filter(x=>x.startsWith(c));if(cand.length===1)code=cand[0];}
    if(code)commit(t,code);else t.textContent=getDays(DB,t.parentNode.dataset.ma,y,m)[+t.dataset.d-1]||'';};
  const onKey=(td,k)=>{
    if(kbTd&&kbTd!==td)flushKb();
    const nb=kb+k,cand=CODES.filter(c=>c.startsWith(nb));
    if(!cand.length){if(kb){const prev=kbTd;flushKb();const nx=prev.nextElementSibling;return onKey(nx&&nx.classList.contains('d')?nx:prev,k);}return;}
    kb=nb;kbTd=td;td.textContent=nb+'…';clearTimeout(kbTimer);
    if(cand.length===1&&cand[0]===nb){flushKb();return;}
    kbTimer=setTimeout(flushKb,700);};
  tbl.addEventListener('mousedown',e=>{const td=e.target.closest('td.d');if(!td)return;flushKb();e.preventDefault();td.focus();painting=true;lastTd=td;apply(td,UI.brush);});
  tbl.addEventListener('mouseover',e=>{if(!painting)return;const td=e.target.closest('td.d');if(!td||td===lastTd)return;
    if(lastTd&&lastTd.parentNode===td.parentNode){const a=+lastTd.dataset.d,b=+td.dataset.d,s=Math.sign(b-a);
      for(let d=a+s;d!==b;d+=s)apply(td.parentNode.querySelector(`td.d[data-d="${d}"]`),UI.brush);}
    apply(td,UI.brush);lastTd=td;});
  document.addEventListener('mouseup',()=>{painting=false;});
  tbl.addEventListener('focusout',e=>{if(kbTd&&e.target===kbTd&&!kbTd.contains(e.relatedTarget))flushKb();});
  tbl.addEventListener('keydown',e=>{const td=e.target.closest('td.d');if(!td)return;const k=e.key.toUpperCase();
    if(k==='DELETE'||k==='BACKSPACE'||k===' '){e.preventDefault();flushKb();commit(td,'');return;}
    if(k==='ENTER'){e.preventDefault();flushKb();return;}
    if(/^[A-Z0-9]$/.test(k)){e.preventDefault();onKey(td,k);return;}
    const mv={ARROWLEFT:[0,-1],ARROWRIGHT:[0,1],ARROWUP:[-1,0],ARROWDOWN:[1,0]}[k];
    if(mv){e.preventDefault();flushKb();let tr=td.parentNode;const d=+td.dataset.d+mv[1];if(mv[0])tr=mv[0]<0?tr.previousElementSibling:tr.nextElementSibling;
      const t=tr&&tr.querySelector(`td.d[data-d="${d}"]`);if(t)t.focus();}});
  $('#gcKyCC').onchange=e=>{setGC(DB,y,m,'cc',e.target.value);save();toast('Đã lưu ghi chú','ok');};
  tbl.addEventListener('change',e=>{const g=e.target.closest('input[data-gc]');if(g){setNhap(DB,g.closest('tr').dataset.ma,y,m,g.dataset.gc,g.value.trim());save();return;}
    const i=e.target.closest('input[data-f]');if(!i||i.readOnly)return;const ma=i.closest('tr').dataset.ma;const v=parseNum(i.value);
    if(v<0){toast('Không nhập số âm','err');i.value='';return;}setNhap(DB,ma,y,m,i.dataset.f,v);i.value=fmt0(v);save();});
}

  const body=list.map(nv=>{const a=getTcNgay(DB,nv.ma,y,m),x=rowTot(nv);let tds='';

function khRefs(db,ma){const re=new RegExp('\\bSO_'+ma+'\\b','i'),r=[];

  db.khoan.forEach(k=>{if(k.cach==='congthuc'&&re.test(k.congThuc))r.push('khoản “'+k.ten+'”');});return r;}

function ccDong(){
  $('#ccBody').innerHTML=`<div class="card"><h2>Nhập nhiều dòng (dán từ Excel hoặc gõ tay)</h2>
    <p class="small muted" style="margin-top:0">Mỗi dòng: <b>Mã NV</b> · <b>Ngày</b> hoặc <b>khoảng ngày</b> · <b>Ký hiệu</b>, cách nhau bằng Tab, dấu chấm phẩy hoặc dấu phẩy.
    Khoảng ngày (ví dụ <code>01/10/2026-15/10/2026</code>) chỉ áp vào ngày làm việc, bỏ qua ngày nghỉ hằng tuần. Mã NV <code>*</code> = tất cả nhân viên đang làm.
    Ký hiệu: ${CODES.map(esc).join(', ')}; ký hiệu <code>-</code> để xóa.</p>
    <textarea class="f" id="bulk" rows="10" style="width:100%;font-family:Consolas,monospace" placeholder="NV01; 01/10/2026; X&#10;NV02; 05/10/2026-09/10/2026; P&#10;*; 02/09/2026; L">${esc(UI.bulkText)}</textarea>
    <div class="toolbar" style="margin-top:10px"><button class="btn" id="bChk">Kiểm tra</button><button class="btn pri" id="bApply" disabled>Ghi vào dữ liệu</button><span class="small muted" id="bSum"></span></div>
    <div id="bPrev"></div></div>`;
  let parsed=[];
  const check=()=>{
    UI.bulkText=$('#bulk').value;parsed=[];const out=[];let ok=0;
    UI.bulkText.split(/\r?\n/).forEach((line,i)=>{
      if(!line.trim())return;const p=line.split(/\t|;|,/).map(s=>s.trim()).filter((s,j,a)=>s!==''||j<a.length-1);
      let err='',cells=[];const [ma,dt,kh0]=p;const kh=String(kh0||'').toUpperCase();
      const nvs=ma==='*'?DB.nv.filter(n=>n.dangLam!==false):DB.nv.filter(n=>n.ma===ma);
      if(!nvs.length)err='Không có mã NV "'+(ma||'')+'"';
      else if(!(CODES.includes(kh)||kh==='-'))err='Ký hiệu không hợp lệ "'+(kh0||'')+'"';
      else{const r=String(dt||'').split(/\s*(?:-|→|đến)\s*(?=\d{1,2}[\/.]\d)/);const a=parseDate(r[0]),b=r[1]?parseDate(r[1]):a;
        if(!validYMD(a)||!validYMD(b))err='Ngày không hợp lệ "'+(dt||'')+'" (dùng dd/mm/yyyy)';
        else{let t=new Date(a[0],a[1]-1,a[2]);const e=new Date(b[0],b[1]-1,b[2]);if(e<t)err='Ngày kết thúc trước ngày bắt đầu';
          else{let guard=0;while(t<=e&&guard++<400){const ymd=[t.getFullYear(),t.getMonth()+1,t.getDate()];if(!r[1]||!isOff(DB.cfg,...ymd))nvs.forEach(n=>cells.push([n.ma,...ymd,kh==='-'?'':kh]));t.setDate(t.getDate()+1);}}}}
      if(!err){ok++;parsed.push(...cells);}
      out.push(`<tr><td class="n">${i+1}</td><td>${esc(line)}</td><td>${err?`<span class="tag bad">${esc(err)}</span>`:`<span class="tag ok">${cells.length} ô</span>`}</td></tr>`);});
    $('#bPrev').innerHTML=out.length?`<div class="tbl-wrap" style="max-height:320px"><table class="t"><thead><tr><th class="n">Dòng</th><th>Nội dung</th><th>Kết quả</th></tr></thead><tbody>${out.join('')}</tbody></table></div>`:'';
    $('#bSum').textContent=out.length?`${ok}/${out.length} dòng hợp lệ · ${parsed.length} ô sẽ được ghi`:'';
    $('#bApply').disabled=!parsed.length;
  };
  $('#bChk').onclick=check;
  $('#bApply').onclick=()=>{check();parsed.forEach(([ma,y,m,d,k])=>setDay(DB,ma,y,m,d,k));save();toast('Đã ghi '+parsed.length+' ô chấm công','ok');UI.bulkText='';ccDong();};
}

function blRows(){const [y,m]=per();return tinhBangLuong(DB,y,m).filter(r=>(!UI.blBP||r.boPhan===UI.blBP)&&match(UI.blQ,r.ma,r.ten,r.boPhan,r.chucVu));}
/* Cột bảng lương: phụ cấp theo ngày công (định mức) → Lương theo ngày công → từng phụ cấp khác → … → từng khoản khấu trừ → Thực lĩnh */
function blCols(db,rows,o){
  o=o||{};const ks=(db.khoan||[]).filter(k=>k.dung);
  const F=(k,lab,w,x)=>Object.assign({k,lab,w,get:r=>r[k]},x||{});
  const V=(pfx,k)=>({k:pfx+k.ma,lab:k.ten+(pfx==='DM_'?' (định mức)':pfx==='KT_'?' (trừ)':''),w:14,get:r=>r.vars[pfx+k.ma]||0,khoan:1,kref:pfx==='DM_'?null:k,keep:k.hien||['kpi','doanhso','thang'].includes(k.cach)});
  const NO=['phucap','thuong','phucloi'],thuK=ks.filter(k=>k.loai==='thu'&&k.cach!=='ngaycong').map((k,i)=>[k,i]).sort((a,b)=>NO.indexOf(nhomOf(a[0]))-NO.indexOf(nhomOf(b[0]))||a[1]-b[1]).map(x=>x[0]);
  const VN=k=>o.soNgay&&k.cach==='theongay'?[{k:'SN_'+k.ma,lab:k.ten+' – số ngày',w:9,noSum:1,get:r=>{const i=r.items.thu.find(x=>x.ma===k.ma);return i?i.soNgay:0;}},V('PC_',k)]:[V('PC_',k)];
  let c=[F('ma','Mã NV',9,{txt:1,noSum:1}),F('ten','Họ và tên',24,{txt:1,noSum:1}),F('luongCB','Lương cơ bản',14),
    ...ks.filter(k=>k.loai==='thu'&&k.cach==='ngaycong').map(k=>V('DM_',k)),
    F('ngayCong','Ngày công',9,{noSum:1}),F('luongNC','Lương theo ngày công',15),
    ...thuK.flatMap(VN),
    F('gioTC','Giờ tăng ca',9),F('tienTC','Tiền tăng ca',13),F('tongTN','Tổng thu nhập',15),F('bhxh','BHXH',12),F('bhyt','BHYT',11),F('bhtn','BHTN',11),
    F('giamTru','Giảm trừ gia cảnh',15,{noSum:1}),F('mienTN','TN miễn thuế',13),F('tntt','Thu nhập tính thuế',15),F('thue','Thuế TNCN',13),F('tamUng','Tạm ứng',12),
    ...ks.filter(k=>k.loai==='tru').map(k=>V('KT_',k)),F('thucLinh','THỰC LĨNH',15)];
  if(o.dn)c=c.concat(DN_COLS.map(d=>F(d[0],d[1],d[2])));
  if(!o.noGC)c.push(F('gcBL','Ghi chú',30,{txt:1,noSum:1}));
  if(o.hideZero)c=c.filter(x=>!x.khoan||x.keep||rows.some(r=>x.get(r)));
  return c;
}
function blTableHTML(rows,withDN,clickable){

  ${rows.map(r=>`<tr${clickable?` data-ma="${esc(r.ma)}" style="cursor:pointer" title="Bấm để xem phiếu lương"`:''}>${cols.map(c=>{const v=c.get(r);

    if(c.k==='ten')return `<td>${esc(v)}</td>`;
    if(c.k==='gcBL')return clickable?`<td class="inp" style="padding:2px"><input class="f gcbl" data-gcbl style="width:200px;padding:2px 6px" value="${esc(v)}" placeholder="…"></td>`:`<td style="min-width:120px">${esc(v)}</td>`;
    if(c.kref&&clickable&&c.kref.cach==='thang')return `<td class="inp" style="padding:2px"><input class="f in num" data-blk="${esc(c.kref.ma)}" style="width:110px;padding:2px 6px" value="${v?fmt(v):''}" title="Nhập số tiền ${esc(c.kref.ten)} tháng này"></td>`;
    if(c.kref&&c.kref.cach==='theongay'){const it=r.items.thu.find(x=>x.ma===c.kref.ma);return `<td class="n">${fmt(v)}${it&&v?`<div class="small muted" style="font-weight:400">${fmt(it.soNgay)} × ${fmt(it.dm)}</div>`:''}</td>`;}
    if(c.k==='giamTru'&&r.dienThue!=='CT')return `<td class="n"><span class="tag">${r.dienThue==='VL'?'10%':'20%'}</span></td>`;
    return `<td class="n${c.k==='thucLinh'?' strong tl':''}">${fmt(v)}</td>`;}).join('')}</tr>`).join('')}</tbody>
  <tfoot><tr>${cols.map((c,i)=>`<td class="${c.txt?'':'n'}${c.k==='thucLinh'?' tl':''}">${i===1?'TỔNG CỘNG':c.noSum?'':fmt(rows.reduce((t,r)=>t+(+c.get(r)||0),0))}</td>`).join('')}</tr></tfoot></table>`;
}

/* ---------- Tiền trang phục: theo dõi lũy kế năm ---------- */
function pcTrangPhuc(){
  const [y,m]=per(),k=DB.khoan.find(x=>x.ma==='TP');

  const tran=k.thue==='luyke'?+k.mucMien||0:0,list=DB.nv.filter(nv=>nv.dangLam!==false||[...Array(12)].some((_,i)=>+((getNhap(DB,nv.ma,y,i+1).pc||{}).TP)));
  const v=(ma,t)=>+((getNhap(DB,ma,y,t).pc||{}).TP)||0;
  const row=nv=>{let lk=0,cells='';for(let t=1;t<=12;t++){const a=v(nv.ma,t),vuot=tran&&a&&lk+a>tran;lk+=a;cells+=`<td class="inp"><input class="f in num${vuot?' bad':''}" style="width:92px;padding:2px 6px${vuot?';color:var(--bad);border-color:var(--bad)':''}" data-t="${t}" value="${fmt0(a)}"${t===m?' title="Kỳ đang chọn"':''}></td>`;}
    const mien=tran?Math.min(lk,tran):0;return `<tr data-ma="${esc(nv.ma)}"><td class="strong">${esc(nv.ma)}</td><td>${esc(nv.ten)}</td><td class="n strong">${fmt0(lk)}</td><td class="n">${fmt0(mien)}</td><td class="n">${tran?fmt0(Math.max(0,tran-lk)):''}</td><td class="n${tran&&lk>tran?' strong" style="color:var(--bad)':'"'}>${tran?fmt0(Math.max(0,lk-tran)):fmt0(lk)}</td>${cells}</tr>`;};
  $('#pcBody').innerHTML=`${k.dung?'':`<div class="alert">Khoản <b>${esc(k.ten)}</b> đang tắt — số tiền nhập ở đây chưa vào bảng lương. <a href="#" id="tpOn">Bật khoản</a> (nhập số tiền đầu tiên cũng tự bật).</div>`}
    <div class="toolbar"><span class="small muted">Mỗi ô là số tiền trang phục chi bằng tiền trong tháng (có thể chi nhiều đợt). ${tran?`Miễn thuế TNCN lũy kế tối đa <b>${fmt(tran)}</b> đ/người/năm; phần vượt tự tính vào thu nhập chịu thuế của tháng chi vượt.`:'Khoản đang để chế độ thuế khác “lũy kế” — sửa ở Danh mục khoản.'}</span><span class="grow"></span><button class="btn" id="tpXls">Xuất Excel</button></div>
    <div class="tbl-wrap"><table class="t" id="tpTbl"><thead><tr><th>Mã NV</th><th>Họ và tên</th><th class="n">Lũy kế năm</th><th class="n">Được miễn thuế</th><th class="n">Còn được miễn</th><th class="n">Phần chịu thuế</th>${[...Array(12)].map((_,i)=>`<th class="n"${i+1===m?' style="background:var(--accent-l)"':''}>Tháng ${i+1}</th>`).join('')}</tr></thead>
    <tbody>${list.map(row).join('')}</tbody></table></div>
    <p class="small muted">Căn cứ: khoản 2 Điều 2 Thông tư 111/2013/TT-BTC (thuế TNCN) — tiền trang phục chi bằng tiền không quá 5 triệu đồng/người/năm không tính vào thu nhập chịu thuế; Thông tư 96/2015/TT-BTC (thuế TNDN) — được tính vào chi phí được trừ tối đa 5 triệu đồng/người/năm. Kiểm tra lại quy định hiện hành; sửa mức ở Danh mục khoản → TP.</p>`;
  const on=$('#tpOn');if(on)on.onclick=e=>{e.preventDefault();k.dung=true;save();pcTrangPhuc();};
  $('#tpXls').onclick=()=>{const H=['Mã NV','Họ và tên',...[...Array(12)].map((_,i)=>'Tháng '+(i+1)),'Lũy kế năm','Được miễn thuế','Còn được miễn','Phần chịu thuế'],rows=[H];
    list.forEach(nv=>{const a=[...Array(12)].map((_,i)=>v(nv.ma,i+1)),lk=a.reduce((x,y)=>x+y,0);rows.push([nv.ma,nv.ten,...a,lk,tran?Math.min(lk,tran):0,tran?Math.max(0,tran-lk):'',tran?Math.max(0,lk-tran):lk]);});
    download(`TrangPhuc_${y}.xlsx`,writeXlsx([{name:'TrangPhuc_'+y,rows,cols:[9,24,...Array(12).fill(11),13,13,13,13],freeze:[1,2]}]));};
  $('#tpTbl').addEventListener('change',e=>{const i=e.target.closest('input[data-t]');if(!i)return;const ma=i.closest('tr').dataset.ma,t=+i.dataset.t,a=parseNum(i.value);
    if(a<0){toast('Không nhập số âm','err');i.value='';return;}
    setNhapPc(DB,ma,y,t,'TP',a);if(a&&!k.dung){k.dung=true;toast('Đã bật khoản '+k.ten+' vào bảng lương','ok');}
    const lk=[...Array(12)].reduce((s,_,j)=>s+v(ma,j+1),0);if(tran&&lk>tran)toast(`${ma}: lũy kế năm ${fmt(lk)} vượt ${fmt(tran)} — phần vượt ${fmt(lk-tran)} chịu thuế TNCN`,'err');
    save();pcTrangPhuc();});
}

      ${bo.tc.map(t=>`<th class="n tc" title="${esc(t.ghiChu||'')}">${esc(t.ten)}<div class="small muted" style="font-weight:400">${pt?'% hoàn thành':'tối đa '+fmt(t.diem)+' điểm'}</div></th>`).join('')}<th class="n">Tổng điểm</th><th class="n">Tiền KPI</th></tr></thead><tbody>
      ${ds.map(nv=>{const x=(kt.d||{})[nv.ma]||{},r=res[nv.ma];return `<tr data-ma="${esc(nv.ma)}"><td class="strong">${esc(nv.ma)}</td><td>${esc(nv.ten)}</td><td>${boOpt(nv)}</td>
        <td class="inp"><input class="f in num" data-hs style="width:${pool?60:110}px" value="${pool?(nv.kpiHeSo!=null?fmt(nv.kpiHeSo):''):(k&&nv.pc&&nv.pc[k.ma]!=null?fmt(nv.pc[k.ma]):'')}" placeholder="${pool?'1':fmt(k?k.macDinh||0:0)}"></td>
        ${bo.tc.map(t=>`<td class="inp"><input class="f in num" data-tc="${esc(t.id)}" value="${x[t.id]!=null?fmt(x[t.id]):''}"></td>`).join('')}
        <td class="n strong kd">${r?fmt(r.diem):''}${r&&!r.dat?' <span class="tag warn" title="Dưới điểm tối thiểu">&lt; '+fmt(c.kpiNguong)+'</span>':''}</td><td class="n strong kt">${r?fmt(r.tien):''}</td></tr>`;}).join('')}</tbody></table></div></div>`;};

    ${k&&!k.dung?`<div class="alert">Khoản <b>${esc(k.ten)}</b> đang tắt — tiền KPI chưa vào bảng lương. <a href="#" id="kpOn">Bật khoản</a></div>`:''}
    ${Object.keys(res).length&&!tong?`<div class="alert">Đã chấm điểm nhưng <b>tiền KPI đang bằng 0</b> nên bảng lương chưa có số: ${c.kpiCach==='mucnv'?'chưa nhập <b>Mức KPI / tháng</b> cho nhân viên (cột “Mức KPI / tháng” bên dưới), hoặc đổi “Cách tính tiền KPI” sang quỹ cố định / theo doanh số.':c.kpiCach==='doanhso'?'chưa nhập <b>Doanh số tháng</b> hoặc tỷ lệ trích quỹ.':'chưa nhập <b>Quỹ KPI tháng</b>.'}</div>`:''}
    ${k&&k.dung&&tong?`<div class="alert info">Tiền KPI đã chuyển sang <b>Bảng lương</b> ở cột “${esc(k.ten)}” (tổng ${fmt(tong)}). <a href="#" onclick="go('bangluong');return false">Mở bảng lương</a></div>`:''}
    <div class="card"><div class="kpiset">

    ${list.length?DB.kpiBo.map(tblBo).join(''):'<div class="card empty">Chưa có nhân viên.</div>'}
    ${khong.length?`<div class="card"><h2>Không tham gia KPI</h2><div class="small">${khong.map(nv=>`<span style="display:inline-flex;gap:6px;align-items:center;margin:0 14px 6px 0" data-ma="${esc(nv.ma)}"><b>${esc(nv.ma)}</b> ${esc(nv.ten)} ${boOpt(nv)}</span>`).join('')}</div></div>`:''}`;
  const on=$('#kpOn');if(on)on.onclick=e=>{e.preventDefault();k.dung=true;save();kpiCham();};

  const upd=()=>{const r=kpiTinh(DB,y,m);$$('#kpiBody table.kp tbody tr').forEach(tr=>{const o=r[tr.dataset.ma];tr.querySelector('.kd').innerHTML=o?fmt(o.diem)+(!o.dat?' <span class="tag warn">&lt; '+fmt(c.kpiNguong)+'</span>':''):'';tr.querySelector('.kt').textContent=o?fmt(o.tien):'';});

function sheetsKPI(db,y,m,mau){const pt=db.cfg.kpiNhap==='pt',res=kpiTinh(db,y,m),kt=getKT(db,y,m);
  return db.kpiBo.map(bo=>{const nvs=(mau?db.nv.filter(nv=>nv.dangLam!==false):dsNV(db,y,m)).filter(nv=>(kpiBoOf(db,nv)||{}).ma===bo.ma);
    const rows=[['Năm',y,'Tháng',m,'',bo.ten+' — '+(pt?'ghi % hoàn thành':'ghi điểm đạt')+' từng tiêu chí'],[''],['Mã NV','Họ và tên',...bo.tc.map(t=>t.ten+' (tối đa '+fmt(t.diem)+') ['+t.id+']'),'Tổng điểm','Tiền KPI']];
    nvs.forEach(nv=>{const x=(kt.d||{})[nv.ma]||{},r=res[nv.ma];rows.push([nv.ma,nv.ten,...bo.tc.map(t=>mau||x[t.id]==null?'':x[t.id]),mau||!r?'':r.diem,mau||!r?'':r.tien]);});
    return {name:('KPI_'+bo.ma).slice(0,31),headerRows:3,rows,cols:[9,24,...bo.tc.map(()=>18),10,13],freeze:[3,2]};});}
function docKPI(wb,db){const out=[],boMap={};db.kpiBo.forEach(b=>b.tc.forEach(t=>boMap[t.id]=b));
  wb.order.forEach(name=>{const sh=wb.sheets[name],h=findHeader(sh,'manv');if(!h)return;const raw=sh.rows[h.r]||[],ids=raw.map(x=>{const mm=String(x==null?'':x).match(/\[([^\]]+)\]\s*$/);return mm&&boMap[mm[1]]?mm[1]:null;});
    if(!ids.some(Boolean))return;let y=null,m=null;for(let r=0;r<h.r;r++){const row=sh.rows[r]||[];row.forEach((v,c)=>{const k=norm(v);if(k==='nam')y=+row[c+1];if(k==='thang')m=+row[c+1];});}
    if(!y||!(m>=1&&m<=12))[y,m]=per();
    for(let r=h.r+1;r<sh.rows.length;r++){const row=sh.rows[r]||[],ma=String(row[h.c]==null?'':row[h.c]).trim();if(!ma)continue;ids.forEach((id,c)=>{if(id&&row[c]!=null&&String(row[c]).trim()!=='')out.push([ma,y,m,id,parseNum(row[c]),boMap[id].ma]);});}});
  return out;}

function kyChiTra(db,y,m){const d=ngayChiTra(db,y,m);if(/^\d{4}-\d{2}-\d{2}$/.test(d))return [+d.slice(0,4),+d.slice(5,7)];return themThang(y,m,+db.cfg.traLuongSau||0);}
/* Các kỳ lương được chi trả trong tháng y/m */
function kyLuongCua(db,y,m){const out=[];for(let i=-14;i<=2;i++){const [a,b]=themThang(y,m,i),[c,d]=kyChiTra(db,a,b);if(c===y&&d===m)out.push([a,b]);}return out;}

function gopTheoNV(periods){
  const map=new Map(),seen=new Set(),ls=[];periods.forEach(([y,m])=>kyLuongCua(DB,y,m).forEach(p=>{const k=pk(p[0],p[1]);if(!seen.has(k)){seen.add(k);ls.push(p);}}));
  ls.forEach(([y,m])=>monthRows(y,m).forEach(r=>{let a=map.get(r.ma);
    if(!a){a={ma:r.ma,ten:r.ten,boPhan:r.boPhan,dienThue:r.dienThue,npt:r.npt,thang:0,tongTN:0,mienTN:0,tnct:0,bhxh:0,bhyt:0,bhtn:0,bh:0,giamTru:0,tntt:0,thue:0};map.set(r.ma,a);}
    a.thang++;a.tongTN+=r.tongTN;a.mienTN+=r.mienTN;a.tnct+=r.tongTN-r.mienTN;a.bhxh+=r.bhxh;a.bhyt+=r.bhyt;a.bhtn+=r.bhtn;a.bh+=r.bhxh+r.bhyt+r.bhtn;

/* Tính nhanh lương Gross ⇄ Net theo tham số Cấu hình (cá nhân cư trú, HĐ ≥ 3 tháng) */
function tinhGross(cfg,gross,lbh,npt){
  const tranBH=cfg.boiSoTran*cfg.luongCoSo,tranTN=cfg.boiSoTran*cfg.lttVung;
  const bhxh=R(Math.min(lbh,tranBH)*cfg.bhxh),bhyt=R(Math.min(lbh,tranBH)*cfg.bhyt),bhtn=R(Math.min(lbh,tranTN)*cfg.bhtn);
  const gt=cfg.gtBanThan+npt*cfg.gtNPT,tntt=R(Math.max(0,gross-bhxh-bhyt-bhtn-gt)),thue=thueLuyTien(cfg,tntt);
  return {gross,lbh,bhxh,bhyt,bhtn,gt,tntt,thue,net:gross-bhxh-bhyt-bhtn-thue};
}
function tinhNet(cfg,net,lbhFn,npt){
  let lo=Math.max(0,Math.floor(net)),hi=Math.max(lo+1,Math.ceil(net*2.2)+1e7);
  while(tinhGross(cfg,hi,lbhFn(hi),npt).net<net)hi*=2;
  while(lo<hi){const mid=Math.floor((lo+hi)/2);if(tinhGross(cfg,mid,lbhFn(mid),npt).net>=net)hi=mid;else lo=mid+1;}
  return tinhGross(cfg,lo,lbhFn(lo),npt);
}

function parseTimeH(v){
  if(v==null||v==='')return null;
  if(typeof v==='number'){if(v>=0&&v<1)return v*24;const f=v%1;return f>1e-9?f*24:null;}
  const m=String(v).match(/(\d{1,2})\s*[:hH]\s*(\d{2})(?:\s*:\s*(\d{2}))?\s*(AM|PM|SA|CH)?/i);if(!m)return null;
  let h=+m[1];const ap=(m[4]||'').toUpperCase();if((ap==='PM'||ap==='CH')&&h<12)h+=12;if((ap==='AM'||ap==='SA')&&h===12)h=0;
  return h+(+m[2])/60+(m[3]?+m[3]/3600:0);
}
function parseCSV(text,name){
  text=text.replace(/^﻿/,'');const first=text.split(/\r?\n/)[0]||'';
  const dl=[',',';','\t'].map(d=>[d,first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=ch;}
    else if(ch==='"')q=true;else if(ch===dl){row.push(f);f='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';}else f+=ch;}
  if(f!==''||row.length){row.push(f);rows.push(row);}
  const conv=rows.map(r=>r.map(v=>{const s=v.trim();return /^-?\d+(\.\d+)?$/.test(s)&&!/^0\d/.test(s)?+s:s;}));
  const nm=String(name||'CSV').replace(/\.[^.]+$/,'');return {sheets:{[nm]:{rows:conv}},order:[nm]};
}
async function readAny(file){
  if(/\.(csv|txt)$/i.test(file.name)){const buf=new Uint8Array(await file.arrayBuffer());
    let txt=new TextDecoder('utf-8').decode(buf);if(buf[0]===0xFF&&buf[1]===0xFE)txt=new TextDecoder('utf-16le').decode(buf);
    return parseCSV(txt,file.name);}
  return readXlsx(await file.arrayBuffer());
}

        const key=ma+'|'+d.join('-');let p=punches.get(key);if(!p){p={ma,d,vao:null,ra:null};punches.set(key,p);}
        const ts=info.type==='vaora'?[parseTimeH(row[info.iVao]),info.iRa>=0?parseTimeH(row[info.iRa]):null]:[parseTimeH(row[info.iTG])];
        if(info.type==='vaora'){if(ts[0]!=null)p.vao=p.vao==null?ts[0]:Math.min(p.vao,ts[0]);if(ts[1]!=null)p.ra=p.ra==null?ts[1]:Math.max(p.ra,ts[1]);}
        else if(ts[0]!=null){p.vao=p.vao==null?ts[0]:Math.min(p.vao,ts[0]);p.ra=p.ra==null?ts[0]:Math.max(p.ra,ts[0]);}
        n++;}
    }else if(info.type==='tonghop'){
      const ix=(...k)=>info.hd.findIndex(x=>k.includes(x));
      const cols=[['tc',ix('giotcthuong','giotangca','giotc','giotangcathuong')],['tcNghi',ix('giotcngaynghi')],['tcLe',ix('giotcle','giotcngayle')],['tamUng',ix('tamung')]];
      for(let r=start;r<rows.length;r++){const row=rows[r]||[];const rawMa=row[info.iMa];if(rawMa==null||String(rawMa).trim()==='')continue;
        const ma=find(rawMa,info.iTen>=0?row[info.iTen]:'');if(!ma){addNV(rawMa);continue;}
        const y=parseNum(row[info.iNam]),m=parseNum(row[info.iThang]);if(!y||!(m>=1&&m<=12))continue;
        cols.forEach(([f,i])=>{if(i>=0){const v=parseNum(row[i]);if(v){R0.nhap.push([ma,y,m,f,v]);n++;}}});R0.months.add(pk(y,m));}
    }
    R0.sheets.push({name,type:info.type,n});
  }
  // Quy đổi giờ vào / ra thành ký hiệu
  const tcM=new Map();
  punches.forEach(p=>{const q=quyDoiGio(p.vao,p.ra,o);if(!q)return;if(q.thieu)R0.thieu++;
    if(q.code)cell(p.ma,p.d[0],p.d[1],p.d[2],q.code);
    if(q.tc){const k=p.ma+'|'+p.d[0]+'|'+p.d[1];tcM.set(k,(tcM.get(k)||0)+q.tc);}});
  tcM.forEach((v,k)=>{const [ma,y,m]=k.split('|');R0.nhap.push([ma,+y,+m,'tc',v]);});
  return R0;
}
function applyChamCong(res,ghiDe){
  let ghi=0,boQua=0;
  res.cells.forEach(([ma,y,m,d,code])=>{const cur=getDays(DB,ma,y,m)[d-1];if(cur&&!ghiDe&&cur!==code){boQua++;return;}if(cur!==code){setDay(DB,ma,y,m,d,code);ghi++;}});
  res.nhap.forEach(([ma,y,m,f,v])=>{const cur=getNhap(DB,ma,y,m)[f];if(cur&&!ghiDe&&cur!==v){boQua++;return;}setNhap(DB,ma,y,m,f,v);ghi++;});
  (res.tcNgay||[]).forEach(([ma,y,m,d,h])=>{const cur=+getTcNgay(DB,ma,y,m)[d-1]||0;if(cur&&!ghiDe&&cur!==h){boQua++;return;}setTcNgay(DB,ma,y,m,d,h);ghi++;});
  syncAllTC(DB);save();return {ghi,boQua};
}

      ${x.kieu==='Y'?'<span style="white-space:nowrap">Năm quyết toán</span>':`<select class="f" id="xKieu" style="flex:1"><option value="Q">Theo quý</option><option value="M"${x.kieu==='M'?' selected':''}>Theo tháng</option></select>
      <select class="f" id="xKy" style="flex:1">${kyOpt.map(([v,l])=>`<option value="${v}"${v===x.ky?' selected':''}>${l}</option>`).join('')}</select>`}

    <label>Loại tờ khai<div style="display:flex;gap:6px"><select class="f" id="xLoai" style="flex:1"><option value="C">Chính thức</option><option value="B"${x.loai==='B'?' selected':''}>Bổ sung</option></select>
      <input class="f" type="number" min="1" id="xLan" value="${x.lan}" style="width:90px;${x.loai==='B'?'':'display:none'}" title="Bổ sung lần thứ"></div></label>

  </div></div>
  <div class="card" style="min-width:0"><h2>Thông tin người nộp thuế</h2>
    <p class="small muted" style="margin-top:0">Khách hàng tự điền; lưu lại cho các lần sau (dùng chung với Cấu hình → Thông tin doanh nghiệp). Mã tỉnh, mã phường/xã, mã cơ quan thuế xem trên HTKK.</p>
    <div class="form" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
    ${NNT_F.map(([k2,,lab,req])=>`<label class="${['congTy','diaChi'].includes(k2)?'full':''}">${lab}${req?' *':''}<input class="f${req?' in':''}" data-nnt="${k2}" value="${esc(DB.cfg[k2]||'')}"></label>`).join('')}</div>
    ${tplNNT?`<button class="btn sm" id="xLayNNT" style="margin-top:8px">Lấy thông tin từ file mẫu (${esc(info.nnt.congTy||info.nnt.mst)})</button>`:''}</div>
  <div class="card">${ck.e.length?`<div class="alert" id="xErr" style="margin:0 0 10px"><b>Chưa xuất được:</b><ul>${ck.e.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>`:''}
    ${!ck.e.length&&ck.w.length?`<div class="alert" style="margin:0 0 10px">Còn trống ${ck.w.join(', ')} — HTKK / eTax có thể báo thiếu.</div>`:''}
    <button class="btn pri" id="xOut" style="width:100%"${ck.e.length?' disabled':''}>Xuất file XML</button><div class="small muted" style="margin-top:6px">Tên file: ${esc(b.file)}</div></div></div>
  <div><div class="alert ${T6?'':'info'}">${T6?'<b>Lưu ý:</b> mẫu 06/TNCN dùng cho thu nhập từ đầu tư vốn, chuyển nhượng chứng khoán, bản quyền, trúng thưởng… — <b>không có tiền lương, tiền công</b>, nên các chỉ tiêu mặc định là 0.':
      isQT?`Tờ khai quyết toán năm <b>${x.nam}</b>: phần I lấy từ bảng lương 12 tháng; phần II lấy từ tab “Quyết toán năm” (chỉ những người được chọn quyết toán thay). [39] = số thuế còn phải nộp của từng người từ ${fmt(DB.cfg.qtMienDuoi)} đ trở xuống (được miễn); [40], [41] = [38] − [36] − [39]. Tờ khai quyết toán nộp kèm bảng kê 05-1/BK (và 05-2/BK nếu có) — file này chỉ có tờ khai chính.`:
      is05?'Tờ khai 05/KK-TNCN: [16]–[20] số người, [21]–[23] thu nhập chịu thuế trả cho cá nhân, [26]–[28] thu nhập chịu thuế của người thuộc diện khấu trừ, [29]–[31] thuế đã khấu trừ — lấy từ bảng lương các tháng trong kỳ. [24], [25], [32] (bảo hiểm nhân thọ, hợp đồng dầu khí) = 0. Các dòng còn “giữ nguyên” anh/chị tự chọn nếu có phát sinh.':'Chọn nguồn số liệu cho từng chỉ tiêu. Chỉ tiêu chưa chọn giữ nguyên số trong file mẫu.'}</div>
    ${unset&&!T6?`<div class="alert">Còn <b>${unset}</b> chỉ tiêu chưa chọn nguồn số liệu.</div>`:''}
    <div class="card" style="padding:0"><div class="tbl-wrap" style="border:0;max-height:calc(100vh - 230px)"><table class="t" id="xTbl"><thead><tr><th>Nhóm</th><th>Chỉ tiêu</th><th>Lấy số liệu từ (kỳ ${esc(b.k.ky)})</th><th class="n">Giá trị</th></tr></thead><tbody>
    ${b.vals.map(v=>`<tr${v.src?'':' style="background:#fffaf0"'}><td class="small muted">${nhom(v.par)}</td><td><b>[${v.so}]</b></td><td><select class="f" data-path="${esc(v.path)}" style="min-width:300px;padding:3px 6px">${XSRC.map(([a,l])=>`<option value="${a}"${a===v.src?' selected':''}>${esc(l)}</option>`).join('')}</select></td><td class="n strong">${fmt(+v.val||0)}</td></tr>`).join('')}</tbody></table></div></div></div></div>`;
  $('#xTpl').onchange=e=>{x.tpl=e.target.value;thueXML();};
  const xk=$('#xKieu');if(xk)xk.onchange=e=>{x.kieu=e.target.value;x.ky=x.kieu==='Q'?Math.ceil(DB.ui.thang/3):DB.ui.thang;thueXML();};
  const xy=$('#xKy');if(xy)xy.onchange=e=>{x.ky=+e.target.value;thueXML();};
  $('#xNam').onchange=e=>{x.nam=+e.target.value;thueXML();};
  $('#xLoai').onchange=e=>{x.loai=e.target.value;thueXML();};$('#xLan').onchange=e=>{x.lan=Math.max(1,+e.target.value||1);thueXML();};
  $('#xNgay').onchange=e=>{x.ngay=e.target.value||new Date().toISOString().slice(0,10);thueXML();};
  $('#xNK').onchange=e=>{DB.xml.nguoiKy=e.target.value.trim();save();};
  $$('[data-nnt]').forEach(i=>i.onchange=()=>{let v=i.value.trim();if(i.dataset.nnt==='mst')v=v.replace(/\s/g,'');DB.cfg[i.dataset.nnt]=v;save();thueXML();});
  const ln=$('#xLayNNT');if(ln)ln.onclick=()=>{NNT_F.forEach(([k2])=>{if(info.nnt[k2])DB.cfg[k2]=info.nnt[k2];});save();toast('Đã lấy thông tin người nộp thuế từ file mẫu','ok');thueXML();};
  $$('#xTbl select[data-path]').forEach(s=>s.onchange=()=>{map[s.dataset.path]=s.value;if(!s.value)delete map[s.dataset.path];save();thueXML();});
  $('#xUp').onclick=()=>{$('#fileXml').value='';$('#fileXml').click();};
  const d=$('#xDel');if(d)d.onclick=()=>modal('Xóa file mẫu','Xóa file mẫu “'+esc(tpl.ten)+'” khỏi phần mềm?',[{t:'Hủy'},{t:'Xóa',cls:'danger',fn:()=>{DB.xml.mau=DB.xml.mau.filter(t=>t.id!==tpl.id);delete DB.xml.map[tpl.id];x.tpl='kk';save();thueXML();}}]);
  $('#xOut').onclick=()=>{const c=xmlCheck();if(c.e.length){toast(c.e.join('; '),'err');return;}
    try{const r=xmlBuild(tpl,Object.assign(o,{nguoiKy:DB.xml.nguoiKy||''}));download(r.file,new Blob([r.xml],{type:'application/xml'}));toast('Đã xuất '+r.file,'ok');}catch(e){toast('Không xuất được: '+e.message,'err');}};
}

/* ---------- Hướng dẫn sử dụng ---------- */
const HD=[
 {id:'batdau',ten:'Bắt đầu nhanh',html:`
  <p>Phần mềm chạy hoàn toàn trên trình duyệt (Chrome, Edge, Cốc Cốc, Firefox bản mới), không cần cài đặt, không cần Internet. Chỉ cần mở file <b>ChamCong_TinhLuong.html</b>.</p>
  <h3>5 bước để có bảng lương tháng đầu tiên</h3>
  <ol>
   <li><b>Cấu hình</b>: nhập tên công ty, mã số thuế, địa chỉ; kiểm tra <b>lương tối thiểu vùng</b> nơi doanh nghiệp hoạt động và các tỷ lệ bảo hiểm.</li>
   <li><b>Nhân viên</b>: thêm từng người, hoặc tải <b>file mẫu</b> → điền danh sách trong Excel → <b>Nhập từ Excel</b>.</li>
   <li><b>Chọn kỳ lương</b> ở góc trên bên phải (tháng, năm). Mọi màn hình đều làm việc theo kỳ đang chọn.</li>
   <li><b>Chấm công</b>: chấm từng ô, chấm hàng loạt, hoặc nhập file chấm công; nhập tạm ứng ở cột cuối. Giờ làm thêm ghi theo từng ngày ở mục <b>Tăng ca / làm thêm</b> (hoặc nhập tổng giờ tháng ở các cột cuối bảng chấm công).</li>
   <li><b>Bảng lương</b> tự tính. In <b>Phiếu lương</b>, xuất Excel, rồi <b>Sao lưu JSON</b>.</li>
  </ol>
  <div class="hdnote"><b>Cần hỗ trợ?</b> Gọi / Zalo hotline <b>0563.520.805</b> — Peqqa (peqqa.pages.dev).</div>
  <div class="hdnote">Muốn xem thử trước: vào <b>Nhập / Xuất dữ liệu → Nạp dữ liệu mẫu</b> (5 nhân viên, tháng 10/2026). Thao tác này thay thế dữ liệu đang có.</div>
  <h3>Bố cục màn hình</h3>
  <ul><li>Cột trái: các chức năng. Góc trên: <b>Kỳ lương</b> và trạng thái lưu (“Đã lưu hh:mm”).</li>
   <li>Ô nền <span class="hdin">vàng nhạt</span> là ô nhập liệu. Ô trắng là số tự tính.</li>
   <li>Nút <b>? Hướng dẫn</b> ở góc trên mở đúng phần hướng dẫn của màn hình đang xem.</li></ul>`},
 {id:'nhieucty',ten:'Làm cho nhiều công ty',html:`
  <p>Một file phần mềm dùng được cho <b>nhiều công ty</b>: mỗi công ty có bộ dữ liệu riêng (nhân viên, chấm công, bảng lương, cấu hình, tờ khai).</p>
  <ol><li>Bấm nút <b>tên công ty</b> ở đầu menu bên trái (dưới chữ “Chấm công &amp; Tính lương 2026”).</li>
   <li>Ở ô <b>Thêm công ty</b>: nhập tên → <b>+ Thêm công ty</b>. Để tích “Dùng chung thiết lập” nếu muốn chép cấu hình tham số, danh mục phụ cấp, ký hiệu chấm công, công thức, bộ tiêu chí KPI của công ty đang mở (không chép nhân viên, chấm công, MST).</li>
   <li>Phần mềm chuyển sang công ty mới. Muốn quay lại công ty khác: bấm tên công ty → <b>Mở</b>.</li></ol>
  <ul><li><b>Đổi tên</b>, <b>Sao lưu</b> (file JSON riêng từng công ty), <b>Xóa</b> ngay trong danh sách. <b>Sao lưu tất cả công ty</b> ra một file; khôi phục ở Nhập / Xuất dữ liệu → Khôi phục từ file JSON (chọn thêm vào danh sách hoặc thay thế toàn bộ).</li>
   <li>Dữ liệu lưu trong trình duyệt của máy đang dùng (khoảng 5 MB cho tất cả công ty — đủ cho nhiều công ty vừa và nhỏ trong vài năm). Danh sách công ty hiện dung lượng từng công ty; công ty không còn làm thì sao lưu rồi xóa.</li>
   <li>Muốn làm trên máy khác: Sao lưu tất cả ở máy cũ → Khôi phục ở máy mới.</li></ul>
  <div class="hdwarn">Chép file .html ra nhiều thư mục <b>không</b> tách được dữ liệu: các bản file mở bằng cùng một trình duyệt trên cùng máy dùng chung một vùng lưu trữ. Hãy dùng danh sách công ty như trên.</div>`},
 {id:'luutru',ten:'Lưu dữ liệu & sao lưu',html:`
  <p>Dữ liệu được <b>tự động lưu trong trình duyệt</b> của máy đang dùng ngay khi bạn nhập (góc trên hiện “Đã lưu”). Không có máy chủ, không gửi dữ liệu đi đâu.</p>
  <div class="hdwarn"><b>Quan trọng:</b> dữ liệu sẽ mất nếu xóa lịch sử / dữ liệu duyệt web, dùng chế độ ẩn danh, đổi trình duyệt hoặc đổi máy. Hãy <b>Sao lưu JSON</b> sau mỗi kỳ chốt lương và cất file ở nơi an toàn (Google Drive, USB…).</div>
  <ul><li><b>Sao lưu</b>: Nhập / Xuất dữ liệu → <b>Sao lưu ra file JSON</b>. Góc dưới thanh bên trái hiện ngày sao lưu gần nhất.</li>
   <li><b>Khôi phục / chuyển sang máy khác</b>: mở phần mềm trên máy mới → Nhập / Xuất dữ liệu → <b>Khôi phục từ file JSON</b>. Toàn bộ dữ liệu hiện tại sẽ được thay bằng bản sao lưu.</li>
   <li>Bản sao lưu chứa mọi thứ: cấu hình, nhân viên, chấm công, phụ cấp, công thức, ký hiệu, mẫu tờ khai XML.</li>
   <li>Mỗi trình duyệt (và mỗi đường dẫn file) có bộ dữ liệu riêng. Hãy luôn mở cùng một file, cùng một trình duyệt.</li></ul>`},
 {id:'cauhinh',ten:'Cấu hình tham số',html:`
  <p>Mọi tham số tính lương nằm ở <b>Cấu hình</b>; sửa xong bấm <b>Lưu cấu hình</b>. Giá trị mặc định đúng như file Excel gốc.</p>
  <ul>
   <li><b>Thông tin doanh nghiệp</b>: tên, địa chỉ, MST (in trên bảng lương, phiếu lương); phường/xã, tỉnh, cơ quan thuế và các mã theo HTKK (dùng khi xuất XML tờ khai).</li>
   <li><b>Ngày công & tăng ca</b>: số giờ / ngày (mặc định 8); có nghỉ thứ Bảy không (mặc định chỉ nghỉ Chủ nhật — công chuẩn = số ngày trong tháng trừ Chủ nhật); hệ số tăng ca ngày thường / ngày nghỉ / lễ (150% / 200% / 300%); miễn thuế <b>toàn bộ</b> tiền tăng ca hay chỉ <b>phần chênh lệch</b>.</li>
   <li><b>Bảo hiểm</b>: tỷ lệ NLĐ đóng (8% / 1,5% / 1%); lương cơ sở và lương tối thiểu vùng (dùng tính trần = 20 lần); quy tắc 14 ngày (tùy chọn); tỷ lệ DN đóng tách theo quỹ (ốm đau – thai sản 3%, TNLĐ – BNN 0,5%, hưu trí – tử tuất 14%), BHYT 3%, BHTN 1%, KPCĐ 2%.</li>
   <li><b>Thuế TNCN</b>: giảm trừ bản thân / người phụ thuộc; biểu thuế lũy tiến (sửa, thêm, bớt bậc được); thuế suất khấu trừ 10% (HĐ dưới 3 tháng) và 20% (không cư trú); các tùy chọn quyết toán năm.</li>
  </ul>
  <h3>Ngày công chuẩn</h3>
  <ul><li><b>Tự tính</b> (mặc định, như Excel): số ngày trong tháng trừ ngày nghỉ hằng tuần — tháng 10/2026 = 27 công.</li>
   <li><b>Cố định</b>: chọn “Cố định mỗi tháng” và nhập số công (VD 26, 24, 22) theo quy chế lương.</li>
   <li><b>Sửa riêng một tháng</b>: ô <b>Công chuẩn</b> ở đầu Bảng chấm công hoặc Bảng lương — gõ số mới (VD tháng có nghỉ Tết dài); bấm ↺ để về lại mức chung. Lương theo ngày công, tiền tăng ca, phụ cấp theo ngày công tính lại ngay.</li></ul>
  <div class="hdwarn">Tham số áp dụng cho <b>mọi kỳ lương</b>. Khi Nhà nước đổi mức giữa năm, hãy xuất / in bảng lương các tháng đã chốt trước khi sửa. <b>Khôi phục mặc định</b> đưa các tham số tính lương về giá trị của file Excel gốc (giữ thông tin doanh nghiệp).</div>`},
 {id:'nhanvien',ten:'Nhân viên',html:`
  <ul><li><b>+ Thêm nhân viên</b>: Mã NV (không trùng), họ tên, bộ phận, chức vụ, lương cơ bản, lương đóng BH, số người phụ thuộc, <b>email nhận phiếu lương</b>, diện thuế, trạng thái.</li>
   <li><b>Lương đóng BH</b> để trống = lương cơ bản + các phụ cấp có đánh dấu “tính vào lương đóng BH”. Nhập 0 nếu người đó không tham gia BH.</li>
   <li><b>Không nhận lương – chỉ đóng BH</b>: dành cho chủ sở hữu / người không hưởng lương nhưng có tham gia BH — BH không trừ vào lương nên thực lĩnh không bị âm.</li>
   <li><b>Diện thuế</b>: Cư trú – lũy tiến (HĐ từ 3 tháng); HĐ dưới 3 tháng – khấu trừ 10% (khi thu nhập từ ngưỡng ở Cấu hình); Không cư trú – 20%.</li>
   <li>Phần cuối form là <b>định mức phụ cấp / khấu trừ</b> của riêng người đó; để trống = dùng định mức mặc định của khoản.</li>
   <li><b>Xóa</b>: nếu người đó đã có dữ liệu chấm công, nên chọn <b>Đánh dấu đã nghỉ</b> để giữ lịch sử; nhân viên đã nghỉ vẫn hiện ở các tháng có dữ liệu.</li>
   <li><b>Tải file mẫu</b> / <b>Nhập từ Excel</b>: nhập cả danh sách một lần (xem phần Nhập / Xuất dữ liệu).</li>
   <li>Ô tìm kiếm gõ không dấu vẫn tìm được (“nguyen van” tìm ra “Nguyễn Văn”).</li></ul>`},
 {id:'phucap',ten:'Phụ cấp & khấu trừ',html:`
  <p>Tab <b>Danh mục khoản</b> khai báo các khoản cộng thêm (phụ cấp, thưởng) hoặc trừ đi (đoàn phí, khấu trừ khác). Chỉ khoản <b>Đang dùng</b> mới vào bảng lương. Có sẵn khoản “Phụ cấp” (giống cột Phụ cấp của file Excel) và một số khoản mẫu đang tắt.</p>
  <h3>Mỗi khoản gồm</h3>
  <ul><li><b>Cách tính</b>:
     <ul><li><i>Theo ngày công</i> — định mức ÷ công chuẩn × ngày công (gộp vào “Lương theo ngày công” như Excel).</li>
      <li><i>Theo ngày đi làm thực tế</i> — định mức ÷ công chuẩn × số ngày thực đi làm (hợp với ăn ca, xăng xe).</li>
      <li><i>Đơn giá theo ngày × số ngày</i> — định mức là <b>tiền 1 ngày</b>, nhân với số ngày đếm được. Chọn <b>Đếm theo</b> ngày đi làm thực tế (không tính phép, lễ, nghỉ) hoặc ngày công tính lương, và có thể <b>chỉ đếm một số ký hiệu</b>. Ví dụ: <i>Phụ cấp ăn ca</i> 30.000 đ × ngày đi làm thực tế; <i>Hỗ trợ đi công trình</i> 150.000 đ × số ngày công chấm <b>CTR</b>; <i>Tiền ăn đi công trình</i> 40.000 đ × số ngày đi làm chấm CTR. Form có phần xem trước số ngày và số tiền của 5 nhân viên đầu.</li>
      <li><i>Cố định hằng tháng</i> — nhận đủ định mức.</li>
      <li><i>Nhập số tiền từng tháng</i> — thưởng, công tác phí, khấu trừ phát sinh.</li>
      <li><i>Theo công thức</i> — tự viết, ví dụ thưởng chuyên cần <code>IF(SO_KL = 0, MUC, 0)</code> (MUC = định mức của người đó). Bấm nút <b>ƒ Công thức</b> trên dòng của khoản để thiết lập: có sẵn 9 mẫu (đơn giá × ngày đi làm, đơn giá × số ngày đi công trình, đủ công nhận đủ, số km × đơn giá, số lít × giá xăng, thanh toán theo đề nghị tối đa bằng định mức…) và xem trước số tiền ngay khi gõ.</li>
      <li><i>Nhập số lượng hằng tháng (SL)</i> — với khoản theo công thức, tích “Nhập số lượng hằng tháng” (VD Số km): tab Số tiền theo nhân viên có thêm cột để nhập số km từng người mỗi tháng; công thức <code>ROUND(SL * MUC, 0)</code> với định mức = đơn giá 1 km.</li></ul></li>
   <li><b>Thuế TNCN</b>: chịu thuế / miễn toàn bộ / miễn trong mức tối đa mỗi tháng.</li>
   <li><b>Tính vào lương đóng BH</b>: dùng khi tự tính lương đóng BH của nhân viên.</li>
   <li><b>Định mức mặc định</b>: áp cho mọi người chưa nhập mức riêng.</li></ul>
  <ul><li>Tab <b>Số tiền theo nhân viên</b>: nhập định mức từng người như bảng tính; khoản “nhập từng tháng” ghi cho kỳ đang chọn.</li>
   <li>Tab <b>Thực nhận kỳ này</b>: xem số tiền từng khoản sau khi tính.</li></ul>
  <h3>Phụ cấp ăn ca (cơm ca) theo ngày</h3>
  <p>Khoản <b>Phụ cấp ăn ca</b> mặc định tính = <b>đơn giá 1 ngày × số ngày đi làm thực tế</b> (VD 30.000 × 26). Nếu dữ liệu cũ còn tính theo định mức tháng, màn hình Danh mục khoản hiện dòng nhắc — bấm <b>Chuyển sang đơn giá ngày</b>, nhập đơn giá, chọn nhân với ngày đi làm thực tế hay ngày công, và chọn quy đổi mức riêng từng người (mức tháng ÷ công chuẩn, làm tròn nghìn) hoặc dùng đơn giá chung.</p>
  <h3>Thưởng theo doanh thu / sản lượng thực đạt</h3>
  <p>Tab <b>Thưởng doanh thu / sản lượng</b> (cũng có ở Lương KPI): chọn loại thưởng, nhập số liệu đạt của từng người trong tháng → tiền thưởng tự vào cột riêng của bảng lương.</p>
  <ul><li><b>Căn cứ</b>: <i>Doanh thu</i> (đ) × tỷ lệ %, hoặc <i>Sản lượng</i> (sản phẩm, kg, m³…) × đơn giá thưởng / đơn vị.</li>
   <li><b>Cách tính</b>: một mức; bậc thang (đạt bậc nào áp mức bậc đó cho toàn bộ); lũy tiến từng phần. Có mức tối thiểu để được thưởng; người có thỏa thuận khác nhập tỷ lệ / đơn giá riêng.</li>
   <li><b>+ Thêm loại thưởng</b> để có nhiều cột (VD thưởng doanh thu cho NV bán hàng, thưởng sản lượng cho công nhân). Nhập / xuất Excel theo file mẫu; phiếu lương ghi rõ “sản lượng 1.200 sản phẩm × …”.</li></ul>
  <h3>Hỗ trợ người đi công trình ở xa</h3>
  <ol><li>Chấm công những ngày làm ở công trình bằng ký hiệu <b>CTR – Đi công trình</b> (vẫn tính 1 ngày công, 1 ngày đi làm).</li>
   <li>Bật khoản <b>Hỗ trợ đi công trình</b> và <b>Tiền ăn đi công trình</b>, nhập đơn giá 1 ngày. Người có mức riêng thì nhập ở tab Số tiền theo nhân viên hoặc trong hồ sơ nhân viên (cột “đơn giá / ngày”).</li>
   <li>Bảng lương có cột riêng cho từng khoản; phiếu lương ghi rõ “(5 ngày × 150.000)”.</li></ol>
  <p>Cần mức khác cho nửa ngày ở công trình: thêm ký hiệu mới (VD <b>CTN</b>, 0,5 công) ở Chấm công → Ký hiệu, rồi tích thêm ký hiệu đó trong khoản.</p>
  <h3>Tiền trang phục chi bằng tiền (chi nhiều đợt)</h3>
  <ul><li>Khoản <b>TP – Tiền trang phục</b> có chế độ thuế <b>“Miễn thuế lũy kế trong năm”</b>, mức 5.000.000 đ/người/năm (khoản 2 Điều 2 TT 111/2013/TT-BTC; sửa được nếu quy định thay đổi).</li>
   <li>Tab <b>Trang phục – lũy kế năm</b>: mỗi người một dòng, 12 cột tháng — nhập số tiền chi ở tháng chi (đợt 1 tháng 3, đợt 2 tháng 6…). Bảng hiện <b>lũy kế năm, phần được miễn, còn được miễn, phần chịu thuế</b>.</li>
   <li>Khi lũy kế vượt 5 triệu, phần vượt tự tính vào thu nhập chịu thuế của tháng chi vượt; bảng lương có cảnh báo ⚠, phiếu lương ghi “(lũy kế năm … / 5.000.000)”.</li>
   <li>Chế độ “lũy kế trong năm” dùng được cho khoản khác có mức miễn tính theo năm (chọn ở Sửa khoản → Thuế TNCN).</li></ul>
  <div class="hdnote">Khoản “đơn giá theo ngày” không cộng vào lương đóng BH tự tính. Cách tính thuế mặc định của các khoản mẫu là “Chịu thuế”. Hãy tự đặt theo quy định đang áp dụng (ví dụ phụ cấp ăn ca, điện thoại).</div>`},
 {id:'kpi',ten:'Lương KPI',html:`
  <p>Mục <b>Lương KPI</b> chấm điểm hiệu quả công việc theo bộ tiêu chí do doanh nghiệp tự đặt, rồi tính tiền thưởng KPI vào bảng lương (khoản <b>Thưởng KPI</b>).</p>
  <h3>1. Bộ tiêu chí (tab “Bộ tiêu chí &amp; cách tính tiền”)</h3>
  <ul><li>Có sẵn 2 bộ mẫu: <i>KPI chung</i> và <i>KPI kinh doanh</i>. Sửa tên, thêm / xóa tiêu chí, đặt <b>điểm tối đa</b> và cách đo cho từng tiêu chí; thêm bộ mới cho từng bộ phận.</li>
   <li><b>Tổng điểm tối đa của mỗi bộ phải bằng thang điểm (mặc định 100)</b> — phần mềm hiện tổng ngay khi gõ (thiếu / thừa bao nhiêu) và không cho lưu nếu chưa đủ.</li>
   <li>Mỗi nhân viên thuộc một bộ (chọn ở bảng chấm điểm hoặc hồ sơ nhân viên); chọn “Không tham gia KPI” cho người không áp dụng.</li></ul>
  <h3>2. Cách tính tiền KPI</h3>
  <ul><li><b>Mức KPI riêng từng nhân viên</b>: mỗi người một mức / tháng (VD 3.000.000). Tiền = mức × tổng điểm ÷ 100.</li>
   <li><b>Quỹ KPI cố định</b>: công ty định trước số tiền KPI của tháng (sửa được từng tháng). Quỹ chia cho những người được chấm theo <b>điểm × hệ số</b>.</li>
   <li><b>Theo doanh số</b>: nhập doanh số bán hàng của tháng; quỹ = doanh số × tỷ lệ % (VD 2%); chia theo điểm × hệ số.</li>
   <li>Khi chia quỹ, tổng tiền chia ra luôn đúng bằng quỹ (phần lẻ đồng được làm tròn hợp lý). <b>Hệ số</b> mặc định 1 — đặt cao hơn cho trưởng nhóm, quản lý.</li>
   <li><b>Điểm tối thiểu</b>: dưới mức này không được thưởng (0 = không áp dụng). <b>Cách chấm</b>: nhập điểm đạt, hoặc nhập % hoàn thành từng tiêu chí (điểm = điểm tối đa × %).</li></ul>
  <h3>3. Chấm điểm hằng tháng</h3>
  <ul><li>Tab <b>Chấm điểm KPI</b>: mỗi bộ một bảng; nhập điểm từng tiêu chí, tổng điểm và tiền KPI hiện ngay. Ai chưa được chấm thì không có KPI tháng đó.</li>
   <li>Có thể <b>Tải file mẫu</b> → các trưởng bộ phận chấm trên Excel → <b>Nhập từ Excel</b>. <b>In bảng KPI</b> có cột ký xác nhận, chỗ ký duyệt.</li>
   <li>Tiền KPI vào bảng lương ở cột <b>Thưởng KPI</b> (chịu thuế TNCN, không tính vào lương đóng BH); phiếu lương ghi “(90/100 điểm)”. Màn hình chấm điểm báo “Tiền KPI đã chuyển sang Bảng lương” kèm nút mở bảng lương.</li>
   <li>Nếu đã chấm điểm mà tiền KPI = 0, phần mềm báo nguyên nhân: chưa nhập <b>Mức KPI / tháng</b> (cách mức riêng), chưa nhập <b>quỹ</b> hoặc <b>doanh số</b> (cách chia quỹ), hoặc khoản Thưởng KPI đang tắt.</li></ul>
  <h3>4. Thưởng theo doanh số thực đạt (nhân viên kinh doanh)</h3>
  <ul><li>Tab <b>Thưởng doanh số</b>: nhập <b>doanh số thực tế đạt</b> của từng nhân viên trong tháng (hoặc nhập từ Excel theo file mẫu). Tiền thưởng tự vào bảng lương ở cột <b>Thưởng doanh số (NV kinh doanh)</b>, phiếu lương ghi rõ doanh số × tỷ lệ.</li>
   <li>Cấu hình cách tính: <b>một tỷ lệ</b> (VD 1% doanh số); <b>bậc thang</b> — đạt bậc nào áp tỷ lệ bậc đó cho toàn bộ doanh số (VD từ 500 triệu: 2%); hoặc <b>lũy tiến từng phần</b> — mỗi phần doanh số tính theo tỷ lệ của bậc. Có thể đặt <b>doanh số tối thiểu</b> mới được thưởng.</li>
   <li>Người có thỏa thuận riêng: nhập <b>tỷ lệ riêng</b> ở cột bên cạnh (bỏ qua bậc thang).</li>
   <li>Thưởng doanh số và thưởng KPI độc lập — dùng một hoặc cả hai. Muốn thêm loại thưởng doanh số khác (VD hoa hồng dịch vụ), thêm khoản mới ở Phụ cấp &amp; khấu trừ với cách tính “Theo doanh số thực đạt × tỷ lệ”.</li></ul>`},
 {id:'chamcong',ten:'Chấm công',html:`
  <h3>Ký hiệu chấm công</h3>
  <p>Mặc định: <b>X</b> đủ công (1), <b>N</b> nửa ngày (0,5), <b>P</b> phép có lương (1), <b>L</b> lễ, Tết (1), <b>KL</b> không lương (0) — giống file Excel; thêm sẵn <b>CT</b> công tác, <b>NB</b> nghỉ bù, <b>OM</b> ốm (BHXH trả), <b>TS</b> thai sản.
   Tab <b>Ký hiệu &amp; ghi chú</b> để thêm / sửa: mỗi ký hiệu có <i>công tính lương</i> (cộng vào Ngày công) và <i>công đi làm</i> (dùng cho phụ cấp theo ngày đi làm), màu, ghi chú. Phần ghi chú hiện dưới bảng chấm công và in ra khi xuất Excel.</p>
  <h3>Bảng chấm công tháng</h3>
  <ul><li>Chọn ký hiệu trên thanh <b>Ký hiệu</b> rồi bấm hoặc <b>kéo chuột</b> qua các ô; nút ⌫ để xóa.</li>
   <li>Hoặc bấm vào một ô rồi <b>gõ mã</b> (X, N, P, KL, CT…), con trỏ tự sang ô kế tiếp; Delete để xóa; phím mũi tên để di chuyển.</li>
   <li>Cột Chủ nhật (và thứ Bảy nếu cấu hình nghỉ) tô xám. Ngày công vượt công chuẩn hiện màu đỏ.</li>
   <li>Các cột cuối: <b>giờ tăng ca</b> ngày thường / ngày nghỉ / lễ (tổng giờ cả tháng), <b>tạm ứng</b> và <b>Ghi chú</b> của từng người. Nhân viên đã có <b>Bảng chấm công làm thêm giờ</b> theo ngày thì ô giờ TC chuyển màu xám, tự lấy tổng từ bảng đó.</li>
   <li>Dưới bảng có ô <b>Ghi chú bảng chấm công tháng</b> để ghi lại các lưu ý (mất điện, nghỉ theo quyết định…). Ghi chú được in kèm (<b>In bảng chấm công</b>, mẫu 01a-LĐTL) và xuất ra Excel.</li></ul>
  <h3>Chấm hàng loạt (cuối tháng mới chấm)</h3>
  <ol><li>Tích ô cạnh <b>Mã NV</b> những người cần chấm (không tích ai = áp cho tất cả đang hiển thị; ô ở tiêu đề để chọn tất cả).</li>
   <li>Ở dải <b>Chấm hàng loạt</b>: chọn ký hiệu, từ ngày – đến ngày, tùy chọn bỏ qua ngày nghỉ hằng tuần và chỉ điền ô còn trống → <b>Áp dụng</b>.</li>
   <li>Sau đó sửa riêng các ngày nghỉ phép, nửa ngày… trực tiếp trên bảng.</li></ol>
  <p>Mẹo: bấm vào <b>số ngày</b> ở tiêu đề cột để chấm cả ngày đó (ví dụ ngày lễ) cho những người đang tích, bằng ký hiệu đang chọn.</p>
  <h3>Các cách nhập khác</h3>
  <ul><li><b>Nhập theo ngày</b>: chọn một ngày, chấm cho từng người — hợp khi theo dõi hằng ngày.</li>
   <li><b>Nhập nhiều dòng</b>: dán từ Excel, mỗi dòng <code>Mã NV; Ngày hoặc khoảng ngày; Ký hiệu</code>, ví dụ <code>NV02; 05/10/2026-09/10/2026; P</code>. Mã <code>*</code> = tất cả nhân viên; khoảng ngày bỏ qua ngày nghỉ hằng tuần. Bấm <b>Kiểm tra</b> trước khi <b>Ghi</b>.</li>
   <li><b>Nhập từ file chấm công</b>: xem phần riêng bên dưới.</li></ul>`},
 {id:'tangca',ten:'Tăng ca / làm thêm giờ',html:`
  <p>Mục <b>Tăng ca / làm thêm</b> là bảng chấm công làm thêm giờ riêng (giống bảng chấm công): mỗi nhân viên một dòng, mỗi ngày một ô, ghi <b>số giờ làm thêm</b> của ngày đó — biết rõ ai làm thêm bao nhiêu giờ, vào những ngày nào.</p>
  <ul><li>Gõ số giờ vào ô (VD <code>2</code> hoặc <code>1,5</code>), Enter / mũi tên để di chuyển, xóa số để bỏ.</li>
   <li>Phần mềm tự chia giờ theo <b>loại ngày</b>: ngày thường (×1,5), ngày nghỉ hằng tuần — cột xám (×2), ngày lễ, Tết — cột tím (×3); hệ số lấy theo Cấu hình. Tổng giờ từng loại tự chuyển sang bảng lương để tính tiền tăng ca.</li>
   <li><b>Ngày lễ</b>: mặc định 1/1, 30/4, 1/5, 2/9. Tết âm lịch, Giỗ Tổ, ngày nghỉ bù… bấm vào <b>số ngày</b> ở tiêu đề để đánh dấu (bấm lần nữa để bỏ). Ngày nhân viên chấm ký hiệu L cũng tính là ngày lễ.</li>
   <li><b>Điền hàng loạt</b>: số giờ, từ ngày – đến ngày, chỉ vào ngày thường / ngày nghỉ / ngày lễ hoặc mọi ngày, cho những người đã tích (không tích = tất cả).</li>
   <li>Cột <b>Nội dung / ghi chú</b> từng người và ô <b>Ghi chú bảng làm thêm giờ</b> của tháng (lý do làm thêm, văn bản đồng ý của người lao động, quyết định của giám đốc).</li>
   <li><b>In bảng tăng ca</b> (mẫu 01b-LĐTL, A4 ngang, có cột ký nhận và chỗ ký duyệt), <b>Xuất Excel</b>, <b>Nhập từ Excel</b> (theo <b>file mẫu</b>: Mã NV × cột ngày 1–31, ô ghi số giờ).</li></ul>
  <h3>Cảnh báo giới hạn giờ làm thêm</h3>
  <p>Theo Bộ luật Lao động 2019 (Điều 107) và Nghị định 145/2020: không quá 50% giờ làm bình thường trong ngày (4 giờ với ngày làm 8 giờ), tổng giờ làm không quá 12 giờ/ngày; không quá 40 giờ/tháng; không quá 200 giờ/năm (300 giờ với một số ngành, nghề). Ô vượt giới hạn ngày tô đỏ; tổng tháng vượt 40 giờ hoặc cả năm vượt 200 giờ có dấu ⚠ ở cột Tổng giờ.</p>
  <div class="hdnote">Nhân viên đã có giờ theo ngày: giờ TC ở Bảng chấm công và Tổng hợp công chỉ còn để xem. Nhân viên chưa có thì vẫn nhập tổng giờ tháng như trước (nhãn “tổng tháng” trên bảng tăng ca); khi nhập giờ theo ngày, số tổng cũ được thay bằng tổng từ bảng ngày. Nút <b>Xóa tăng ca tháng</b> xóa cả hai.</div>`},
 {id:'nhapfilecc',ten:'Nhập file chấm công / máy chấm công',html:`
  <p>Chấm công → <b>Nhập từ file chấm công</b> → <b>Chọn file</b> (Excel .xlsx hoặc CSV). Phần mềm tự nhận dạng 5 kiểu:</p>
  <ol><li><b>Bảng lưới tháng</b>: Mã NV × cột ngày 1–31, mỗi ô một ký hiệu; ghi Năm, Tháng ở phía trên bảng.</li>
   <li><b>Từng dòng</b>: Mã NV – Ngày – Ký hiệu.</li>
   <li><b>Giờ vào / giờ ra</b> theo ngày.</li>
   <li><b>Dữ liệu thô máy chấm công</b>: Mã NV – Thời gian quẹt (mỗi lần quẹt một dòng); lấy lần quẹt đầu tiên và cuối cùng trong ngày.</li>
   <li><b>Tổng hợp tháng</b>: Năm – Tháng – Mã NV – Giờ TC – Tạm ứng.</li></ol>
  <h3>Quy đổi giờ thành ký hiệu (khung bên phải)</h3>
  <ul><li>Giờ làm = giờ ra − giờ vào − nghỉ trưa (khi ca dài hơn 5 giờ). Đủ <b>7 giờ → X</b>, đủ <b>3,5 giờ → N</b> (sửa được).</li>
   <li>Ngày chỉ quẹt 1 lần: để trống (chấm tay) hoặc chấm N / X.</li>
   <li>Tùy chọn cộng phần làm vượt số giờ chuẩn vào giờ TC thường (làm tròn xuống 0,5 giờ).</li>
   <li><b>Ghi đè ô đã chấm</b>: bỏ chọn thì chỉ điền ô còn trống.</li></ul>
  <p>Trước khi ghi, phần mềm hiện bảng xem trước: số ô theo ký hiệu của từng người, mã NV không có trong phần mềm, ký hiệu lạ, ngày thiếu lần quẹt. Bấm <b>Ghi vào bảng chấm công</b> để ghi.</p>
  <div class="hdnote">Mã NV trong file phải trùng mã trong phần mềm (nếu file không có mã, phần mềm khớp theo họ tên). File máy chấm công thường đặt tên cột “Mã NV / Mã nhân viên / Mã chấm công”, “Ngày”, “Giờ vào”, “Giờ ra” hoặc “Thời gian” — đều nhận được. Nút <b>Tải file mẫu chấm công</b> có đủ các kiểu mẫu.</div>`},
 {id:'tonghop',ten:'Tổng hợp công',html:`
  <ul><li>Mỗi nhân viên một dòng: số ngày theo từng ký hiệu, <b>Ngày công</b> (tổng “công tính lương”), công chuẩn, giờ tăng ca, tạm ứng.</li>
   <li>Sửa trực tiếp giờ tăng ca và tạm ứng tại đây (giống ở bảng chấm công).</li>
   <li>Cột Ghi chú cảnh báo người <b>chưa chấm công</b> hoặc <b>vượt công chuẩn</b>. Nút <b>Xuất Excel</b> ra bảng tổng hợp.</li></ul>`},
 {id:'bangluong',ten:'Bảng lương',html:`
  <p>Bảng lương tự tính cho kỳ đang chọn. Cột hiện theo thứ tự như phiếu lương: lương cơ bản → phụ cấp theo ngày công (định mức) → ngày công → lương theo ngày công → từng phụ cấp khác → tăng ca → tổng thu nhập → BHXH, BHYT, BHTN → giảm trừ → thu nhập miễn thuế → thu nhập tính thuế → thuế → tạm ứng → từng khoản khấu trừ → <b>thực lĩnh</b>. Khoản không phát sinh trong kỳ được ẩn.</p>
  <h3>Cách tính mặc định (giống file Excel)</h3>
  <ul><li>Lương theo ngày công = ROUND((Lương CB + Phụ cấp theo ngày công) ÷ Công chuẩn × Ngày công, 0)</li>
   <li>Tiền tăng ca = ROUND(Lương CB ÷ Công chuẩn ÷ 8 × Giờ TC × hệ số, 0)</li>
   <li>BHXH, BHYT = ROUND(MIN(Lương đóng BH, trần 20 × lương cơ sở) × tỷ lệ, 0); BHTN dùng trần 20 × lương tối thiểu vùng; không đóng khi ngày công = 0.</li>
   <li>Thu nhập tính thuế = ROUND(MAX(0, Tổng TN − BH − Giảm trừ gia cảnh − Thu nhập miễn thuế), 0); thuế theo biểu lũy tiến.</li>
   <li>Thực lĩnh = Tổng TN − BH − Thuế − Tạm ứng − Các khoản khấu trừ.</li></ul>
  <ul><li>Nút <b>⊕ Thêm / bớt cột</b>: thêm nhanh cột <b>phụ cấp</b> (chức vụ, thâm niên, độc hại, khu vực, nhà ở…), <b>thưởng</b> (lễ Tết, tháng 13, hoàn thành công việc, sáng kiến…), <b>phúc lợi</b> (hiếu hỷ, quà sinh nhật, du lịch nghỉ mát, học phí con, khám chữa bệnh, trang phục) và <b>khấu trừ</b>; mỗi khoản mẫu có sẵn cách tính thuế gợi ý và có tính vào lương đóng BH hay không. Bỏ tích để ẩn cột. Cột sắp theo nhóm phụ cấp → thưởng → phúc lợi (màu tiêu đề khác nhau).</li>
   <li>Khoản “nhập tiền từng tháng” (thưởng, phúc lợi…) <b>gõ số tiền thẳng trên bảng lương</b>, Enter để xuống người tiếp theo. Khoản theo đơn giá ngày (ăn ca…) hiện “số ngày × đơn giá” ngay dưới số tiền; Excel bảng lương có thêm cột số ngày.</li>
   <li>Cột <b>Ghi chú</b> cuối bảng: gõ lưu ý cho từng người (thưởng theo quyết định số…, truy lĩnh, tạm hoãn BH…). Ô <b>Ghi chú bảng thanh toán lương</b> dưới bảng dành cho lưu ý chung của tháng. Cả hai được in kèm bảng lương, xuất ra Excel; ghi chú của người nào hiện trên phiếu lương (và email phiếu lương) của người đó — làm cơ sở giải trình khi cơ quan thuế, BHXH, kiểm toán hỏi lại.</li>
   <li>Biểu tượng <b>⚠</b> cạnh mã NV: rê chuột để xem cảnh báo (vượt công chuẩn, thiếu lương đóng BH, thực lĩnh âm…).</li>
   <li>Tích <b>Hiện phần doanh nghiệp đóng</b> để xem BH, KPCĐ phía DN và tổng chi phí lương.</li>
   <li><b>Xuất Excel</b>, <b>In bảng lương</b> (khổ A4 ngang, có chỗ ký). Bấm một dòng để mở phiếu lương của người đó.</li></ul>`},
 {id:'phieuluong',ten:'Phiếu lương',html:`
  <ul><li>Chọn nhân viên, hoặc <b>Tất cả nhân viên</b> để in hàng loạt (2 phiếu / trang A4).</li>
   <li>Phiếu có đủ thu nhập, từng khoản phụ cấp, các khoản khấu trừ, thông tin thuế, thực lĩnh bằng số và bằng chữ, chỗ ký.</li>
   <li>Khi in, chọn máy in hoặc <b>Lưu dưới dạng PDF</b>.</li></ul>
  <h3>Gửi phiếu lương qua email</h3>
  <p>Nhập <b>email nhận phiếu lương</b> trong hồ sơ nhân viên (hoặc cột Email của file mẫu, hoặc điền ngay trong hộp gửi). Bấm <b>✉ Gửi email phiếu này</b> (một người) hoặc <b>✉ Gửi email hàng loạt</b> (cả kỳ). Chọn một trong ba cách gửi:</p>
  <ul><li><b>Ứng dụng email trên máy</b> (Outlook, Thunderbird, Mail…): phần mềm mở sẵn thư cho từng người — bấm Gửi trong ứng dụng. Bấm <b>Mở thư tiếp theo</b> để đi lần lượt từng người.</li>
   <li><b>Gmail trên trình duyệt</b>: mở thẻ Gmail soạn sẵn cho từng người.</li>
   <li><b>Gửi tự động qua Gmail công ty</b>: gửi cả danh sách một lần bấm; thư có bảng phiếu lương và <b>đính kèm PDF</b>. Cài đặt một lần: mở script.google.com bằng Gmail dùng để gửi → Dự án mới → dán mã có sẵn trong hộp gửi → Triển khai dạng <b>Ứng dụng web</b> (Thực thi: Tôi; Truy cập: Bất kỳ ai) → dán URL /exec vào phần mềm → <b>Gửi thử</b>.</li></ul>
  <p>Tiêu đề, lời chào, chữ ký sửa được; dùng {ten} {ma} {thang} {nam} {congTy} {thucLinh} để tự điền. Cột Trạng thái ghi lại người đã gửi / đã mở thư trong kỳ.</p>
  <div class="hdnote">Hai cách đầu chỉ gửi nội dung dạng văn bản (không đính kèm được). Gmail tự động có giới hạn của Google: khoảng 100 thư/ngày với Gmail cá nhân, 1.500 thư/ngày với Google Workspace. Mã bí mật trong đoạn mã giúp chỉ phần mềm của anh/chị gửi được qua địa chỉ này — không chia sẻ URL và mã cho người khác.</div>`},
 {id:'thue',ten:'Thuế TNCN',html:`
  <h3>Lương tháng này, tháng sau mới trả</h3>
  <p>Thuế TNCN khấu trừ <b>khi trả lương</b> và kê khai vào tháng / quý / năm <b>trả thu nhập</b> (Điều 8 TT 111/2013/TT-BTC). Ví dụ lương tháng 9 tính thuế trên bảng lương tháng 9, nhưng tháng 10 mới trả → thuế khấu trừ và kê khai vào tháng 10 (quý 4).</p>
  <ul><li>Cài chung: <b>Cấu hình → Thời điểm trả lương</b> = “Trả vào tháng sau”.</li>
   <li>Cài riêng từng tháng: <b>Bảng lương → Ngày chi trả lương</b> (VD 05/10/2026). Phần mềm hiện “Kỳ khấu trừ &amp; kê khai thuế TNCN: tháng 10/2026”; phiếu lương ghi ngày chi trả.</li>
   <li>Bảng kê, số liệu tờ khai 05/KK, file XML và quyết toán năm đều lấy theo tháng chi trả; đầu bảng kê ghi rõ kỳ đó gồm bảng lương tháng nào. Lương tháng 12 trả vào tháng 1 năm sau thì thuộc quyết toán năm sau.</li>
   <li>Nút <b>Bút toán hạch toán</b> trên bảng lương: cuối tháng lương ghi Nợ 622/627/641/642 – Có 334 và các khoản BH; khi chi trả ghi Nợ 334 – Có 3335 (thuế TNCN), 141 (tạm ứng), 111/112 (thực trả). Xuất Excel được.</li></ul>
  <h3>Bảng kê khấu trừ & tờ khai</h3>
  <p>Chọn kỳ theo tháng / quý / năm. Bảng từng người: tổng thu nhập, thu nhập miễn thuế, thu nhập chịu thuế, BH, giảm trừ, thu nhập tính thuế, thuế đã khấu trừ. Khung bên phải tổng hợp <b>số liệu lập tờ khai khấu trừ</b> (số người, thu nhập chịu thuế, thuế — tách cư trú / không cư trú).</p>
  <h3>Quyết toán năm (quyết toán thay)</h3>
  <ul><li>Tính lại thuế cả năm theo biểu lũy tiến tháng × 12, so với số đã khấu trừ → <b>nộp thêm</b> hoặc <b>nộp thừa</b> của từng người.</li>
   <li>Tùy chọn giảm trừ bản thân đủ 12 tháng; sửa “NPT × tháng” cho người có thay đổi người phụ thuộc trong năm; bỏ chọn người không ủy quyền quyết toán.</li>
   <li>Bấm mã NV để xem diễn giải cách tính từng bậc. Xuất Excel bảng quyết toán.</li></ul>
  <h3>Tính nhanh Gross ⇄ Net</h3>
  <p>Biết lương gộp tính ra thực nhận, hoặc ngược lại (dùng khi thỏa thuận lương Net), có diễn giải BH và thuế từng bậc.</p>
  <h3>Xuất XML tờ khai</h3>
  <ol><li>Chọn <b>file mẫu</b>: có sẵn <b>05/KK-TNCN</b> (khấu trừ thuế theo quý / tháng), <b>05/QTT-TNCN</b> (quyết toán năm) và 06/TNCN; có thể <b>tải lên file XML mẫu</b> xuất từ HTKK cho tờ khai khác.</li>
   <li>Chọn kỳ / năm, loại tờ khai (chính thức / bổ sung lần…), ngày lập, người ký.</li>
   <li>Điền <b>Thông tin người nộp thuế</b>: tên, MST bắt buộc; mã tỉnh, mã phường/xã, mã cơ quan thuế lấy theo HTKK. Thông tin được lưu cho các lần sau.</li>
   <li>Kiểm tra bảng chỉ tiêu (mỗi chỉ tiêu chọn được nguồn số liệu) → <b>Xuất file XML</b> → nộp qua eTax / Thuế điện tử.</li></ol>
  <div class="hdwarn">Tờ khai 05/QTT-TNCN phải nộp kèm bảng kê 05-1/BK (và 05-2/BK nếu có); file XML hiện chỉ có tờ khai chính. Mẫu 06/TNCN không dùng cho tiền lương, tiền công. Luôn đối chiếu số liệu trước khi nộp.</div>`},
 {id:'baohiem',ten:'Bảo hiểm',html:`
  <ul><li><b>Bảng tính BH tháng</b>: lương đóng BH, phần NLĐ đóng (BHXH, BHYT, BHTN), phần DN đóng (BHXH gộp 3 quỹ — rê chuột vào ô để xem chi tiết; BHYT; BHTN), tổng phải nộp cơ quan BHXH, KPCĐ. Cảnh báo người có lương đóng BH thấp hơn lương tối thiểu vùng.</li>
   <li><b>Biến động tăng / giảm</b>: so với tháng trước — người tăng mới, người giảm (nghỉ, không có công…), người đổi mức đóng — để làm hồ sơ báo tăng / giảm.</li>
   <li><b>Tổng hợp năm</b>: số phải nộp từng tháng; file Excel kèm chi tiết từng tháng.</li></ul>
  <h3>Chỉnh BH riêng từng tháng</h3>
  <ul><li>Cột <b>Đóng BH tháng này</b>: <i>Tự động</i> (đóng khi có ngày công) · <i>Có đóng</i> · <i>Không đóng</i>. Dùng cho người mới vào cuối tháng chưa đóng, người nghỉ giữa tháng, truy đóng…</li>
   <li>Ô <b>Lương đóng BH tháng này</b>: nhập mức riêng của tháng (VD tăng lương từ tháng này); để trống = theo hồ sơ nhân viên. Các tháng khác không bị ảnh hưởng.</li>
   <li>Chỉnh ở đây tự cập nhật bảng lương, phiếu lương, biến động tăng / giảm và tờ khai.</li></ul>
  <h3>Người không nhận lương nhưng đóng BH</h3>
  <p>Ví dụ chủ sở hữu Công ty TNHH 1 thành viên: trong hồ sơ nhân viên tích <b>Không nhận lương – chỉ đóng BH</b>, nhập lương đóng BH. Người này luôn được tính BH (kể cả không chấm công), phần NLĐ đóng vẫn có trong bảng BH để nộp nhưng <b>không trừ vào lương</b> — thực lĩnh không bị âm; phiếu lương ghi rõ “BH tự nộp”.</p>
  <div class="hdnote">Lương đóng BH trong hồ sơ nhân viên áp dụng cho mọi tháng chưa nhập mức riêng. Khi tăng lương, nên nhập mức mới ở ô “Lương đóng BH tháng này” cho các tháng mới, hoặc xuất Excel các tháng đã chốt trước khi sửa hồ sơ.</div>`},
 {id:'congthuc',ten:'Công thức lương (nâng cao)',html:`
  <p>Mặc định phần mềm tính đúng như file Excel. Mục <b>Công thức lương</b> cho phép sửa 14 bước tính, viết như công thức Excel:</p>
  <ul><li>Phép tính <code>+ − * / ^ ( )</code>, so sánh <code>= &lt;&gt; &lt; &gt; &lt;= &gt;=</code>, phần trăm <code>8%</code>; hàm <code>IF, MIN, MAX, ROUND, ROUNDUP, ROUNDDOWN, INT, ABS, AND, OR, NOT, THUE_LUY_TIEN</code>.</li>
   <li>Ngăn cách đối số bằng dấu phẩy hoặc chấm phẩy; số thập phân dùng dấu chấm (1.5); <b>viết số liền, không dấu chấm phân cách nghìn</b> (730000).</li>
   <li>Tên biến không dấu; bấm tên biến ở cột phải để chèn. Mỗi bước chỉ dùng được kết quả của các bước phía trên.</li>
   <li>Chọn một nhân viên để <b>xem thử</b> kết quả ngay khi gõ, so với công thức mặc định. Công thức lỗi sẽ không lưu được.</li>
   <li>Có sẵn ví dụ: công chuẩn cố định 26 ngày, đủ công hưởng nguyên lương, đóng BH trên lương + phụ cấp, làm tròn thực lĩnh đến nghìn…</li></ul>
  <div class="hdwarn">Khi dùng công thức tùy chỉnh, bảng lương hiện cảnh báo “khác cách tính file Excel gốc”. Nút <b>Đưa tất cả về mặc định</b> để quay lại.</div>`},
 {id:'dulieu',ten:'Nhập / Xuất dữ liệu & file mẫu',html:`
  <ul><li><b>Tải file mẫu nhập liệu</b>: file Excel gồm các sheet HuongDan, NhanVien, ChamCongThang (lưới), ChamCong (từng dòng), MayChamCong (giờ vào/ra), TongHopCong, PhuCapThang, KyHieu. Giữ nguyên tên sheet và dòng tiêu đề; dòng mã “VD01” là ví dụ, tự bỏ qua.</li>
   <li><b>Chọn file Excel</b>: đọc được file mẫu nhập liệu, file Excel gốc <i>ChamCong_TinhLuong_2026.xlsx</i>, file do phần mềm xuất ra, và file CSV từ máy chấm công. Phần mềm báo trước sẽ nhập những gì.
     <ul><li><b>Gộp</b>: thêm / cập nhật nhân viên theo mã, ghi đè các ngày có trong file.</li><li><b>Thay thế toàn bộ</b>: xóa nhân viên và chấm công hiện có rồi nạp file.</li><li>File không có danh sách nhân viên luôn được gộp.</li></ul></li>
   <li><b>Xuất toàn bộ ra Excel</b>: cấu hình, biểu thuế, danh mục khoản, công thức, nhân viên, chấm công, phụ cấp tháng, ký hiệu, tổng hợp công, bảng chấm công và bảng lương kỳ đang chọn — nhập lại được.</li>
   <li><b>Sao lưu / Khôi phục JSON</b>: xem phần Lưu dữ liệu & sao lưu.</li>
   <li><b>Xóa toàn bộ dữ liệu</b>: làm lại từ đầu (nên sao lưu trước).</li></ul>
  <div class="hdnote">File Excel đời cũ (.xls) hãy mở bằng Excel rồi “Lưu thành” .xlsx trước khi nhập.</div>`},
 {id:'kiemtra',ten:'Kiểm tra công thức',html:`
  <p>Bấm <b>Chạy kiểm tra</b> để phần mềm tự tính lại 5 nhân viên mẫu (tháng 10/2026) và so từng con số với kết quả do chính file Excel gốc tính — kết quả đúng là <b>60/60 khớp</b>. Không ảnh hưởng dữ liệu đang dùng. Nếu đang dùng công thức tùy chỉnh, màn hình cho biết thêm mức chênh do tùy chỉnh.</p>`},
 {id:'hoidap',ten:'Câu hỏi thường gặp',html:`
  <dl class="hdfaq">
   <dt>Mở lại phần mềm thấy mất hết dữ liệu?</dt><dd>Có thể đã mở bằng trình duyệt khác, chế độ ẩn danh, file ở vị trí khác, hoặc đã xóa dữ liệu duyệt web. Mở đúng trình duyệt / đúng file cũ, hoặc <b>Khôi phục từ file JSON</b> gần nhất.</dd>
   <dt>Góc trên báo “Chưa lưu được”?</dt><dd>Trình duyệt chặn lưu trữ hoặc bộ nhớ đầy. Sao lưu JSON ngay, kiểm tra trình duyệt không ở chế độ ẩn danh.</dd>
   <dt>Ngày công của nhân viên khác so với tôi tính?</dt><dd>Ngày công = tổng “công tính lương” của các ký hiệu. Kiểm tra tab Ký hiệu &amp; ghi chú (ví dụ N = 0,5, OM = 0).</dd>
   <dt>Tại sao thuế bằng 0 dù lương cao?</dt><dd>Kiểm tra số người phụ thuộc, BH, thu nhập miễn thuế (tăng ca, phụ cấp miễn thuế). Xem chi tiết ở phiếu lương phần III.</dd>
   <dt>Nhập file chấm công báo “không tìm thấy mã NV”?</dt><dd>Mã trong file phải trùng Mã NV trong phần mềm (kể cả chữ hoa / thường, số 0 ở đầu). Sửa mã trong file hoặc trong hồ sơ nhân viên rồi nhập lại.</dd>
   <dt>Phụ cấp ăn ca tính theo tháng hay theo ngày?</dt><dd>Hai cách: <i>Theo ngày đi làm thực tế</i> (định mức tháng, VD 730.000 ÷ công chuẩn × ngày đi làm) hoặc <i>Đơn giá theo ngày × số ngày</i> (VD 30.000 đ × ngày đi làm thực tế). Chọn ở Phụ cấp &amp; khấu trừ → Sửa khoản → Cách tính. Cả hai đều không tính ngày phép, lễ, nghỉ.</dd>
   <dt>Đã chấm điểm KPI mà bảng lương không có tiền KPI?</dt><dd>Xem dòng cảnh báo vàng ở màn hình Lương KPI: thường do chưa nhập Mức KPI / tháng cho nhân viên (cách “mức riêng”), chưa nhập quỹ hoặc doanh số (cách “chia quỹ”), hoặc khoản Thưởng KPI đang tắt. Kiểm tra cả kỳ lương đang chọn ở góc trên.</dd>
   <dt>File CSV bị lỗi font tiếng Việt?</dt><dd>Lưu lại CSV với mã hóa UTF-8 (Excel: Lưu thành → “CSV UTF-8”).</dd>
   <dt>Bấm “Mở thư” mà không thấy gì?</dt><dd>Máy chưa đặt ứng dụng email mặc định. Chọn cách “Gmail trên trình duyệt”, hoặc đặt Outlook / Mail làm ứng dụng email mặc định trong cài đặt Windows / macOS.</dd>
   <dt>Gửi tự động báo “Không kết nối được Apps Script”?</dt><dd>Kiểm tra Internet; URL phải kết thúc bằng /exec; lúc triển khai chọn quyền truy cập “Bất kỳ ai”. Nếu báo “Sai mã bí mật”, dán lại đoạn mã mới từ phần mềm vào Apps Script rồi triển khai lại (Quản lý triển khai → Chỉnh sửa → Phiên bản mới).</dd>
   <dt>Nút “Xuất file XML” bị mờ?</dt><dd>Chưa điền tên người nộp thuế hoặc mã số thuế chưa đúng 10 số (hoặc 10 số + 3 số đơn vị phụ thuộc).</dd>
   <dt>Nhà nước thay đổi lương cơ sở / lương tối thiểu vùng / giảm trừ?</dt><dd>Sửa ở Cấu hình. Xuất Excel / in các tháng đã chốt trước khi sửa vì tham số áp dụng cho mọi kỳ.</dd>
   <dt>Dùng cho nhiều công ty được không?</dt><dd>Mỗi bộ dữ liệu gắn với một trình duyệt. Có thể dùng mỗi công ty một trình duyệt (hoặc một hồ sơ trình duyệt), hoặc sao lưu JSON riêng từng công ty rồi khôi phục khi cần làm.</dd>
  </dl>`}];
const HD_VIEW={tongquan:'batdau',nhanvien:'nhanvien',phucap:'phucap',kpi:'kpi',chamcong:'chamcong',tangca:'tangca',tonghop:'tonghop',bangluong:'bangluong',phieuluong:'phieuluong',thue:'thue',baohiem:'baohiem',cauhinh:'cauhinh',congthuc:'congthuc',dulieu:'dulieu',kiemtra:'kiemtra'};
function moHuongDan(id){UI.hdSec=id||'batdau';UI.hdQ='';go('huongdan');}
function vHuongDan(){
  const q=norm(UI.hdQ||''),txt=h=>norm(h.ten+' '+h.html.replace(/<[^>]+>/g,' '));
  const list=q?HD.filter(h=>txt(h).includes(q)):HD;
  if(!list.some(h=>h.id===UI.hdSec))UI.hdSec=list[0]?list[0].id:'batdau';
  const cur=HD.find(h=>h.id===UI.hdSec),i=HD.indexOf(cur);
  $('#view').innerHTML=`<div class="hdwrap"><aside class="hdtoc card">
    <input class="f" id="hdQ" placeholder="Tìm trong hướng dẫn…" value="${esc(UI.hdQ||'')}" style="width:100%;margin-bottom:8px">
    ${list.length?list.map((h,k)=>`<a href="#" data-hd="${h.id}" class="${h.id===UI.hdSec?'on':''}">${HD.indexOf(h)+1}. ${h.ten}</a>`).join(''):'<p class="small muted">Không tìm thấy nội dung phù hợp.</p>'}
    <button class="btn sm" id="hdPrint" style="margin-top:10px;width:100%">In toàn bộ hướng dẫn</button></aside>
  <article class="card hd" id="hdBody">${cur?`<h2>${i+1}. ${cur.ten}</h2>${cur.html}
    <div class="hdnav">${i>0?`<a href="#" data-hd="${HD[i-1].id}">← ${HD[i-1].ten}</a>`:'<span></span>'}${Object.keys(HD_VIEW).find(v=>HD_VIEW[v]===cur.id)?`<button class="btn sm pri" id="hdGo">Mở màn hình ${esc(TITLES[Object.keys(HD_VIEW).find(v=>HD_VIEW[v]===cur.id)])}</button>`:''}${i<HD.length-1?`<a href="#" data-hd="${HD[i+1].id}">${HD[i+1].ten} →</a>`:'<span></span>'}</div>`:''}</article></div>`;
  $('#hdQ').oninput=e=>{UI.hdQ=e.target.value;const p=e.target.selectionStart;vHuongDan();const el=$('#hdQ');el.focus();el.setSelectionRange(p,p);};
  $$('[data-hd]').forEach(a=>a.onclick=e=>{e.preventDefault();UI.hdSec=a.dataset.hd;vHuongDan();$('#view').scrollIntoView?window.scrollTo(0,0):0;});
  const g=$('#hdGo');if(g)g.onclick=()=>go(Object.keys(HD_VIEW).find(v=>HD_VIEW[v]===cur.id));
  $('#hdPrint').onclick=()=>{setPage('A4 portrait');$('#print').innerHTML=`<div class="hd hdprint"><h1>HƯỚNG DẪN SỬ DỤNG PHẦN MỀM CHẤM CÔNG &amp; TÍNH LƯƠNG</h1>${DB.cfg.donViCungCap?`<p>Cung cấp bởi ${esc(DB.cfg.donViCungCap)}</p>`:''}${HD.map((h,k)=>`<section><h2>${k+1}. ${h.ten}</h2>${h.html}</section>`).join('')}</div>`;window.print();};
}

const EMAIL_DEF={cach:'mailto',url:'',khoa:'',tieuDe:'Phiếu lương tháng {thang}/{nam} – {ten}',
  loiChao:'Kính gửi anh/chị {ten},\n\n{congTy} gửi anh/chị phiếu lương tháng {thang}/{nam}. Nếu có thắc mắc, anh/chị vui lòng phản hồi email này.',
  ky:'Trân trọng,\n{congTy}',pdf:true,tenGui:'',thuThu:''};
function emCfg(){DB.email=Object.assign({},EMAIL_DEF,DB.email||{});if(!DB.email.khoa)DB.email.khoa=(Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,10)).toUpperCase();return DB.email;}
const emailOK=e=>/^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+$/.test(String(e||'').trim());
const nvEmail=ma=>String((DB.nv.find(n=>n.ma===ma)||{}).email||'').trim();
function emFill(t,r,y,m){return String(t||'').replace(/\{(\w+)\}/g,(a,k)=>{const v={ten:r.ten,ma:r.ma,thang:m,nam:y,congTy:DB.cfg.congTy||'Công ty',thucLinh:fmt(r.thucLinh)}[k];return v==null?a:v;});}
function slipText(r,y,m){
  const L=[],row=(a,b)=>L.push('  '+a+': '+b),thu=r.items.thu;
  L.push('PHIẾU LƯƠNG THÁNG '+m+'/'+y+(DB.cfg.congTy?' – '+DB.cfg.congTy:''),'Họ và tên: '+r.ten+' ('+r.ma+')'+(r.boPhan?' – '+r.boPhan:''),'Ngày công: '+fmt(r.ngayCong)+' / '+r.congChuan+' công chuẩn','','I. THU NHẬP');
  row('Lương cơ bản',fmt(r.luongCB));thu.filter(i=>i.cach==='ngaycong').forEach(i=>row(i.ten+' (định mức)',fmt(i.dm)));
  row('Lương theo ngày công',fmt(r.luongNC));thu.filter(i=>i.cach!=='ngaycong').forEach(i=>row(i.ten+nhanKhoan(i,r),fmt(i.amt)));
  if(r.tienTC)row('Tiền tăng ca ('+fmt(r.gioTC)+' giờ)',fmt(r.tienTC));row('Tổng thu nhập',fmt(r.tongTN));
  L.push('','II. KHẤU TRỪ');row('BHXH',fmt(r.bhxh));row('BHYT',fmt(r.bhyt));row('BHTN',fmt(r.bhtn));row('Thuế TNCN',fmt(r.thue));
  if(r.tamUng)row('Tạm ứng',fmt(r.tamUng));r.items.tru.forEach(i=>row(i.ten,fmt(i.amt)));
  row('Tổng khấu trừ',fmt(r.bhTru+r.thue+r.tamUng+r.khauTruKhac));
  L.push('','THỰC LĨNH: '+fmt(r.thucLinh)+' đồng','Bằng chữ: '+docSo(r.thucLinh)+'.');if(r.gcBL)L.push('Ghi chú: '+r.gcBL);
  return L.join('\n');
}
function slipEmailHTML(r,y,m){
  const cfg=DB.cfg,B='border:1px solid #d5d9e0;padding:6px 10px;font-size:14px',N=B+';text-align:right;white-space:nowrap';
  const row=(a,b,x)=>`<tr><td style="${B}${x||''}">${a}</td><td style="${N}${x||''}">${b}</td></tr>`,sec=t=>`<tr><td colspan="2" style="${B};background:#eef1f5;font-weight:bold">${t}</td></tr>`;
  const thu=r.items.thu,tc=thu.filter(i=>i.cach==='ngaycong');
  return `<div style="font-family:Arial,Helvetica,sans-serif;color:#18202f;border:1px solid #d5d9e0;border-radius:6px;padding:18px 20px;max-width:620px">
<div style="font-size:13px;color:#3a4456"><b>${esc(cfg.congTy||'')}</b>${cfg.diaChi?'<br>'+esc(cfg.diaChi):''}${cfg.mst?'<br>MST: '+esc(cfg.mst):''}</div>
<div style="text-align:center;font-size:20px;font-weight:bold;margin:14px 0 2px;letter-spacing:.5px">PHIẾU LƯƠNG</div><div style="text-align:center;color:#555;margin-bottom:12px">Tháng ${m}/${y}</div>
<table style="width:100%;font-size:14px;margin-bottom:10px"><tr><td>Họ và tên: <b>${esc(r.ten)}</b></td><td>Mã NV: <b>${esc(r.ma)}</b></td></tr><tr><td>Bộ phận: ${esc(r.boPhan)}</td><td>Chức vụ: ${esc(r.chucVu)}</td></tr><tr><td colspan="2">Ngày công: <b>${fmt(r.ngayCong)}</b> / ${r.congChuan} công chuẩn</td></tr></table>
<table style="border-collapse:collapse;width:100%">${sec('I. THU NHẬP')}${row('Lương cơ bản',fmt(r.luongCB))}${tc.map(i=>row(esc(i.ten)+' (định mức)',fmt(i.dm))).join('')}
${row('Lương theo ngày công',fmt(r.luongNC))}${thu.filter(i=>i.cach!=='ngaycong').map(i=>row(esc(i.ten)+nhanKhoan(i,r),fmt(i.amt))).join('')}${row('Tiền tăng ca'+(r.gioTC?' ('+fmt(r.gioTC)+' giờ)':''),fmt(r.tienTC))}${row('<b>Tổng thu nhập</b>','<b>'+fmt(r.tongTN)+'</b>')}
${sec('II. CÁC KHOẢN KHẤU TRỪ')}${row('BHXH ('+fmt(cfg.bhxh*100)+'%)',fmt(r.bhxh))}${row('BHYT ('+fmt(cfg.bhyt*100)+'%)',fmt(r.bhyt))}${row('BHTN ('+fmt(cfg.bhtn*100)+'%)',fmt(r.bhtn))}${row('Thuế TNCN',fmt(r.thue))}${row('Tạm ứng',fmt(r.tamUng))}${r.items.tru.map(i=>row(esc(i.ten),fmt(i.amt))).join('')}
${row('<b>Tổng khấu trừ</b>','<b>'+fmt(r.bhTru+r.thue+r.tamUng+r.khauTruKhac)+'</b>')}
${r.dienThue==='CT'?sec('III. THÔNG TIN THUẾ TNCN')+row('Giảm trừ gia cảnh (bản thân + '+r.npt+' người phụ thuộc)',fmt(r.giamTru))+row('Thu nhập miễn thuế',fmt(r.mienTN))+row('Thu nhập tính thuế',fmt(r.tntt)):''}
${row('<b>THỰC LĨNH</b>','<b>'+fmt(r.thucLinh)+' đ</b>',';background:#fff1ea;font-size:15px')}</table>
<p style="font-style:italic;font-size:13px;margin:8px 0 0">Bằng chữ: ${docSo(r.thucLinh)}.</p>${r.gcBL?`<p style="font-size:13px;margin:6px 0 0"><b>Ghi chú:</b> ${esc(r.gcBL)}</p>`:''}</div>`;

function emThu(r,y,m,e){
  const to=nvEmail(r.ma),tieuDe=emFill(e.tieuDe,r,y,m),chao=emFill(e.loiChao,r,y,m),ky=emFill(e.ky,r,y,m),slip=slipEmailHTML(r,y,m);
  const text=(chao?chao+'\n\n':'')+slipText(r,y,m)+(ky?'\n\n'+ky:'');
  const html=`<div style="font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#18202f">${chao?`<p style="white-space:pre-line">${esc(chao)}</p>`:''}${slip}${ky?`<p style="white-space:pre-line">${esc(ky)}</p>`:''}</div>`;
  return {to,tieuDe,text,html,pdfHtml:e.pdf?`<html><head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Merriweather+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><meta charset="utf-8"></head><body style="margin:24px">${slip}</body></html>`:'',tenFile:`PhieuLuong_T${m}_${y}_${r.ma}.pdf`};
}
const emUrl=(cach,t)=>cach==='gmail'?`https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(t.to)}&su=${encodeURIComponent(t.tieuDe)}&body=${encodeURIComponent(t.text)}`
  :`mailto:${encodeURI(t.to)}?subject=${encodeURIComponent(t.tieuDe)}&body=${encodeURIComponent(t.text)}`;
function emMo(cach,t){const u=emUrl(cach,t);if(cach==='gmail')window.open(u,'_blank');else{const a=document.createElement('a');a.href=u;a.style.display='none';document.body.appendChild(a);a.click();a.remove();}}
function emScriptCode(khoa){return `// Dịch vụ gửi phiếu lương — dán vào script.google.com rồi Triển khai dạng "Ứng dụng web"
var KHOA = '${khoa}';   // mã bí mật, phải trùng với phần mềm

function doPost(e) {
  var kq = {ok: 0, loi: []};
  try {
    var d = JSON.parse(e.postData.contents);
    if (d.khoa !== KHOA) throw new Error('Sai mã bí mật - hãy dán lại mã mới từ phần mềm');
    (d.thu || []).forEach(function (t) {
      try {
        var thu = {to: t.to, subject: t.tieuDe, body: t.text, htmlBody: t.html};
        if (d.tenGui) thu.name = d.tenGui;
        if (d.thuThu) thu.replyTo = d.thuThu;
        if (t.pdfHtml) thu.attachments = [Utilities.newBlob(t.pdfHtml, MimeType.HTML, 'phieuluong.html').getAs(MimeType.PDF).setName(t.tenFile)];
        MailApp.sendEmail(thu);
        kq.ok++;
      } catch (err) { kq.loi.push(t.to + ': ' + err.message); }
    });
    kq.conLai = MailApp.getRemainingDailyQuota();
  } catch (err) { kq.loi.push(err.message); }
  return ContentService.createTextOutput(JSON.stringify(kq)).setMimeType(ContentService.MimeType.JSON);
}

function doGet() {
  return ContentService.createTextOutput('Dịch vụ gửi phiếu lương đang hoạt động. Số email còn gửi được hôm nay: ' + MailApp.getRemainingDailyQuota());
}`;}
async function emPost(e,thu){
  const res=await fetch(e.url.trim(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({khoa:e.khoa,tenGui:e.tenGui,thuThu:e.thuThu,thu}),redirect:'follow'});
  const t=await res.text();let j;try{j=JSON.parse(t);}catch(x){throw new Error('Apps Script không trả về kết quả hợp lệ — kiểm tra lại bước Triển khai (quyền truy cập: Bất kỳ ai).');}
  return j;
}

        .map(([v,t,d])=>`<label class="emopt${e.cach===v?' on':''}"><input type="radio" name="emC" value="${v}"${e.cach===v?' checked':''}><span><b>${t}</b><br><span class="small muted">${d}</span></span></label>`).join('')}
      ${isS?`<div class="emset"><label class="small">URL ứng dụng web (Apps Script)<input class="f" id="emUrl" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(e.url)}"></label>

          <div style="display:flex;gap:8px;margin-top:6px"><button class="btn sm" id="emCopy">Sao chép mã</button><button class="btn sm" id="emKey" title="Tạo mã bí mật mới (phải dán lại mã và triển khai lại)">Đổi mã bí mật</button></div>

      <label class="small">Chữ ký<textarea class="f" id="emKy" rows="2" style="width:100%">${esc(e.ky)}</textarea></label>
      <div class="small muted">Có thể dùng: {ten} {ma} {thang} {nam} {congTy} {thucLinh}. Phiếu lương được chèn giữa lời chào và chữ ký.</div>
      </div><div>
      <h3 style="margin-top:0">Người nhận — tháng ${m}/${y}</h3>
      ${thieu?`<div class="alert" style="margin:0 0 8px">${thieu} người chưa có email hợp lệ — điền trực tiếp vào ô Email (lưu vào hồ sơ nhân viên).</div>`:''}
      <div class="tbl-wrap" style="max-height:380px"><table class="t" id="emTbl"><thead><tr><th><input type="checkbox" id="emAll"${chon.length&&chon.length===ok.length?' checked':''}></th><th>Nhân viên</th><th>Email</th><th class="n">Thực lĩnh</th><th>Trạng thái</th>${isS?'':'<th></th>'}</tr></thead><tbody>
      ${rows.map(r=>{const em=nvEmail(r.ma),v=emailOK(em),lg=DB.emailLog[key(r)];return `<tr data-ma="${esc(r.ma)}"><td><input type="checkbox" data-em${UI.emChon.has(r.ma)&&v?' checked':''}${v?'':' disabled'}></td>
        <td><b>${esc(r.ma)}</b> ${esc(r.ten)}</td><td><input class="f${v?'':' in'}" data-mail value="${esc(em)}" placeholder="chưa có email" style="width:175px;padding:3px 6px${em&&!v?';border-color:var(--bad)':''}"></td><td class="n">${fmt(r.thucLinh)}</td>
        <td class="small" data-st>${lg?`<span class="tag ok">${lg.c==='script'?'Đã gửi':'Đã mở'} ${new Date(lg.t).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})}</span>`:''}</td>
        ${isS?'':`<td><button class="btn sm" data-mo${v?'':' disabled'}>Mở thư</button></td>`}</tr>`;}).join('')}</tbody></table></div>

    $('#mFt').innerHTML='';
    const btn=(t,cls,fn,id)=>{const b=document.createElement('button');b.className='btn '+(cls||'');b.textContent=t;if(id)b.id=id;b.onclick=fn;$('#mFt').appendChild(b);return b;};
    btn('Đóng','',closeModal);
    if(isS)btn(`Gửi ${chon.length} phiếu lương`,'pri',guiScript,'emSend').disabled=!chon.length;
    else{const q=chon.filter(r=>!DB.emailLog[key(r)]);btn(q.length?`Mở thư tiếp theo (${chon.length-q.length+1}/${chon.length})`:'Đã mở thư cho tất cả','pri',()=>{const r=chon.filter(r=>!DB.emailLog[key(r)])[0];if(!r)return;moThu(r);},'emNext').disabled=!q.length;}

  const luuND=()=>{const g=(id,k)=>{const el=$('#'+id);if(el)e[k]=el.type==='checkbox'?el.checked:el.value;};g('emTD','tieuDe');g('emLC','loiChao');g('emKy','ky');g('emUrl','url');g('emTG','tenGui');g('emRT','thuThu');g('emPdf','pdf');DB.email=e;save();};
  const moThu=r=>{luuND();emMo(e.cach,emThu(r,y,m,e));DB.emailLog[key(r)]={t:Date.now(),c:e.cach};save();ve();};
  const guiScript=async()=>{luuND();
    if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(e.url.trim())){toast('Chưa có URL ứng dụng web Apps Script hợp lệ (https://script.google.com/macros/s/…/exec)','err');return;}

        if((kq.loi||[]).some(x=>/mã bí mật/i.test(x)))break;}
      catch(err){loi.push(/fetch/i.test(err.message)?'Không kết nối được Apps Script — kiểm tra Internet và URL.':err.message);break;}}
    save();ve();toast(`Đã gửi ${ok}/${chon.length} phiếu lương`+(loi.length?' — có lỗi':''),loi.length?'err':'ok');

  const modalInfo=loi=>{const d=document.createElement('div');d.className='alert';d.style.marginTop='10px';d.innerHTML='<b>Lỗi khi gửi:</b><ul>'+loi.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';$('#mBd').appendChild(d);};
  const bind=()=>{
    $$('input[name=emC]').forEach(i=>i.onchange=()=>{luuND();e.cach=i.value;DB.email=e;save();ve();});
    ['emTD','emLC','emKy','emUrl','emTG','emRT','emPdf'].forEach(id=>{const el=$('#'+id);if(el)el.onchange=luuND;});
    $$('#emTbl [data-em]').forEach(c=>c.onchange=()=>{const ma=c.closest('tr').dataset.ma;if(c.checked)UI.emChon.add(ma);else UI.emChon.delete(ma);ve();});
    const a=$('#emAll');if(a)a.onchange=()=>{rows.forEach(r=>{if(emailOK(nvEmail(r.ma))){if(a.checked)UI.emChon.add(r.ma);else UI.emChon.delete(r.ma);}});ve();};
    $$('#emTbl [data-mail]').forEach(i=>i.onchange=()=>{const ma=i.closest('tr').dataset.ma,nv=DB.nv.find(n=>n.ma===ma),v=i.value.trim();nv.email=v;if(emailOK(v))UI.emChon.add(ma);save();ve();});
    $$('#emTbl [data-mo]').forEach(b=>b.onclick=()=>moThu(rows.find(r=>r.ma===b.closest('tr').dataset.ma)));
    const cp=$('#emCopy');if(cp)cp.onclick=()=>{const t=$('#emCode');t.select();try{navigator.clipboard.writeText(t.value);}catch(x){document.execCommand('copy');}toast('Đã sao chép mã Apps Script','ok');};
    const nk=$('#emKey');if(nk)nk.onclick=()=>{e.khoa='';DB.email=e;emCfg();Object.assign(e,DB.email);save();ve();toast('Đã tạo mã bí mật mới — dán lại mã vào Apps Script và triển khai lại');};
    const ts=$('#emTest');if(ts)ts.onclick=async()=>{luuND();const to=$('#emTestTo').value.trim(),kq=$('#emTestKq');
      if(!emailOK(to)){kq.innerHTML='<span style="color:var(--bad)">Nhập email nhận thư thử.</span>';return;}
      if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(e.url.trim())){kq.innerHTML='<span style="color:var(--bad)">Chưa có URL ứng dụng web hợp lệ.</span>';return;}
      kq.textContent='Đang gửi thử…';
      try{const t=Object.assign(emThu(rows[0],y,m,e),{to,tieuDe:'[Thử] '+emFill(e.tieuDe,rows[0],y,m)});const r=await emPost(e,[t]);
        kq.innerHTML=r.ok?`<span style="color:var(--ok)">✓ Đã gửi thử tới ${esc(to)}. Còn gửi được hôm nay: ${r.conLai!=null?fmt(r.conLai):'?'} email.</span>`:`<span style="color:var(--bad)">✗ ${esc((r.loi||[]).join('; '))}</span>`;}
      catch(err){kq.innerHTML=`<span style="color:var(--bad)">✗ ${esc(/fetch/i.test(err.message)?'Không kết nối được Apps Script — kiểm tra Internet, URL và quyền truy cập “Bất kỳ ai”.':err.message)}</span>`;}};
  };
  modal(rows.length===1?`Gửi phiếu lương qua email — ${rows[0].ma} ${rows[0].ten}`:`Gửi phiếu lương hàng loạt qua email — ${rows.length} nhân viên`,'',[]);
  $('#modal .box').classList.add('wide');ve();
}

function vCauHinh(){
  const c=DB.cfg;
  const inp=f=>{const v=c[f.k];
    if(f.t==='bool')return `<label><input type="checkbox" data-k="${f.k}"${v?' checked':''}> Có</label>`;
    if(f.t==='sel')return `<select class="f" data-k="${f.k}">${Object.entries(f.opts).map(([a,b])=>`<option value="${a}"${a===v?' selected':''}>${b}</option>`).join('')}</select>`;
    if(f.t==='pct')return `<div class="pct"><input class="f num in" data-k="${f.k}" data-t="pct" value="${fmt(R(v*1e6)/1e4)}"></div>`;
    if(f.t==='text')return `<input class="f" data-k="${f.k}" data-t="text" value="${esc(v)}">`;
    return `<input class="f num in" data-k="${f.k}" data-t="num" value="${fmt(v)}">`;};
  let html='',open=false;
  CFG_FIELDS.forEach(f=>{if(f.g){html+=(open?'</div></div>':'')+`<div class="card"><h2>${f.g}</h2><div class="cfg-grid">`;open=true;}
    else html+=`<div class="lab">${f.lab}</div><div>${inp(f)}</div><div class="note">${f.note||''}</div>`;});
  html+='</div></div>';
  const tranBH=c.boiSoTran*c.luongCoSo,tranTN=c.boiSoTran*c.lttVung;

  ${html}
  <div class="card"><h2>Biểu thuế lũy tiến từng phần (thu nhập tính thuế / tháng)</h2>

  ${c.bieuThue.map((b,i)=>`<tr><td>${i+1}</td><td><input class="f num in" data-bt="tu" value="${fmt(b.tu)}"></td><td><input class="f num in" data-bt="den" value="${b.den==null?'':fmt(b.den)}" placeholder="Trở lên"></td><td><div class="pct"><input class="f num in" style="width:90px" data-bt="ts" value="${fmt(b.ts*100)}"></div></td><td><input class="f num in" data-bt="str" value="${fmt(b.str)}"></td><td><button class="btn sm danger" data-rm="${i}">✕</button></td></tr>`).join('')}

  $('#cfgReset').onclick=()=>modal('Khôi phục mặc định','Đưa toàn bộ tham số tính lương về giá trị của file Excel gốc? (Giữ nguyên thông tin doanh nghiệp.)',[{t:'Hủy'},{t:'Khôi phục',cls:'pri',fn:()=>{const keep={congTy:DB.cfg.congTy,diaChi:DB.cfg.diaChi,mst:DB.cfg.mst,donViCungCap:DB.cfg.donViCungCap};DB.cfg=Object.assign(clone(DEFAULT_CFG),keep);save();render();}}]);
}
function readCfg(){
  $$('#view [data-k]').forEach(i=>{const k=i.dataset.k;
    if(i.type==='checkbox')DB.cfg[k]=i.checked;else if(i.tagName==='SELECT')DB.cfg[k]=i.value;
    else if(i.dataset.t==='text')DB.cfg[k]=i.value.trim();else if(i.dataset.t==='pct')DB.cfg[k]=R(parseNum(i.value)*1e4)/1e6;else DB.cfg[k]=parseNum(i.value);});
  const bt=$$('#btBody tr').map(tr=>{const g=f=>tr.querySelector(`[data-bt="${f}"]`).value;return {tu:parseNum(g('tu')),den:g('den').trim()===''?null:parseNum(g('den')),ts:R(parseNum(g('ts'))*1e4)/1e6,str:parseNum(g('str'))};});
  if(bt.length)DB.cfg.bieuThue=bt;
  DB.cfg.dnBHXH=Math.round((DB.cfg.dnOmDau+DB.cfg.dnTNLD+DB.cfg.dnHuuTri)*1e6)/1e6;
  for(let i=1;i<DB.cfg.bieuThue.length;i++)if(DB.cfg.bieuThue[i].tu<=DB.cfg.bieuThue[i-1].tu)return 'Biểu thuế: cột "Từ trên" phải tăng dần.';
  if(!(DB.cfg.gioNgay>0))return 'Số giờ làm việc/ngày phải lớn hơn 0.';
  return '';
}

function ctyDocDB(id){if(id===CTY.cur)return DB;try{return JSON.parse(localStorage.getItem(ctyKey(id))||'null');}catch(e){return null;}}
function ctyChuyen(id){if(id===CTY.cur){closeModal();return;}luuNgay();CTY.cur=id;ctySave();load();UI.plMa='';UI.ctDraft=null;UI.kpiDraft=null;UI.dsDraft=null;closeModal();render();toast('Đang làm việc với: '+ctyTen(CTY.list.find(x=>x.id===id)),'ok');}
function ctyThem(ten,chep){luuNgay();const id='c'+Date.now().toString(36),d=blankDB();
  if(chep){d.cfg=clone(DB.cfg);['diaChi','mst','tenXa','maXa','tenTinh','maTinh','dienThoai','email','tenCQT','maCQT'].forEach(k=>d.cfg[k]='');d.cfg.ccThang={};
    ['khoan','kyHieu','congThuc','kpiBo'].forEach(k=>d[k]=clone(DB[k]));if(DB.email)d.email=clone(DB.email);if(DB.xml)d.xml=Object.assign(clone(DB.xml),{nguoiKy:''});}
  d.cfg.congTy=ten;d.ui.nam=DB.ui.nam;d.ui.thang=DB.ui.thang;
  try{localStorage.setItem(ctyKey(id),JSON.stringify(d));}catch(e){toast('Bộ nhớ trình duyệt đầy, không thêm được công ty. Hãy sao lưu và xóa bớt dữ liệu cũ.','err');return;}
  CTY.list.push({id,ten});ctySave();ctyChuyen(id);}
function ctyQuanLy(){luuNgay();
  const kb=id=>{try{return ((localStorage.getItem(ctyKey(id))||'').length/1024);}catch(e){return 0;}},tong=CTY.list.reduce((s,c)=>s+kb(c.id),0);
  const row=c=>{const d=ctyDocDB(c.id)||{nv:[],cc:{}},per=Object.keys(d.cc||{}).map(k=>k.split('|')[1]).sort().pop();
    return `<tr data-id="${esc(c.id)}"${c.id===CTY.cur?' class="cur"':''}><td class="strong">${esc(ctyTen(c))}${c.id===CTY.cur?' <span class="tag ok">đang mở</span>':''}<div class="small muted">${d.cfg&&d.cfg.mst?'MST '+esc(d.cfg.mst)+' · ':''}${(d.nv||[]).length} nhân viên${per?' · chấm công đến '+per.split('-').reverse().join('/'):''} · ${fmt(R(kb(c.id)))} KB</div></td>
      <td style="white-space:nowrap;text-align:right">${c.id===CTY.cur?'':'<button class="btn sm pri" data-mo>Mở</button> '}<button class="btn sm" data-dt>Đổi tên</button> <button class="btn sm" data-bk>Sao lưu</button> <button class="btn sm danger" data-xo>Xóa</button></td></tr>`;};
  modal('Danh sách công ty',`<p class="small muted" style="margin-top:0">Mỗi công ty có dữ liệu riêng (nhân viên, chấm công, bảng lương, cấu hình). Bấm <b>Mở</b> để chuyển sang làm việc với công ty đó.</p>
    <table class="t" id="ctyTbl"><tbody>${CTY.list.map(row).join('')}</tbody></table>
    <div class="card" style="margin:12px 0 0;padding:12px"><h3 style="margin:0 0 8px">Thêm công ty</h3><div class="form" style="grid-template-columns:minmax(0,1fr) auto">
      <label>Tên công ty<input class="f" id="ctyTen" placeholder="VD: Công ty TNHH ABC"></label><label style="align-self:end"><button class="btn pri" id="ctyAdd" type="button">+ Thêm công ty</button></label>
      <label class="full ck"><input type="checkbox" id="ctyChep" checked> Dùng chung thiết lập của công ty đang mở (cấu hình tham số, danh mục phụ cấp, ký hiệu chấm công, công thức, bộ tiêu chí KPI) — không chép nhân viên, chấm công</label></div></div>
    <p class="small muted">Dữ liệu lưu trong trình duyệt của máy này: đang dùng khoảng <b>${fmt(R(tong))} KB</b> (trình duyệt cho phép khoảng 5.000 KB cho tất cả công ty). Nên sao lưu định kỳ; công ty không còn làm thì sao lưu rồi xóa để nhẹ bộ nhớ.</p>`,
    [{t:'Sao lưu tất cả công ty',fn:()=>{backupAll();return false;}},{t:'Đóng',cls:'pri'}]);
  $('#modal .box').classList.add('wide');
  $('#ctyAdd').onclick=()=>{const t=$('#ctyTen').value.trim();if(!t){toast('Nhập tên công ty','err');$('#ctyTen').focus();return;}
    if(CTY.list.some(c=>norm(c.ten)===norm(t)))return toast('Đã có công ty tên này','err');ctyThem(t,$('#ctyChep').checked);};
  $$('#ctyTbl tr[data-id]').forEach(tr=>{const id=tr.dataset.id,c=CTY.list.find(x=>x.id===id);
    const mo=tr.querySelector('[data-mo]');if(mo)mo.onclick=()=>ctyChuyen(id);
    tr.querySelector('[data-dt]').onclick=()=>{const td=tr.querySelector('td');td.innerHTML=`<input class="f" value="${esc(ctyTen(c))}" style="width:100%">`;const i=td.querySelector('input');i.focus();i.select();
      const ok=()=>{const v=i.value.trim();if(v){c.ten=v;ctySave();if(id===CTY.cur){DB.cfg.congTy=v;save();}else{const d=ctyDocDB(id);if(d){d.cfg.congTy=v;try{localStorage.setItem(ctyKey(id),JSON.stringify(d));}catch(e){}}}}render();ctyQuanLy();};
      i.onkeydown=e=>{if(e.key==='Enter')ok();if(e.key==='Escape')ctyQuanLy();};i.onblur=ok;};
    tr.querySelector('[data-bk]').onclick=()=>{const d=ctyDocDB(id);if(id===CTY.cur)return backupJSON();download(`SaoLuu_${tenFile(ctyTen(c))}_${new Date().toISOString().slice(0,10)}.json`,new Blob([JSON.stringify(Object.assign({exportedAt:new Date().toISOString()},d),null,1)],{type:'application/json'}));};
    tr.querySelector('[data-xo]').onclick=()=>{if(CTY.list.length<2)return toast('Đây là công ty duy nhất — dùng “Xóa toàn bộ dữ liệu” ở mục Nhập / Xuất nếu muốn làm lại từ đầu','err');
      modal('Xóa công ty',`Xóa toàn bộ dữ liệu của <b>${esc(ctyTen(c))}</b> trên máy này? Không khôi phục được nếu chưa sao lưu.`,[{t:'Hủy',fn:()=>{setTimeout(ctyQuanLy,0);}},{t:'Sao lưu rồi xóa',cls:'danger',fn:()=>{tr.querySelector('[data-bk]').click();ctyXoa(id);}},{t:'Xóa không sao lưu',cls:'danger',fn:()=>ctyXoa(id)}]);};});
}
const tenFile=t=>norm(t).slice(0,40)||'CongTy';
function ctyXoa(id){try{localStorage.removeItem(ctyKey(id));}catch(e){}CTY.list=CTY.list.filter(x=>x.id!==id);
  if(CTY.cur===id){CTY.cur=CTY.list[0].id;ctySave();load();}else ctySave();render();toast('Đã xóa công ty','ok');setTimeout(ctyQuanLy,0);}
function backupAll(){luuNgay();const list=CTY.list.map(c=>({ten:ctyTen(c),db:ctyDocDB(c.id)})).filter(x=>x.db);
  download(`SaoLuu_TatCaCongTy_${new Date().toISOString().slice(0,10)}.json`,new Blob([JSON.stringify({app:'ChamCongTinhLuong',multi:true,exportedAt:new Date().toISOString(),list},null,1)],{type:'application/json'}));
  DB.meta.lastBackup=Date.now();save();toast('Đã sao lưu '+list.length+' công ty','ok');}
function khoiPhucNhieu(d){
  modal('Khôi phục nhiều công ty',`File sao lưu gồm <b>${d.list.length}</b> công ty: ${d.list.map(x=>esc(x.ten)).join(', ')}.`,[{t:'Hủy'},
    {t:'Thêm vào danh sách hiện có',fn:()=>{luuNgay();let n=0;d.list.forEach(x=>{if(!x.db||!Array.isArray(x.db.nv))return;const id='c'+Date.now().toString(36)+(n++);
      const ten=CTY.list.some(c=>norm(c.ten)===norm(x.ten))?x.ten+' (khôi phục)':x.ten;try{localStorage.setItem(ctyKey(id),JSON.stringify(upgrade(x.db)));CTY.list.push({id,ten});}catch(e){toast('Bộ nhớ trình duyệt đầy','err');}});ctySave();render();toast('Đã thêm '+n+' công ty','ok');}},
    {t:'Thay thế toàn bộ',cls:'danger',fn:()=>{CTY.list.forEach(c=>{try{localStorage.removeItem(ctyKey(c.id));}catch(e){}});CTY={cur:'main',list:[]};
      d.list.forEach((x,i)=>{if(!x.db||!Array.isArray(x.db.nv))return;const id=i?'c'+Date.now().toString(36)+i:'main';try{localStorage.setItem(ctyKey(id),JSON.stringify(upgrade(x.db)));CTY.list.push({id,ten:x.ten});}catch(e){}});
      if(!CTY.list.length)CTY.list=[{id:'main',ten:''}];CTY.cur=CTY.list[0].id;ctySave();saveTimer=null;load();render();toast('Đã khôi phục '+CTY.list.length+' công ty','ok');}}]);}
function backupJSON(){
  DB.meta.lastBackup=Date.now();save();
  const blob=new Blob([JSON.stringify(Object.assign({exportedAt:new Date().toISOString()},DB),null,1)],{type:'application/json'});
  download(`SaoLuu_${CTY.list.length>1?tenFile(ctyTen(CTY.list.find(x=>x.id===CTY.cur)))+'_':''}ChamCongTinhLuong_${new Date().toISOString().slice(0,10)}.json`,blob);render();
}
$('#fileJson').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const d=JSON.parse(await f.text());if(d.app==='ChamCongTinhLuong'&&d.multi&&Array.isArray(d.list)){khoiPhucNhieu(d);return;}

    modal('Khôi phục dữ liệu',`File sao lưu ${d.exportedAt?'lúc <b>'+new Date(d.exportedAt).toLocaleString('vi-VN')+'</b>':''}: ${d.nv.length} nhân viên, ${Object.keys(d.cc||{}).length} bảng chấm công NV-tháng.<br>Toàn bộ dữ liệu hiện tại sẽ bị thay thế.`,
      [{t:'Hủy'},{t:'Khôi phục',cls:'pri',fn:()=>{delete d.exportedAt;DB=upgrade(d);UI.ctDraft=null;save();flush();render();toast('Đã khôi phục dữ liệu','ok');}}]);
  }catch(err){toast('Không khôi phục được: '+err.message,'err');}

      ${res.notes.length?`<div class="alert"><b>Lưu ý:</b><ul>${res.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>`:''}

      res.hasNV?[{t:'Hủy'},{t:'Gộp vào dữ liệu hiện có',id:'btnImpMerge',fn:()=>{applyImport(res,'merge');render();toast('Đã nhập dữ liệu (gộp)','ok');}},
       {t:'Thay thế toàn bộ',cls:'pri',id:'btnImpReplace',fn:()=>{applyImport(res,'replace');render();toast('Đã nhập dữ liệu','ok');}}]:
       [{t:'Hủy'},{t:'Nhập vào dữ liệu',cls:'pri',id:'btnImpMerge',fn:()=>{applyImport(res,'merge');render();toast('Đã nhập dữ liệu','ok');}}]);
  }catch(err){toast('Không đọc được file: '+err.message,'err');}

function mauDB(cfg){
  const db=blankDB();if(cfg)db.cfg=Object.assign(db.cfg,cfg);
  MAU.nv.forEach(o=>{const [ma,ten,boPhan,chucVu,luongCB,phuCap,luongBH,npt]=o.nv;db.nv.push({ma,ten,boPhan,chucVu,luongCB,pc:phuCap?{PC:phuCap}:{},luongBH,npt,dienThue:'CT',dangLam:true});

function chayKiemTra(ct){
  const db=mauDB();if(ct)db.congThuc=ct;const rows=tinhBangLuong(db,MAU.nam,MAU.thang),out=[];let ok=0,tot=0;
  rows.forEach(r=>EXCEL_KQ.cols.forEach((c,i)=>{const ex=EXCEL_KQ.rows[r.ma][i],v=r[c];tot++;const same=Math.abs(v-ex)<1e-9;if(same)ok++;out.push({ma:r.ma,ten:r.ten,cot:COL_LAB[c],excel:ex,html:v,lech:v-ex,ok:same});}));
  return {ok,tot,out};
}

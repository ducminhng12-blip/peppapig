<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiểm tra sổ sách trước khóa sổ - Peqqa</title>
<link rel="icon" type="image/png" href="peqqa_logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Merriweather+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#e13977;--p-d:#be185d;--p-50:#fdf2f7;--p-100:#fce7f3;--p-200:#fbcfe8;--blue:#3a5be0;--blue-d:#2b49c7;--ink:#181422;--ink2:#27142a;--bg:#faf1f6;--border:#edd5e2}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif;font-size:14px;color:#1f2937;background:#f3f5f9;-webkit-font-smoothing:antialiased;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--p-d)}
svg{flex:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}

/* ===== Khung ===== */
.shell{display:flex;min-height:100vh}
.sidebar{width:250px;flex:none;background:linear-gradient(180deg,var(--ink),var(--ink2));color:#e2e8f0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40;border-right:1px solid rgba(225,57,119,.12)}
.brand{display:flex;gap:12px;align-items:center;padding:20px 18px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .logo{width:42px;height:42px;border-radius:12px;background:var(--p);display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.3);flex:none}
.brand .logo svg{width:22px;height:22px}
.brand b{display:block;font-size:18px;font-weight:800;color:#fff;line-height:1.3}
.brand small{color:rgba(255,255,255,.55);font-size:12px}
.nav{flex:1;min-height:0;overflow:auto;padding:6px 10px 12px}
.nav-group{margin:16px 12px 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:rgba(255,255,255,.4);font-weight:700}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:rgba(255,255,255,.78);text-decoration:none;cursor:pointer;font-weight:500;margin:2px 0;transition:background .15s}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:linear-gradient(135deg,#e13977,#f43f5e);color:#fff;box-shadow:0 6px 18px rgba(225,57,119,.35);font-weight:600}
.nav a svg{width:18px;height:18px;opacity:.9}
.side-foot{padding:14px;border-top:1px solid rgba(255,255,255,.08)}
.save-state{font-size:12px;color:rgba(255,255,255,.7);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.save-state i{width:8px;height:8px;border-radius:50%;background:#22c55e;flex:none}
.save-state.dirty i{background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.25)}
.btn-save{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;height:40px;border:0;border-radius:10px;background:#fff;color:var(--ink);font-weight:700;cursor:pointer;transition:.15s}
.btn-save:hover{background:var(--p-100)}
.btn-save svg{width:17px;height:17px}
.credit{font-size:11px;color:rgba(255,255,255,.38);margin-top:12px;text-align:center}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:rgba(250,241,246,.92);backdrop-filter:blur(10px);display:flex;align-items:center;gap:14px;padding:14px 28px;border-bottom:1px solid var(--border);min-height:70px}
.topbar h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em}
.topbar p{margin:2px 0 0;color:#6b7280;font-size:13px}
.top-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.content{padding:22px 28px 48px}
.menu-btn{display:none}
.backdrop{display:none}

/* ===== Nút, ô nhập ===== */
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:9px;border:1px solid #e0d0da;background:#fff;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;transition:all .15s;text-decoration:none;color:#1e293b}
.btn:hover{border-color:var(--p);color:var(--p)}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(58,91,224,.25)}
.btn.pri:hover{background:var(--blue-d);border-color:var(--blue-d);color:#fff;box-shadow:0 4px 12px rgba(58,91,224,.35)}
.btn.xl{background:#15803d;border-color:#15803d;color:#fff}
.btn.xl:hover{background:#166534;color:#fff}
.btn.danger{color:#dc2626;border-color:#fecaca}
.btn.danger:hover{background:#fef2f2;border-color:#dc2626;color:#b91c1c}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.on{background:var(--p-50);border-color:var(--p);color:var(--p-d)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ibtn{width:30px;height:30px;border-radius:8px;border:0;background:transparent;display:inline-grid;place-items:center;cursor:pointer;color:#667085;vertical-align:middle}
.ibtn svg{width:16px;height:16px}
.ibtn:hover{background:var(--p-50);color:var(--p-d)}
.ibtn.del:hover{background:#fee2e2;color:#dc2626}
.inp{height:36px;border:1px solid #e0d0da;border-radius:9px;padding:0 11px;background:#fff;outline:none;min-width:0;transition:border .15s,box-shadow .15s}
.inp:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(225,57,119,.18)}
textarea.inp{height:auto;padding:9px 11px;min-height:76px;resize:vertical}
select.inp{padding-right:28px}
.inp.sm{height:30px;font-size:12.5px;border-radius:8px;padding:0 8px}
.inp.num{text-align:right;font-variant-numeric:tabular-nums}
.search{position:relative;display:inline-flex}
.search input{padding-left:34px;width:260px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#98a2b3}
.seg{display:inline-flex;background:#e9edf4;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:12.5px;color:#475467}
.seg button.on{background:#fff;color:var(--p-d);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* ===== Bố cục, thẻ ===== */
.grid{display:grid;gap:18px}
.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols-21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.cols-12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.mt{margin-top:18px}.mb{margin-bottom:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.muted{color:#667085}
.small{font-size:12.5px}
.r{text-align:right}.c{text-align:center}
.nowrap{white-space:nowrap}
.tnum{font-variant-numeric:tabular-nums}
.pos{color:#15803d}.neg{color:#dc2626}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:18px}
.kpi{background:#fff;border-radius:14px;padding:16px 18px;border:1px solid var(--border);box-shadow:0 2px 8px rgba(36,34,48,.04);position:relative;overflow:hidden}
.kpi:after{content:'';position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:var(--p-50);opacity:.6}
.kpi .k-ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--p-50);color:var(--p);position:relative;z-index:1}
.kpi .k-ic svg{width:19px;height:19px}
.kpi .k-lb{color:#667085;font-size:12.5px;font-weight:500;margin-top:12px}
.kpi .k-v{font-size:22px;font-weight:700;margin-top:3px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .k-sub{font-size:12px;color:#667085;margin-top:3px}
.t-green .k-ic{background:#dcfce7;color:#16a34a}
.t-red .k-ic{background:#fee2e2;color:#dc2626}
.t-amber .k-ic{background:#fef3c7;color:#d97706}
.t-blue .k-ic{background:#dbeafe;color:#2563eb}
.t-violet .k-ic{background:#ede9fe;color:#7c3aed}
.t-cyan .k-ic{background:#cffafe;color:#0891b2}
.card{background:#fff;border-radius:14px;border:1px solid var(--border);box-shadow:0 2px 8px rgba(36,34,48,.04);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid #f2e1ea;min-height:56px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:15px;font-weight:700}
.card-h .sub{color:#667085;font-size:12.5px}
.card-h .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.card-b{padding:16px 18px}
.card-b.p0{padding:0}
.banner{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:12px;background:var(--p-50);border:1px solid var(--p-100);margin-bottom:16px;flex-wrap:wrap}
.banner.warn{background:#fffbeb;border-color:#fde68a}
.banner svg{width:20px;height:20px;color:var(--p)}
.banner.warn svg{color:#d97706}
.empty{padding:40px 20px;text-align:center;color:#98a2b3}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:#f2f4f7;color:#475467;white-space:nowrap}
.b-green{background:#dcfce7;color:#15803d}
.b-red{background:#fee2e2;color:#b91c1c}
.b-amber{background:#fef3c7;color:#b45309}
.b-blue{background:#dbeafe;color:#1d4ed8}
.b-violet{background:#ede9fe;color:#6d28d9}
.b-cyan{background:#cffafe;color:#0e7490}
.b-p{background:var(--p-100);color:var(--p-d);border:1px solid var(--p-200)}
.avatar{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;background:var(--p-100);color:var(--p-d);font-weight:700;font-size:12px;flex:none}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{display:block;font-weight:600}
.who small{color:#667085;font-size:12px}

/* ===== Bảng ===== */
.tbl-card{background:#fff;border-radius:14px;border:1px solid var(--border);box-shadow:0 2px 8px rgba(36,34,48,.04);overflow:hidden}
.tbl-tools{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid #f2e1ea;flex-wrap:wrap}
.tbl-wrap{overflow:auto;max-height:calc(100vh - 300px);min-height:200px}
.tbl-wrap.free{max-height:none}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th{position:sticky;top:0;background:#faf2f6;text-align:left;font-weight:700;color:#475467;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;z-index:2}
.tbl td{padding:9px 12px;border-bottom:1px solid #f5e8ef;vertical-align:middle;white-space:nowrap}
.tbl td.wrap{white-space:normal;min-width:220px}
.tbl tbody tr:hover td{background:var(--p-50)}
.tbl tbody tr.click{cursor:pointer}
.tbl th.r,.tbl td.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl th.c,.tbl td.c{text-align:center}
.tbl tfoot td{font-weight:700;background:#faf2f6;border-top:2px solid var(--border);position:sticky;bottom:0;z-index:2}
.tbl th.sort{cursor:pointer;user-select:none}
.tbl th.sort:after{content:'↕';opacity:.3;margin-left:5px}
.tbl th.asc:after{content:'↑';opacity:1}
.tbl th.desc:after{content:'↓';opacity:1}
.tbl td.act{white-space:nowrap;text-align:right;width:1%}
.tbl-pager{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:12.5px;color:#667085;gap:10px;flex-wrap:wrap}
.tbl .inp.sm{width:110px}
.pg{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.pg select{margin:0 8px 0 4px}
.pg-n{min-width:30px;height:30px;padding:0 8px;border:1px solid #d6dce7;background:#fff;border-radius:8px;cursor:pointer;font:inherit;font-size:12.5px;font-weight:600;color:#475467}
.pg-n:hover:not(:disabled){border-color:var(--p);color:var(--p-d)}
.pg-n.on{background:var(--p);border-color:var(--p);color:#fff}
.pg-n:disabled{opacity:.4;cursor:default}
.pg-dot{padding:0 4px;color:#98a2b3}
.pg-host .tbl-pager{border-top:1px solid #eef0f5}
.tbl.compact td{padding:7px 10px}
.tbl.compact th{padding:8px 10px}

/* ===== Modal, form ===== */
.modal-wrap{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:100;overflow:auto;animation:fade .15s}
.modal{background:#fff;border-radius:16px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.25);animation:pop .18s}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid #eef0f5}
.modal-h h3{margin:0;font-size:16px}
.modal-h .ibtn{margin-left:auto}
.modal-b{padding:18px 20px;max-height:72vh;overflow:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid #eef0f5;background:#fafbfc;border-radius:0 0 16px 16px}
.modal-f .left{margin-right:auto}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.form.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.form.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:12.5px;font-weight:600;color:#344054}
.field.full{grid-column:1/-1}
.field.s2{grid-column:span 2}
.field small{color:#98a2b3;font-size:11.5px}
.field .inp{width:100%}
.field.chk{flex-direction:row;align-items:center;gap:8px}
.req{color:#ef4444;font-style:normal}
.fsec{grid-column:1/-1;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--p-d);border-bottom:1px solid #eef0f5;padding-bottom:6px;margin-top:6px}
.img-pick{display:flex;gap:12px;align-items:center}
.img-pick .ph{width:72px;height:72px;border-radius:12px;border:1px dashed #cbd2dd;display:grid;place-items:center;overflow:hidden;background:#f8fafc;color:#98a2b3;flex:none}
.img-pick .ph img{width:100%;height:100%;object-fit:contain}
.thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;background:#f2f4f7;display:block}

/* ===== Thông báo, gợi ý ===== */
#toasts{position:fixed;right:20px;bottom:20px;z-index:300;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:#111827;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:13.5px;max-width:400px;animation:pop .2s;border-left:4px solid var(--p)}
.toast.ok{border-left-color:#22c55e}
.toast.err{border-left-color:#ef4444}
#tip{position:fixed;pointer-events:none;background:#111827;color:#fff;font-size:12px;padding:6px 9px;border-radius:7px;z-index:400;white-space:pre;display:none;box-shadow:0 6px 18px rgba(0,0,0,.25);line-height:1.4}

/* ===== Biểu đồ ===== */
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:#475467;margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.donut{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donut svg{width:170px;height:170px}
.dl{flex:1;min-width:170px}
.dl div{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed #eef0f5;font-size:13px}
.dl div:last-child{border-bottom:0}
.dl i{width:10px;height:10px;border-radius:3px;flex:none}
.dl b{margin-left:auto;font-variant-numeric:tabular-nums}
.dl em{color:#98a2b3;font-style:normal;width:48px;text-align:right;font-size:12px}
.hb{margin:10px 0}
.hb-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;gap:10px}
.hb-top span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-top b{font-variant-numeric:tabular-nums;white-space:nowrap}
.hb-bar{height:8px;background:#f0f2f6;border-radius:99px;overflow:hidden}
.hb-bar i{display:block;height:100%;border-radius:99px;background:var(--p)}
.funnel .fn{display:flex;align-items:center;gap:12px;margin:8px 0}
.funnel .fn-l{width:130px;font-size:13px;flex:none}
.funnel .fn-b{flex:1;height:30px;background:#f3f5f9;border-radius:8px;overflow:hidden}
.funnel .fn-b i{display:flex;align-items:center;height:100%;border-radius:8px;color:#fff;font-size:12px;font-weight:700;padding:0 10px;min-width:34px}

/* ===== Màn hình nhỏ ===== */
@media(max-width:1100px){.cols-2,.cols-3,.cols-21,.cols-12{grid-template-columns:minmax(0,1fr)}}
@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s}
  body.nav-open .sidebar{transform:none}
  body.nav-open .backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35}
  .menu-btn{display:inline-grid}
  .topbar{padding:10px 16px;flex-wrap:wrap;position:static}
  .top-actions{margin-left:0;width:100%;justify-content:flex-start}
  .content{padding:16px}
  .search input{width:200px}
  .form,.form.c3,.form.c4{grid-template-columns:minmax(0,1fr)}
  .field.s2{grid-column:auto}
}

/* ===== In ===== */
#print-root{display:none}
.pr{color:#111;font-size:12px;font-family:'Nunito Sans','Segoe UI',Arial,sans-serif}
.pr-head{display:flex;gap:14px;align-items:center;border-bottom:2px solid var(--p);padding-bottom:10px;margin-bottom:12px}
.pr-head img{max-height:58px;max-width:120px}
.pr-co b{font-size:15px;color:var(--p-d);text-transform:uppercase}
.pr-co div{font-size:11.5px;color:#444}
.pr-meta{margin-left:auto;text-align:right;font-size:11px;color:#555}
.pr h2{text-align:center;margin:12px 0 4px;font-size:19px;text-transform:uppercase;color:#111;letter-spacing:.02em}
.pr .pr-sub{text-align:center;color:#555;margin-bottom:14px;font-style:italic}
.pr table{width:100%;border-collapse:collapse}
.pr th{background:var(--p);color:#fff;padding:6px;font-size:10.5px;border:1px solid var(--p-d);text-align:center}
.pr td{border:1px solid #c9ced8;padding:5px 6px;font-size:11px;vertical-align:top}
.pr td.r{text-align:right;white-space:nowrap}
.pr td.c{text-align:center}
.pr tfoot td{font-weight:700;background:#eef1f6}
.pr-signs{display:flex;justify-content:space-around;margin-top:26px;text-align:center;page-break-inside:avoid}
.pr-signs div{min-width:150px}
.pr-signs b{display:block}
.pr-signs i{font-size:11px;color:#666}
.pr-signs .sp{height:72px}
.pr-note{margin-top:10px;font-size:11.5px}
.pagebreak{page-break-after:always;break-after:page}
@media print{
  body{background:#fff}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.is-printing>*:not(#print-root){display:none!important}
  body.is-printing #print-root{display:block}
  body:not(.is-printing) .sidebar,body:not(.is-printing) .topbar,body:not(.is-printing) .no-print{display:none!important}
  body:not(.is-printing) .content{padding:0}
  .card,.kpi,.tbl-card{box-shadow:none;break-inside:avoid}
  .tbl-wrap{max-height:none!important;overflow:visible!important}
  #print-root .card{border:1px solid #ddd}
  #print-root .kpis{grid-template-columns:repeat(3,1fr)}
  #print-root .cols-2,#print-root .cols-21,#print-root .cols-12{grid-template-columns:1fr 1fr}
  #print-root .no-print,#print-root .tbl-tools,#print-root .tbl-pager,#print-root td.act,#print-root th.act{display:none!important}
}


/* ===== Thanh bên: nút lưu ===== */

const Print = {
  run(html, { landscape = false, title } = {}) {
    $$('#print-root,#print-page').forEach(n => n.remove());
    const root = document.createElement('div'); root.id = 'print-root'; root.dataset.runtime = '1'; root.innerHTML = html;
    document.body.appendChild(root);
    const st = document.createElement('style'); st.id = 'print-page'; st.dataset.runtime = '1';
    st.textContent = `@page{size:A4 ${landscape ? 'landscape' : 'portrait'};margin:11mm 10mm}`;
    document.head.appendChild(st);
    document.body.classList.add('is-printing');
    const t0 = document.title; if (title) document.title = title;
    const done = () => { document.body.classList.remove('is-printing'); root.remove(); st.remove(); document.title = t0; window.removeEventListener('afterprint', done); };

  },
  head(meta = '') {
    const c = DB.settings.company || {};
    return `<div class="pr-head">${c.logo ? `<img src="${c.logo}">` : ''}<div class="pr-co"><b>${esc(c.ten || '')}</b>${c.diaChi ? `<div>${esc(c.diaChi)}</div>` : ''}<div>${[c.sdt ? 'ĐT: ' + esc(c.sdt) : '', c.email ? 'Email: ' + esc(c.email) : '', c.mst ? 'MST: ' + esc(c.mst) : ''].filter(Boolean).join(' · ')}</div></div><div class="pr-meta">${meta || 'Ngày in: ' + F.date(D.today())}</div></div>`;
  },
  signs(list, date = true) {
    const d = new Date();
    return `${date ? `<div style="text-align:right;margin-top:16px;font-style:italic">Ngày ${d.getDate()} tháng ${d.getMonth() + 1} năm ${d.getFullYear()}</div>` : ''}<div class="pr-signs">${list.map(s => `<div><b>${s}</b><i>(Ký, ghi rõ họ tên)</i><div class="sp"></div></div>`).join('')}</div>`;
  },
  table(cols, rows, totals = true) {
    const xc = xCols(cols);
    const body = rows.map((r, ri) => `<tr>${xc.map(c => { const v = c._c.xval ? c._c.xval(r) : colText(c._c, r); const t = c.type; return `<td class="${['money', 'num', 'pct'].includes(t) ? 'r' : t === 'date' || t === 'center' ? 'c' : ''}">${t === 'money' ? F.money(v) : t === 'num' ? F.num(v) : t === 'pct' ? F.pct(v) : t === 'date' ? F.date(v) : esc(v)}</td>`; }).join('')}</tr>`).join('');

/* Hộp nhập dữ liệu từ file Excel (.xlsx), CSV hoặc dán từ Excel.
   o: { title, hint, cols:[tên cột theo thứ tự], map(row)->bản ghi | null, onDone(list) } */
function importDialog(o) {
  const m = Modal.open({
    title: o.title, width: 760,
    body: `<div class="hint-box">${o.hint || ''}<br><b>Thứ tự cột:</b> ${o.cols.map((c, i) => `${i + 1}. ${esc(c)}`).join(' · ')}</div>
      <div class="row" style="margin-bottom:10px"><label class="btn">${ic('upload')} Chọn file Excel (.xlsx) hoặc CSV<input type="file" accept=".xlsx,.csv" hidden id="impFile"></label><span class="muted small" id="impName">hoặc dán dữ liệu vào ô bên dưới</span></div>
      <textarea class="inp" id="impTa" rows="10" placeholder="Copy các ô trong Excel rồi dán vào đây (Ctrl + V)"></textarea>
      <div class="note-s" id="impRes"></div>`,
    foot: `<button class="btn" data-no>Hủy</button><button class="btn pri" data-ok>${ic('check')} Nhập dữ liệu</button>`
  });
  let fileRows = null;
  $('#impFile', m.el).onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { fileRows = await XLSX.read(f); $('#impName', m.el).textContent = f.name + ': ' + fileRows.length + ' dòng'; $('#impTa', m.el).value = ''; }
    catch (err) { fileRows = null; toast(esc(err.message), 'err'); }
  };
  m.el.querySelector('[data-no]').onclick = () => m.close();
  m.el.querySelector('[data-ok]').onclick = () => {
    let rows = fileRows;
    if (!rows) { const t = $('#impTa', m.el).value; rows = t.split(/\r?\n/).filter(l => l.trim()).map(l => l.includes('\t') ? l.split('\t') : l.split(/;/)); }
    const list = []; let skip = 0;
    rows.forEach(r => { let x = null; try { x = o.map(r); } catch (e) { x = null; } if (x) list.push(x); else skip++; });
    if (!list.length) { $('#impRes', m.el).textContent = 'Không đọc được dòng nào. Kiểm tra lại thứ tự cột và định dạng ngày (dd/mm/yyyy).'; return; }
    o.onDone(list); m.close(); toast(`Đã nhập <b>${list.length}</b> dòng${skip ? `, bỏ qua ${skip} dòng không hợp lệ (tiêu đề, dòng trống)` : ''}`, 'ok');
  };
  return m;
}

function crudView(o) {

    Form.open({
      title: (isNew ? 'Thêm ' : 'Sửa ') + o.label, fields: o.fields, value: rec || (o.defaults ? o.defaults() : {}), width: o.width || 680, cols: o.formCols || 2,
      onSave: d => {

        if (o.norm) d = o.norm(d);
        if (isNew) DB[o.key].push({ id: uid(), ...d }); else Object.assign(rec, d);
        App.changed(); toast('Đã lưu', 'ok');
      },
      onDelete: isNew ? null : () => { DB[o.key] = DB[o.key].filter(x => x !== rec); App.changed(); }

  return {
    title: o.title, icon: o.icon, desc: o.desc, label: o.menu,
    tools() { return (o.tools ? o.tools() : '') + (o.imp ? `<button class="btn" data-act="${o.id}Imp">${ic('upload')} Nhập từ Excel</button>` : '') + `<button class="btn pri" data-act="${o.id}Add">${ic('plus')} ${o.addText || 'Thêm'}</button>`; },

    },

function pDate(v){if(v===''||v==null)return '';if(typeof v==='number')return new Date((Math.floor(v)-25569)*86400000).toISOString().slice(0,10);const s=String(v).trim();if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);const m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);return m?m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'):s;}
function parseWorkbook(book){const temp=emptyDB(),errors=[],added={};const settingsRows=book['Cài đặt'];if(!settingsRows)errors.push('Thiếu sheet Cài đặt');else for(const[k,l,t]of SETFIELDS){const row=settingsRows.find(r=>r[0]===l);if(!row){errors.push('Cài đặt thiếu '+l);continue;}temp.settings[k]=t==='date'?pDate(row[1]):t==='number'?Number(row[1]):String(row[1]??'').trim();}if(!periodOK(temp))errors.push('Cài đặt: kỳ, ngày rà soát hoặc ngưỡng không hợp lệ');for(const k of Object.keys(SCHEMAS)){added[k]=0;const rows=book[SHEETS[k]],fields=SCHEMAS[k];if(!rows){errors.push('Thiếu sheet '+SHEETS[k]);continue;}const h=rows.findIndex(r=>fields.every((f,j)=>r[j]===f[1]));if(h<0){errors.push(SHEETS[k]+': tiêu đề khác mẫu');continue;}for(let i=h+1;i<rows.length;i++){const r=rows[i];if(!r.slice(0,fields.length).some(v=>v!==''&&v!=null))continue;if(r[0]==='NHẬN QUÀ TỪ THẦY'||String(r[0]).startsWith('🎁')||String(r[0]).startsWith('💬'))continue;const x={id:uid()};fields.forEach(([f,l,t],j)=>x[f]=t==='date'?pDate(r[j]):['money','signed'].includes(t)?r[j]===''||r[j]==null?'':typeof r[j]==='number'?r[j]:Number(String(r[j]).replace(/\s/g,'')):String(r[j]??'').trim());const e=validate(k,x,temp);if(e)errors.push(SHEETS[k]+' dòng '+(i+1)+': '+e);else{temp[k].push(x);added[k]++;}}}return{db:temp,errors,added};}
function openImport(){let parsed=null;const m=Modal.open({title:'Nhập bộ Excel kiểm tra sổ sách',width:850,body:hintBox('Nhập đủ 4 bảng và Cài đặt theo mẫu. Chỉ thay dữ liệu sau khi toàn bộ dòng hợp lệ; không bỏ qua lỗi âm thầm. Sao lưu trước khi thay.')+'<input type="file" class="inp" id="ksFile" accept=".xlsx"><div class="ks-log" id="ksImportResult"></div>',foot:'<button class="btn" data-cancel>Đóng</button><button class="btn pri" data-import disabled>Thay dữ liệu bằng bộ đã kiểm tra</button>'});const log=$('#ksImportResult',m.el),commit=$('[data-import]',m.el);$('[data-cancel]',m.el).onclick=()=>m.close();$('#ksFile',m.el).onchange=async e=>{parsed=null;commit.disabled=true;try{parsed=parseWorkbook(await readWorkbook(e.target.files[0]));log.innerHTML=hintBox(Object.entries(parsed.added).map(([k,v])=>SHEETS[k]+': '+v+' dòng').join(' · '))+(parsed.errors.length?warnBox(parsed.errors.length+' lỗi, chưa nhập dữ liệu')+parsed.errors.map(x=>'<p>'+esc(x)+'</p>').join(''):okBox('Đúng cấu trúc; các cảnh báo nghiệp vụ vẫn được giữ để rà soát.'));commit.disabled=parsed.errors.length>0;}catch(err){log.textContent=err.message;}};commit.onclick=async()=>{if(!parsed||parsed.errors.length)return;if(!await Modal.confirm('Thay toàn bộ dữ liệu hiện tại bằng '+Object.values(parsed.added).reduce((a,b)=>a+b,0)+' dòng đã kiểm tra?',{ok:'Thay dữ liệu',danger:true}))return;DB=parsed.db;DB._meta={};App.changed();m.close();toast('Đã nhập. Kiểm tra cảnh báo và Lưu vào file.','ok');};}
function exportAll(){const m=metrics(DB);XLSX.save('KiemTraSoSach_DuLieu_'+DB.settings.end,[{name:'Hướng dẫn',title:'HƯỚNG DẪN KIỂM TRA SỔ SÁCH',columns:[{label:'Mục',width:32},{label:'Nội dung',width:110}],rows:[...NOTES,['Cộng đồng Kế Toán','https://peqqa.pages.dev/cong-dong/?nhom=kt'],['Tư vấn làm file','https://zalo.me/0563520805']]},...Object.keys(SCHEMAS).map(k=>xSheet(SHEETS[k],SHEETS[k].toUpperCase(),fullCols(k),rowsOf(k),{totals:false,freezeCols:1})),{name:'Cài đặt',title:'CÀI ĐẶT KÈM DỮ LIỆU',columns:[{label:'Thông số',width:40},{label:'Giá trị',width:65}],rows:SETFIELDS.map(([k,l])=>[l,DB.settings[k]])},{name:'Tổng hợp',title:'TỔNG HỢP KIỂM TRA SỔ SÁCH',columns:[{label:'Chỉ tiêu',width:40},{label:'Kết quả',width:40}],rows:[['TK cần xử lý',m.accountIssues],['Dòng nhật ký lỗi',m.journalIssues],['Đối chiếu chưa khớp',m.reconIssues],['Mục kiểm tra còn mở',m.pending],['Lệch số dư tuyệt đối',m.absAccounts],['Lệch đối chiếu tuyệt đối',m.absRecons],['Trạng thái',m.ready?'Đủ bước rà soát nội bộ':'Chưa đủ điều kiện rà soát'],['Loại xuất','Ảnh chụp số liệu; dùng file Excel gốc đi kèm nếu cần công thức động.']]}]);}
const originalDataRender=DataScreen.render;DataScreen.render=function(el){originalDataRender.call(this,el);const c=document.createElement('div');c.innerHTML=card('Trao đổi dữ liệu Excel',`<p class="ks-note">Bộ Excel chuẩn có công thức động. Excel xuất từ HTML là bản dữ liệu và kết quả tại thời điểm xuất, nhập lại được vào HTML.</p><div class="row"><button class="btn" data-act="importWorkbook">${ic('upload')} Nhập bộ Excel</button><button class="btn" data-act="exportAll">${ic('download')} Xuất toàn bộ dữ liệu</button></div>`);el.prepend(c);};

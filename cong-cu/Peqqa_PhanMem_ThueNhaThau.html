<style>
:root{
  --pri:#e13977; --pri-d:#be185d; --pri-l:#fce7f3; --side:#181422; --side2:#27142a;
  --in:#2563eb; --in-l:#dbeafe; --out:#ea580c; --out-l:#ffedd5; --warn:#d97706; --warn-l:#fef3c7;
  --err:#dc2626; --err-l:#fee2e2; --ok:#16a34a; --ok-l:#dcfce7;
  --bg:#f4f6f8; --card:#fff; --line:#e5e7eb; --line2:#f1f3f5; --txt:#1f2937; --mut:#6b7280; --mut2:#9ca3af;
  --r:12px; --sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --font:"Be Vietnam Pro","Nunito","Mulish","Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);font-size:14px;color:var(--txt);background:var(--bg);line-height:1.45}
button,input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--pri)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.neg{color:var(--err)}
.mut{color:var(--mut)} .small{font-size:12px}
.layout{display:flex;min-height:100vh}
/* ---------- sidebar ---------- */
.sidebar{width:260px;flex:0 0 260px;background:var(--side);color:#d1d5db;position:fixed;top:0;bottom:0;left:0;overflow-y:auto;z-index:30;display:flex;flex-direction:column;transition:transform .25s}
.brand{display:flex;gap:10px;align-items:center;padding:18px 16px 12px}
.brand .logo{width:40px;height:40px;border-radius:10px;background:var(--pri);display:grid;place-items:center;color:#fff;flex:0 0 40px}
.brand b{display:block;color:#fff;font-size:15px;line-height:1.2}
.brand span{font-size:11px;color:#9ca3af}
.savebox{margin:4px 12px 10px;background:var(--side2);border-radius:10px;padding:10px}
.btn-save{width:100%;background:#facc15;color:#422006;border:0;border-radius:8px;padding:9px 10px;font-weight:700;cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:center}
.btn-save:hover{background:#fde047}
.savestate{display:flex;gap:7px;align-items:center;font-size:11.5px;margin-top:8px;color:#cbd5e1}
.dot{width:8px;height:8px;border-radius:50%;background:#22c55e;flex:0 0 8px}
.dot.dirty{background:#f59e0b;animation:blink 1.2s infinite}
.dot.err{background:#ef4444}
@keyframes blink{50%{opacity:.25}}
.minikpi{margin:0 12px 6px;background:var(--side2);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.minikpi div{font-size:11px;color:#9ca3af}.minikpi b{display:block;color:#fff;font-size:13.5px;font-variant-numeric:tabular-nums}
.navgrp{padding:10px 12px 2px;font-size:10.5px;letter-spacing:.08em;color:#6b7f75;font-weight:700}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 12px;margin:1px 8px;border-radius:8px;color:#d1d5db;text-decoration:none;font-size:13.5px}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:var(--pri);color:#fff;font-weight:600}
.nav a .badge{margin-left:auto;background:var(--err);color:#fff;border-radius:10px;font-size:11px;padding:0 7px;line-height:18px;font-weight:700}
.author{margin:auto 12px 14px;padding:10px 12px;border-radius:10px;background:var(--side2);font-size:12px;color:#9ca3af}
.author{line-height:1.6;color:rgba(255,255,255,.7)}
.author small{display:block;font-size:10px;letter-spacing:.1em;color:rgba(255,255,255,.45);font-weight:700}
.author b{display:block;color:#fff;font-size:14px}
.author a{display:block;color:#5eead4;text-decoration:none}
.author a:hover{text-decoration:underline}
.brandfoot{margin-top:24px;padding:12px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--mut);display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}
.brandfoot a{color:var(--pri-d);font-weight:600;text-decoration:none}
.about{border-left:4px solid var(--pri)}
.about-in{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.about-logo{width:52px;height:52px;border-radius:14px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;flex:0 0 52px}
.about .btn{margin:2px 0;text-decoration:none}
.main{margin-left:260px;flex:1;min-width:0}
.topbar{position:sticky;top:0;z-index:20;background:rgba(244,246,248,.92);backdrop-filter:blur(6px);display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line)}
.topbar h1{font-size:19px;margin:0}
.topbar .desc{font-size:12.5px;color:var(--mut)}
.chip{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12.5px;color:var(--mut);white-space:nowrap}
.burger{display:none;background:none;border:0;cursor:pointer;padding:4px}
.content{padding:20px 24px 40px;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.overlay{display:none}
/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:15px}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.kpi .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:0 0 40px;background:var(--pri-l);color:var(--pri-d)}
.kpi .ic.in{background:var(--in-l);color:var(--in)}.kpi .ic.out{background:var(--out-l);color:var(--out)}.kpi .ic.warn{background:var(--warn-l);color:var(--warn)}.kpi .ic.err{background:var(--err-l);color:var(--err)}
.kpi .lb{font-size:12px;color:var(--mut)} .kpi .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.kpi .sub{font-size:11.5px;color:var(--mut2)}
.notice{border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.notice.warn{background:var(--warn-l);border:1px solid #fcd34d;color:#78350f}
.notice.err{background:var(--err-l);border:1px solid #fca5a5;color:#7f1d1d}
.notice.info{background:var(--in-l);border:1px solid #93c5fd;color:#1e3a8a}
.notice button{margin-left:auto}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--txt);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-1px);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--pri-d)}
.btn.danger{color:var(--err);border-color:#fecaca}
.btn.sm{padding:4px 8px;font-size:12.5px}
.btn.icon{padding:5px 7px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
/* ---------- toolbar & table ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.search{position:relative;flex:1 1 220px;max-width:340px}
.search input{width:100%;padding:8px 10px 8px 32px;border:1px solid var(--line);border-radius:8px;background:#fff}
.search svg{position:absolute;left:9px;top:9px;color:var(--mut2)}
.toolbar select,.field select,.field input,.field textarea{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.toolbar .sp{flex:1}
.toolbar label{display:inline-flex;gap:4px;align-items:center;max-width:100%;flex-wrap:wrap}
.toolbar select{max-width:100%}
.strip{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.strip div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:12px;color:var(--mut)}
.strip b{display:block;color:var(--txt);font-size:15px;font-variant-numeric:tabular-nums}
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;max-height:calc(100vh - 250px)}
.tblwrap.free{max-height:none}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
table.t th{position:sticky;top:0;background:#f8fafc;color:#475569;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1;cursor:default}
table.t th.sort{cursor:pointer}table.t th.sort:hover{color:var(--pri)}
table.t td{padding:7px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
table.t tbody tr:hover td{background:#f9fafb}
table.t tfoot td{background:#f0fdf4;font-weight:700;white-space:nowrap;border-top:1px solid var(--line);position:sticky;bottom:0}
table.t td.code{font-weight:700;white-space:nowrap}
table.t td.clip{max-width:320px}
table.t td.clip div{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
table.t tr.del td{color:var(--mut2);text-decoration:line-through}
table.t tr.bad td{background:#fff5f5}
table.t tr.sec td{background:#f8fafc;font-weight:700}
.tag{display:inline-block;border-radius:20px;padding:1px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.tag.ok{background:var(--ok-l);color:#166534}.tag.warn{background:var(--warn-l);color:#92400e}.tag.err{background:var(--err-l);color:#991b1b}.tag.in{background:var(--in-l);color:#1e40af}.tag.out{background:var(--out-l);color:#9a3412}.tag.mut{background:#f3f4f6;color:#4b5563}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:10px 2px;font-size:12.5px;color:var(--mut)}
.empty{text-align:center;padding:40px 10px;color:var(--mut)}
.empty svg{color:var(--mut2);margin-bottom:6px}
/* ---------- modal & toast ---------- */
.mback{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;z-index:100;padding:16px;animation:fade .15s}
.modal{background:#fff;border-radius:14px;width:min(560px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.wide{width:min(900px,100%)}
.mhead{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.mhead h3{margin:0;font-size:16px}.mhead button{margin-left:auto}
.mbody{padding:16px 18px;overflow:auto}
.mfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.field{display:flex;flex-direction:column;gap:4px}
.field.full{grid-column:1/-1}
.field label{font-size:12.5px;font-weight:600;color:#374151}
.field label i{color:var(--err);font-style:normal}
.field input,.field select,.field textarea{width:100%}
.field .hint{font-size:11.5px;color:var(--mut)}
.field .ferr{font-size:11.5px;color:var(--err);min-height:0}
.field.bad input,.field.bad select{border-color:var(--err);background:#fff8f8}
.field .auto{font-size:12px;color:var(--pri-d)}
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:#111827;color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.2);font-size:13.5px;max-width:380px;animation:fade .2s;border-left:4px solid #22c55e}
.toast.err{border-left-color:#ef4444}.toast.warn{border-left-color:#f59e0b}
/* ---------- charts & lists ---------- */
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.toplist .it{margin-bottom:10px}
.toplist .row{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.bar{height:7px;background:#f1f5f9;border-radius:4px;overflow:hidden;margin-top:4px}
.bar span{display:block;height:100%;background:var(--pri);border-radius:4px}
.alerts .a{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:13px}
.alerts .a:last-child{border-bottom:0}
.alerts .a svg{flex:0 0 18px;margin-top:1px}
.chk .lvl{margin-bottom:16px}
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.setcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--sh)}
.setcard .ic{width:38px;height:38px;border-radius:10px;background:var(--pri-l);color:var(--pri-d);display:grid;place-items:center}
.setcard b{font-size:14px}.setcard p{margin:0;font-size:12.5px;color:var(--mut);flex:1}
.paper{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px 26px;box-shadow:var(--sh)}
.paper .ph{display:flex;justify-content:space-between;gap:12px;margin-bottom:10px}
.paper h2{text-align:center;margin:8px 0 2px;font-size:20px;color:var(--pri-d)}
.paper .sub{text-align:center;font-size:12.5px;color:var(--mut);margin-bottom:12px}
.kv{display:grid;grid-template-columns:170px minmax(0,1fr);gap:6px 10px;font-size:13.5px}
.sign{display:grid;grid-template-columns:repeat(5,1fr);text-align:center;margin-top:24px;font-size:13px}
.sign.two{grid-template-columns:1fr 1fr}
.sign b{display:block}.sign i{color:var(--mut);font-size:12px}
.print-only{display:none}
/* ---------- responsive ---------- */
@media (max-width:1100px){.g2,.g3{grid-template-columns:1fr}}
@media (max-width:860px){
  .sidebar{transform:translateX(-100%)}
  body.menu .sidebar{transform:none}
  body.menu .overlay{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
  .main{margin-left:0}
  .burger{display:block}
  .topbar{padding:10px 14px}
  .topbar .desc{display:none}
  .content{padding:14px 12px 30px}
  .fgrid{grid-template-columns:1fr}
  .kv{grid-template-columns:110px minmax(0,1fr)}
  .kv select,.kv input{max-width:100%}
  .paper{padding:14px 12px}
  .ph{flex-direction:column}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:10px;gap:8px}.kpi .ic{width:32px;height:32px;flex-basis:32px}.kpi .v{font-size:16px}
  .sign{grid-template-columns:repeat(2,1fr);gap:14px}
  .tblwrap{max-height:none}
  .chip{display:none}
}
/* ---------- in ấn ---------- */
@media print{
  body{background:#fff;font-size:11.5px}
  .sidebar,.topbar,.toolbar,.no-print,.pager,.toasts,.notice,.overlay{display:none!important}
  .main{margin:0}.content{padding:0}
  .card,.paper,.tblwrap{border:0;box-shadow:none;padding:0;max-height:none;overflow:visible}
  .print-only{display:block}
  table.t th{position:static;background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.t tfoot td{position:static}
  table.t td,table.t th{border:1px solid #bbb;padding:3px 5px}
  tr{page-break-inside:avoid}
  .about{display:none}
  .brandfoot{position:fixed;bottom:0;left:0;right:0;border:0;margin:0;padding:0;font-size:9px;justify-content:center}
  .paper input,.paper select{border:0!important;background:none!important;-webkit-appearance:none;appearance:none;padding:0!important}
  @page{size:A4;margin:12mm}
}

 kiện thuế suất 0%)", "pg": 0.03, "gtgtTT": "Chịu thuế", "pt": 0.02, "dieuKien": "", "canCu": "GTGT: TT 69/2025 Điều 9, Phụ lục I (nhóm 3); TNDN: NĐ 320/2025 Điều 12 khoản 3; TT 20/2026 Điều 7", "trangThai": "ĐÃ ĐỐI CHIẾU"}, {"ma": "T11", "ten": "Vận tải quốc tế đủ điều kiện thuế suất 0% (đường biển, hàng không)", "pg": 0, "gtgtTT": "Thuế suất 0%", "pt": 0.02, "dieuKien": "Có hợp đồng vận chuyển chặng quốc tế, thanh toán không dùng tiền mặt. Có thể miễn TNDN theo hiệp định (hồ sơ Q24).", "canCu": "GTGT: Luật 48/2024 Điều 9; NĐ 181/2025; TNDN: NĐ 320/2025 Điều 12 khoản 3; TT 20/2026 Điều 7", "trangThai": "ĐÃ ĐỐI CHIẾU"}, {"ma": "T12", "ten": "Tiền bản quyền, chuyển giao công nghệ, quyền sở hữu trí tuệ, phần mềm", "pg": 0, "gtgtTT": "Không chịu thuế", "pt": 0.1, "dieuKien": "Dịch vụ số, quảng cáo trực tuyến KHÔNG phải \"phần mềm\" – dùng dòng T19. Hiệp định có thể giới hạn mức thấp hơn (ghi đè % TNDN).", "canCu": "GTGT: Luật 48/2024 Điều 5 khoản 21; TNDN: NĐ 320/2025 Điều 12 khoản 3; TT 20/2026 Điều 7", "trangThai": "ĐÃ ĐỐI CHIẾU"}, {"ma": "T13", "ten": "Lãi tiền vay (kể cả phí bên VN trả theo hợp đồng vay)", "pg": 0, "gtgtTT": "Không chịu thuế", "pt": 0.05, "dieuKien": "Dịch vụ cấp tín dụng không chịu GTGT.", "canCu": "GTGT: Luật 48/2024 Điều 5 khoản 9; TNDN: NĐ 320/2025 Điều 12 khoản 3; TT 20/2026 Điều 7", "trangThai": "ĐÃ ĐỐI CHIẾU"}, {"ma": "T14", "ten": "Chuyển nhượng chứng khoán, chứng chỉ tiền gửi", "pg": 0, "gtgtTT": "Không chịu thuế", "pt": 0.001, "dieuKien": "Doanh thu là tổng giá bán.", "canCu": "GTGT: Luật 48/2024 Điều 5 khoản 9; TNDN: NĐ 320/2025 Điều 12 khoản 3; TT 20/2026 Điều 7", "trangThai": "ĐÃ ĐỐI CHIẾU"}, {"ma": "T15", "ten": "Tái bảo hiểm ra nước ngoài, hoa hồng nhượng tái bảo hiểm", "pg": 0, "gtgtTT": "Không chịu thuế", "pt": 0.001, "dieuKien": "Doanh thu = phí nhượng tái bảo hiểm + hoa hồng + khoản thu khác.", "canCu": "GTGT: Luật 48/2024 Điều 5 khoản 8; NĐ 144/2026; TNDN: NĐ 320/2025 Điều 12 khoản 3; TT 20/2026 Điều 7", "trangThai": "ĐÃ ĐỐI CHIẾU"}, {"ma": "T16", "ten": "Bảo hiểm phi nhân thọ (thuộc diện chịu GTGT)", "pg": 0.05, "gtgtTT": "Chịu thuế", "pt": 0.05, "dieuKien": "NĐ 320 không liệt kê riêng bảo hiểm; 5% suy từ nhóm dịch vụ. Bảo hiểm nhân thọ, sức khỏe: không chịu GTGT.", "canCu": "GTGT: TT 69/2025 Điều 9, Phụ lục I; NĐ 320/2025 (nhóm dịch vụ)", "trangThai": "CẦN KIỂM CHỨNG"}, {"ma": "T17", "ten": "Dịch vụ tài chính phái sinh", "pg": 0, "gtgtTT": "Không chịu thuế", "pt": 0.02, "dieuKien": "", "canCu": "GTGT: Luật 48/2024 Điều 5 khoản 9; TNDN: NĐ 320/2025 Điều 12 khoản 3; TT 20/2026 Điều 7", "trangThai": "ĐÃ ĐỐI CHIẾU"}, {"ma": "T18", "ten": "Chuyển nhượng vốn của tổ chức nước ngoài", "pg": 0, "gtgtTT": "Không chịu thuế", "pt": 0.02, "dieuKien": "MỚI từ 15/12/2025: 2% trên doanh thu (trước đây 20% trên thu nhập). Tái cơ cấu nội bộ tập đoàn đủ 4 điều kiện thì không thuộc diện.", "canCu": "GTGT: Luật 48/2024 Điều 5 khoản 9; TNDN: NĐ 320/2025 Điều 12 khoản 3; TT 20/2026 Điều 7", "trangThai": "ĐÃ ĐỐI CHIẾU"}, {"ma": "T19", "ten": "Thương mại điện tử, nền tảng số của nhà cung cấp nước ngoài (quảng cáo trực tuyến, nội dung số, lưu trữ dữ liệu…)", "pg": 0.05, "gtgtTT": "Chịu thuế (5% hay 10% chưa thống nhất)", "pt": 0.05, "dieuKien": "TT 69 loại TMĐT khỏi bảng tỷ lệ GTGT; thực tế có nơi áp thuế suất 10%. Nhà cung cấp đã tự kê khai qua Cổng NCCNN thì chọn \"Nhà thầu tự nộp\", tránh khấu trừ trùng.", "canCu": "TNDN: NĐ 320/2025 Điều 12 khoản 1 điểm b4, khoản 3; GTGT: chưa thống nhất", "trangThai": "CẦN KIỂM CHỨNG"}, {"ma": "T20", "ten": "Sản xuất, kinh doanh khác, hoạt động khác", "pg": 0.02, "gtgtTT": "Chịu thuế", "pt": 0.02, "dieuKien": "", "canCu": "GTGT: TT 69/2025 Điều 9, Phụ lục I (nhóm 4); TNDN: NĐ 320/2025 Điều 12 khoản 3; TT 20/2026 Điều 7", "trangThai": "ĐÃ ĐỐI CHIẾU"}], "nghi": [{"ngay": "2026-01-01", "ten": "Tết Dương lịch 2026"}, {"ngay": "2026-02-16", "ten": "Tết Nguyên đán Bính Ngọ"}, {"ngay": "2026-02-17", "ten": "Tết Nguyên đán Bính Ngọ"}, {"ngay": "2026-02-18", "ten": "Tết Nguyên đán Bính Ngọ"}, {"ngay": "2026-02-19", "ten": "Tết Nguyên đán Bính Ngọ"}, {"ngay": "2026-02-20", "ten": "Tết Nguyên đán Bính Ngọ"}, {"ngay": "2026-04-27", "ten": "Nghỉ bù Giỗ Tổ Hùng Vương (26/4 là Chủ nhật)"}, {"ngay": "2026-04-30", "ten": "Ngày Giải phóng miền Nam"}, {"ngay": "2026-05-01", "ten": "Quốc tế Lao động"}, {"ngay": "2026-08-31", "ten": "Quốc khánh (hoán đổi – cần xác nhận)"}, {"ngay": "2026-09-01", "ten": "Quốc khánh"}, {"ngay": "2026-09-02", "ten": "Quốc khánh"}, {"ngay": "2026-11-24", "ten": "Ngày Văn hóa Việt Nam"}, {"ngay": "2027-01-01", "ten": "Tết Dương lịch 2027"}, {"ngay": "2027-02-04", "ten": "Tết Nguyên đán Đinh Mùi"}, {"ngay": "2027-02-05", "ten": "Tết Nguyên đán Đinh Mùi"}, {"ngay": "2027-02-08", "ten": "Tết Nguyên đán Đinh Mùi"}, {"ngay": "2027-02-09", "ten": "Tết Nguyên đán Đinh Mùi"}, {"ngay": "2027-02-10", "ten": "Tết Nguyên đán Đinh Mùi"}, {"ngay": "2027-04-16", "ten": "Giỗ Tổ Hùng Vương (dự kiến)"}, {"ngay": "2027-04-30", "ten": "Ngày Giải phóng miền Nam"}, {"ngay": "2027-05-03", "ten": "Nghỉ bù Quốc tế Lao động (1/5 là thứ Bảy)"}, {"ngay": "2027-09-02", "ten": "Quốc khánh"}, {"ngay": "2027-09-03", "ten": "Quốc khánh (dự kiến)"}, {"ngay": "2027-11-24", "ten": "Ngày Văn hóa Việt Nam"}], "check": [["Bên nhận tiền là tổ chức nước ngoài (không thành lập theo pháp luật Việt Nam) hoặc cá nhân nước ngoài?", "Có", "Chi nhánh, công ty con đã thành lập tại VN là doanh nghiệp VN – không phải thuế nhà thầu.", "Q01 – TT 69/2025 Điều 9 khoản 1, 2a; TT 20/2026 Điều 7 khoản 1"], ["Có hợp đồng, thỏa thuận với bên Việt Nam hoặc thu nhập phát sinh tại Việt Nam (kể cả qua thương mại điện tử, nền tảng số)?", "Có", "Gồm cả cam kết, thỏa thuận qua email, đơn đặt hàng, hóa đơn trên nền tảng.", "Q01 – TT 20/2026 Điều 7 khoản 1"], ["Chỉ cung cấp hàng hóa, giao tại cửa khẩu nước ngoài hoặc cửa khẩu Việt Nam (người bán chịu rủi ro đến cửa khẩu VN) và KHÔNG kèm dịch vụ nào tại Việt Nam?", "Không", "Có lắp đặt, chạy thử, bảo hành, bảo dưỡng tại VN (kể cả miễn phí) thì trả lời Không.", "Q02 – TT 69/2025 Điều 9 khoản 2 điểm b, c"], ["Dịch vụ được thực hiện và tiêu dùng hoàn toàn ngoài Việt Nam?", "Không", "Ví dụ: thuê khách sạn ở nước ngoài cho nhân viên đi công tác.", "Q02 – TT 69/2025 Điều 9 khoản 2; TT 20/2026 Điều 7 khoản 2"], ["Thuộc danh sách dịch vụ ở nước ngoài được loại trừ: sửa chữa phương tiện, máy móc ở nước ngoài; quảng cáo, tiếp thị ở nước ngoài (trừ trên internet); xúc tiến đầu tư, thương mại ở nước ngoài; môi giới bán hàng ra nước ngoài; đào tạo ở nước ngoài (trừ trực tuyến); chia cước bưu chính, viễn thông quốc tế?", "Không", "Quảng cáo trên Google, Facebook và đào tạo trực tuyến KHÔNG được loại trừ.", "Q02 – TT 69/2025 Điều 9 khoản 2 điểm d–h"], ["Nhà thầu đã đăng ký thuế để tự khai, nộp theo phương pháp kê khai hoặc hỗn hợp (có mã số thuế riêng, mẫu 04-ĐKT)?", "Không", "Có thì yêu cầu nhà thầu cung cấp thông báo mã số thuế, chứng từ nộp thuế; bên VN không khấu trừ.", "Q13 – TT 89/2026 Điều 30 khoản 1, 3; TT 90/2026"], ["Là nhà cung cấp nước ngoài kinh doanh thương mại điện tử, nền tảng số đã tự đăng ký (01/NCCNN), khai, nộp tại Việt Nam?", "Không", "Ví dụ nền tảng quảng cáo đã ghi rõ thuế VN trên hóa đơn và có mã số thuế NCCNN.", "Q14 – Luật 108/2025 Điều 12 khoản 2; NĐ 252/2026"], ["Nước của nhà thầu có hiệp định tránh đánh thuế hai lần với Việt Nam và nhà thầu cung cấp được giấy chứng nhận cư trú?", "Có", "Chỉ ảnh hưởng thuế TNDN; phải nộp hồ sơ theo Q24.", "Q24 – TT 89/2026 Điều 78; TT 95/2026"], ["Bên nhận tiền là cá nhân nước ngoài (không phải tổ chức)?", "Không", "Cá nhân: thuế GTGT nhà thầu + thuế TNCN thay cho TNDN.", "E10"]], "tinhHuong": [["E01", "Hợp đồng giá Net, dịch vụ 5% / 5%", "Tính doanh thu = Net / (1 − 5% − 5%) = Net / 0,9.", "Tính lần lượt: DT tính TNDN = Net / (1 − %TNDN); DT tính GTGT = (Net + TNDN) / (1 − %GTGT). Ví dụ Net 260 triệu: TNDN 13.684.211, GTGT 14.404.432 (không phải 14.444.444).", "Hợp đồng Net, bên VN nộp thay. TT 69/2025 Điều 9 khoản 5 điểm a; TT 20/2026 Điều 7. Thứ tự quy đổi là cách hiểu phổ biến – Q12."], ["E02", "Dẫn căn cứ Thông tư 103/2014 trong hồ sơ", "TT 103/2014 vẫn còn hiệu lực.", "TT 103 đã bị bãi bỏ: phần GTGT từ 01/7/2025 (TT 69/2025), phần TNDN từ kỳ tính thuế 2025 (TT 20/2026), toàn bộ từ 01/7/2026 (TT 89/2026 Điều 99). Dẫn TT 69, NĐ 320, TT 20, TT 89.", "Mọi hợp đồng; hợp đồng hỗn hợp ký trước 12/3/2026 được giữ cách tính TNDN cũ."], ["E03", "Mua bản quyền phần mềm của công ty nước ngoài", "Tính GTGT 5% như dịch vụ.", "Phần mềm, chuyển giao công nghệ, quyền sở hữu trí tuệ không chịu GTGT; TNDN tiền bản quyền 10%.", "Luật 48/2024 Điều 5 khoản 21; NĐ 320/2025 Điều 12 khoản 3. Không áp cho quảng cáo trực tuyến, dịch vụ số."], ["E04", "Chạy quảng cáo Google, Facebook, TikTok", "Quảng cáo ở nước ngoài nên không chịu thuế; hoặc khấu trừ dù nền tảng đã tự nộp.", "Quảng cáo trên internet KHÔNG được loại trừ. Nếu nền tảng đã đăng ký NCCNN và tự nộp: không khấu trừ trùng, lưu hóa đơn. Nếu không: bên VN khấu trừ nộp thay. % GTGT 5% hay 10% chưa thống nhất.", "TT 69/2025 Điều 9 khoản 2 điểm đ, khoản 6 điểm a; NĐ 252/2026 – CẦN KIỂM CHỨNG."], ["E05", "Cử nhân viên đi đào tạo ở nước ngoài và học trực tuyến", "Đào tạo nào của nước ngoài cũng không chịu thuế.", "Đào tạo thực hiện ở nước ngoài: không thuộc diện. Đào tạo trực tuyến cho người ở VN: thuộc diện, dịch vụ 5% / 5%.", "TT 69/2025 Điều 9 khoản 2 điểm h; TT 20/2026 Điều 7 khoản 2."], ["E06", "Mua máy móc kèm lắp đặt, chạy thử", "Chỉ có hàng hóa nên không chịu thuế nhà thầu.", "Có dịch vụ tại VN thì thuộc diện. Tách được giá trị: hàng TNDN 1% (GTGT đã nộp khâu nhập khẩu), dịch vụ 5% / 5%. Không tách được: GTGT 3%, TNDN 2% trên toàn bộ hợp đồng.", "TT 69/2025 Điều 9 khoản 3 điểm c, khoản 6 điểm c; NĐ 320/2025 Điều 12 khoản 3."], ["E07", "Trả lãi vay cho công ty mẹ ở nước ngoài", "Tính cả GTGT 5% trên lãi vay.", "Lãi vay không chịu GTGT; TNDN 5% trên toàn bộ lãi và phí. Hiệp định có thể quy định mức trần – chỉ có lợi khi thấp hơn 5%.", "Luật 48/2024 Điều 5 khoản 9; NĐ 320/2025 Điều 12 khoản 3; Q24."], ["E08", "Tháng không thanh toán cho nhà thầu", "Vẫn phải nộp tờ khai 01/NTNN không phát sinh.", "Từ 01/7/2026 bên VN khai theo tháng mà tháng không phát sinh khấu trừ thì không phải nộp hồ sơ.", "NĐ 252/2026 Điều 11 khoản 8."], ["E09", "Tính hạn khai từng lần", "Hạn là ngày thứ 10 tính cả ngày phát sinh (ngày PS + 9).", "Ngày thứ 10 kể từ ngày TIẾP THEO ngày phát sinh: phát sinh 14/11 thì hạn 24/11; trùng ngày nghỉ dời sang ngày làm việc kế tiếp.", "NĐ 252/2026 Điều 10 khoản 1."], ["E10", "Trả tiền cho cá nhân nước ngoài (chuyên gia, diễn giả)", "Khấu trừ TNDN theo tỷ lệ như tổ chức.", "Cá nhân: GTGT nhà thầu theo tỷ lệ; phần thu nhập chịu thuế TNCN – ngoài phạm vi phần mềm, kiểm tra riêng theo Luật Thuế TNCN.", "Luật Thuế TNCN – kiểm tra riêng."], ["E11", "Khấu trừ thuế GTGT đã nộp thay", "Khấu trừ ngay khi hạch toán thuế phải nộp.", "Chỉ khấu trừ khi đã nộp và có chứng từ nộp thuế; trước đó treo TK 1388. Bên VN nộp GTGT theo phương pháp trực tiếp thì không khấu trừ, tính vào chi phí.", "Luật 48/2024 Điều 14; TT 99/2025."], ["E12", "Thuế TNDN nộp thay khi hợp đồng giá Net", "Không được tính vào chi phí được trừ.", "Hợp đồng ghi bên VN chịu thuế (giá Net) thì thuế TNDN nộp thay là chi phí được trừ. Giá Gross: thuế trừ vào tiền trả nhà thầu, không ghi thêm chi phí.", "NĐ 320/2025 (theo hướng dẫn MISA) – CẦN KIỂM CHỨNG số điều."], ["E13", "Áp dụng hiệp định tránh đánh thuế hai lần", "Có giấy chứng nhận cư trú là tự giảm thuế được; giảm cả GTGT.", "Nộp mẫu 01/HTQT kèm giấy chứng nhận cư trú (hợp pháp hóa lãnh sự), bản sao hợp đồng cùng hồ sơ khai thuế lần đầu. Hiệp định chỉ giảm TNDN, không giảm GTGT. Xét đối tượng hưởng lợi với lãi vay, bản quyền.", "TT 89/2026 Điều 78; TT 95/2026."], ["E14", "Quyết toán khi kết thúc hợp đồng", "Luôn phải nộp 02/NTNN dù không thay đổi.", "Hạn ngày thứ 45 kể từ ngày kết thúc hợp đồng. Một số nguồn nêu chỉ phải nộp khi số thuế thay đổi so với đã khai – chưa tìm thấy điều khoản gốc.", "NĐ 252/2026 Điều 10 khoản 5 – CẦN KIỂM CHỨNG."], ["E15", "Tổ chức nước ngoài chuyển nhượng vốn", "Tính 20% trên thu nhập (lãi chuyển nhượng).", "Từ 15/12/2025: 2% trên doanh thu chuyển nhượng; không chịu GTGT. Bên nhận chuyển nhượng khấu trừ, nộp thay.", "NĐ 320/2025 Điều 12 khoản 3; TT 20/2026."], ["E16", "Giảm thuế GTGT 2% (NĐ 174/2025) đến 31/12/2026", "Tự giảm tỷ lệ % GTGT nhà thầu 20%.", "Chưa có nguồn khẳng định áp dụng cho nhà thầu nước ngoài. Chỉ giảm khi có hướng dẫn của cơ quan thuế (nhập ở Ghi đè % GTGT, ghi lý do).", "NĐ 174/2025 – CẦN KIỂM CHỨNG."], ["E17", "Tỷ giá quy đổi", "Dùng tỷ giá bán ra hoặc tỷ giá tùy chọn.", "Trước 01/7/2026: tỷ giá mua của ngân hàng thương mại nơi mở tài khoản. Từ 01/7/2026 có hướng dẫn dùng tỷ giá theo pháp luật hải quan – chưa có văn bản quy phạm rõ; ghi nguồn tỷ giá ở mỗi giao dịch.", "NĐ 252/2026 Điều 14 – CẦN KIỂM CHỨNG."]], "hoSo": [["Bên VN khấu trừ, nộp thay (phương pháp trực tiếp)", "Tờ khai 01/NTNN; lần đầu kèm bản sao hợp đồng. Đăng ký mã số thuế nộp thay: 04.1-ĐKT + BK04.1-ĐKT (TT 90/2026)", "Từng lần: ngày thứ 10 kể từ ngày tiếp theo ngày phát sinh. Nhiều lần trong tháng: khai theo tháng, hạn ngày 20 tháng sau; tháng không phát sinh không nộp."], ["Bên VN – quyết toán khi kết thúc hợp đồng", "02/NTNN + 02-1/NTNN (bảng kê nhà thầu) + 02-2/NTNN (nhà thầu phụ)", "Ngày thứ 45 kể từ ngày kết thúc hợp đồng. Nguồn thứ cấp: chỉ nộp khi số thuế thay đổi – CẦN KIỂM CHỨNG."], ["Nhà thầu tự nộp – phương pháp hỗn hợp (GTGT khấu trừ, TNDN theo tỷ lệ)", "03/NTNN (khai), 04/NTNN + 02-2/NTNN (quyết toán). Đăng ký 04-ĐKT + BK04-ĐKT", "Đăng ký trong 10 ngày làm việc kể từ ngày ký hợp đồng (NĐ 252/2026 Điều 6). Điều kiện chung sau khi TT 103 bị bãi bỏ – CẦN KIỂM CHỨNG."], ["Nhà thầu tự nộp – phương pháp kê khai", "Tờ khai GTGT (khấu trừ) và tờ khai TNDN như doanh nghiệp VN (TT 89/2026 Phụ lục I)", "Điều kiện: có cơ sở thường trú hoặc cư trú tại VN, hợp đồng từ 183 ngày, hạch toán kế toán VN."], ["Nhà cung cấp nước ngoài TMĐT, nền tảng số tự nộp", "Đăng ký 01/NCCNN; khai 02/NCCNN + 02-1/NCCNN", "Theo tháng hoặc từng lần (trước 01/7/2026 theo quý) – CẦN KIỂM CHỨNG điều khoản."], ["Miễn, giảm theo hiệp định tránh đánh thuế hai lần", "01/HTQT + giấy chứng nhận cư trú (hợp pháp hóa lãnh sự) + bản sao hợp đồng, giấy ủy quyền (nếu có)", "Nộp cùng hồ sơ khai thuế lần đầu (TT 89/2026 Điều 78). Năm sau chỉ nộp lại khi hợp đồng hoặc giấy chứng nhận thay đổi."]], "canCu": [["V01", "Luật Thuế GTGT 48/2024/QH15", "Tỷ lệ % GTGT trên doanh thu (Điều 12 khoản 2 điểm b); đối tượng không chịu thuế (Điều 5 khoản 8, 9, 21)", "01/07/2025", "https://dauthau.gxd.vn/van-ban/luat/luat-thue-GTGT-48-2024.html; https://thue.man.net.vn/26-nhom-hang-hoa-dich-vu-khong-chiu-thue-gtgt/", "ĐÃ ĐỐI CHIẾU"], ["V02", "Thông tư 69/2025/TT-BTC", "Điều 9: thuế GTGT nhà thầu nước ngoài (đối tượng, loại trừ, giá tính thuế, quy đổi Net); Phụ lục I nhóm ngành; bãi bỏ Điều 6, 9, 12, 15 TT 103", "01/07/2025", "https://vnuf.edu.vn/wp-content/uploads/2025/09/Thong-tu_69-2025-TT-BTC.pdf; https://assets.kpmg.com/content/dam/kpmg/vn/pdf/2025/07/decree-181-and-circular-69-vi.pdf", "ĐÃ ĐỐI CHIẾU"], ["V03", "Nghị định 181/2025/NĐ-CP (sửa bởi NĐ 144/2026)", "Giá tính thuế GTGT (Điều 13); NĐ 144/2026 bổ sung bảo hiểm, tái bảo hiểm không chịu GTGT", "01/07/2025; 20/06/2026", "https://pbgdpl.cantho.gov.vn/so-sanh-nghi-dinh-so-1442026nd-cp-va-nghi-dinh-so-1812025nd-cp-ve-thue-gia-tri-gia-tang", "CẦN KIỂM CHỨNG"], ["V04", "Nghị định 320/2025/NĐ-CP", "Điều 12 khoản 3: tỷ lệ % TNDN trên doanh thu của doanh nghiệp nước ngoài; Điều 8: doanh thu", "15/12/2025", "https://hethongphapluat.com/nghi-dinh-320-2025-nd-cp-huong-dan-luat-thue-thu-nhap-doanh-nghiep/dieu-12; https://xcyber.vn/phuong-phap-tinh-thue-tndn-theo-nghi-dinh-320-moi-nhat/", "ĐÃ ĐỐI CHIẾU"], ["V05", "Thông tư 20/2026/TT-BTC", "Điều 7: thuế TNDN nhà thầu (đối tượng, loại trừ, doanh thu tính thuế, quy đổi); bãi bỏ phần TNDN của TT 103", "12/03/2026 (áp dụng từ kỳ tính thuế 2025)", "https://dhtaxlaw.com.vn/huong-dan-xac-dinh-thue-tn
